<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>2026 一起背單字 (國中組) - [W01] 2026/09/03 (四)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary-color: #0369a1;
      --accent-orange: #ea580c;
      --slide-width: 1200px;
      --slide-height: 675px;
    }

    body {
      font-family: 'Fredoka', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f172a;
      color: #1e293b;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      min-height: 100dvh;
      user-select: none;
      -webkit-user-select: none;
    }

    #viewport-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* 桌機與橫向模式：保持 1200x675 簡報自適應縮放 */
    @media (min-width: 768px) {
      #presentation-stage {
        position: relative;
        width: var(--slide-width);
        height: var(--slide-height);
        transform-origin: center center;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
        border-radius: 28px;
        background-color: #ffffff;
        overflow: hidden;
        flex-shrink: 0;
      }
    }

    /* 手機直向模式：滿版 RWD 自適應與滾動支援 */
    @media (max-width: 767px) {
      body {
        overflow: hidden;
      }
      #presentation-stage {
        width: 100vw !important;
        height: 100dvh !important;
        transform: none !important;
        border-radius: 0 !important;
        border: none !important;
      }
      .mobile-slide-scroll {
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch;
      }
    }

    .slide-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: scale(0.985);
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }

    .slide-view.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      pointer-events: auto;
    }

    .card-shadow {
      box-shadow: 0 8px 24px -4px rgba(3, 105, 161, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #93c5fd;
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #0284c7;
    }
  </style>
</head>
<body>

  <div id="viewport-wrapper">
    <main id="presentation-stage" class="relative flex flex-col justify-between bg-gradient-to-br from-sky-50 via-white to-blue-50 border-4 border-sky-200">
      
      <!-- Slide Content Area (No top header bar) -->
      <div id="slides-container" class="relative flex-1 w-full h-full overflow-hidden">
        
        <!-- COVER SLIDE (Strictly 3 Elements: Title, Date, Category Tags) -->
        <section class="slide-view active p-6 md:p-10 flex flex-col items-center justify-center text-center relative overflow-y-auto" data-title="封面 (Cover)">
          <div class="max-w-3xl flex flex-col items-center justify-center my-auto">
            
            <!-- 1. Big Main Title -->
            <h2 class="text-4xl md:text-6xl font-black text-sky-900 tracking-wide mb-6 md:mb-8 drop-shadow-sm font-['Fredoka']">
              2026 一起背單字 <br class="block md:hidden"/><span class="text-orange-600">(國中組)</span>
            </h2>

            <!-- 2. Date -->
            <div class="text-lg md:text-2xl font-bold text-slate-700 bg-white/95 px-6 md:px-8 py-2.5 md:py-3.5 rounded-2xl border-2 border-sky-200 shadow-sm mb-6 md:mb-8">
              📅 [W01] 2026/09/03 (四)
            </div>

            <!-- 3. Category Tags -->
            <div id="cover-categories" class="flex flex-wrap justify-center gap-2 md:gap-3.5 max-w-xl">
              <span class="px-4 md:px-5 py-2 md:py-2.5 rounded-xl bg-orange-50 text-orange-700 text-base md:text-xl font-bold border border-orange-200 shadow-sm">
                🏷️ 人物與稱謂 (6字)
              </span>
              <span class="px-4 md:px-5 py-2 md:py-2.5 rounded-xl bg-teal-50 text-teal-700 text-base md:text-xl font-bold border border-teal-200 shadow-sm">
                🏷️ 方位與空間 (3字)
              </span>
              <span class="px-4 md:px-5 py-2 md:py-2.5 rounded-xl bg-sky-50 text-sky-700 text-base md:text-xl font-bold border border-sky-200 shadow-sm">
                🏷️ 介系詞 (1字)
              </span>
            </div>

            <p class="text-slate-400 text-sm mt-8 block md:hidden">👆 左右滑動或點擊下方按鈕翻頁</p>
          </div>
        </section>

      </div>

      <!-- Bottom Control Bar -->
      <footer class="w-full px-4 md:px-8 py-2.5 md:py-3 bg-white/95 border-t border-sky-100 flex flex-col gap-2 z-20 shrink-0">
        <!-- Progress bar line -->
        <div class="w-full bg-slate-100 h-1.5 md:h-2 rounded-full overflow-hidden border border-slate-200">
          <div id="progress-bar-fill" class="bg-gradient-to-r from-sky-500 to-orange-400 h-full w-0 transition-all duration-300"></div>
        </div>

        <div class="flex items-center justify-between">
          <!-- Left: Prev & Pronounce Button -->
          <div class="flex items-center gap-1.5 md:gap-2">
            <button id="prev-btn" onclick="prevSlide()" class="flex items-center gap-1 px-3 md:px-4 py-1.5 md:py-2 rounded-xl bg-sky-100 hover:bg-sky-200 active:bg-sky-300 text-sky-900 font-bold text-xs md:text-sm transition shadow-sm disabled:opacity-40 disabled:cursor-not-allowed">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
              <span class="hidden sm:inline">上一頁</span>
            </button>
            <button id="read-current-btn" onclick="speakCurrentWord()" class="flex items-center gap-1 px-3 md:px-3.5 py-1.5 md:py-2 rounded-xl bg-orange-100 hover:bg-orange-200 active:bg-orange-300 text-orange-900 font-bold text-xs md:text-sm transition shadow-sm" title="朗讀此頁單字">
              <i data-lucide="volume-2" class="w-4 h-4 text-orange-600"></i>
              <span>朗讀</span>
            </button>
          </div>

          <!-- Middle: Direct Jump Dropdown & Counter -->
          <div class="flex items-center gap-2 md:gap-3">
            <span id="slide-indicator" class="text-xs md:text-sm font-bold text-slate-600">1 / 10</span>
            <div class="relative">
              <select id="slide-selector" onchange="goToSlide(parseInt(this.value))" class="appearance-none bg-slate-50 border border-slate-300 hover:border-sky-400 text-slate-700 text-xs font-bold rounded-lg pl-2 md:pl-3 pr-7 md:pr-8 py-1 md:py-1.5 focus:outline-none focus:ring-2 focus:ring-sky-500 max-w-[110px] sm:max-w-none truncate">
                <!-- Populated dynamically via JS -->
              </select>
              <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-500 absolute right-2 top-2 pointer-events-none"></i>
            </div>
          </div>

          <!-- Right: Next Button & Fullscreen -->
          <div class="flex items-center gap-1.5 md:gap-2">
            <button id="next-btn" onclick="nextSlide()" class="flex items-center gap-1 px-4 md:px-5 py-1.5 md:py-2 rounded-xl bg-sky-600 hover:bg-sky-700 active:bg-sky-800 text-white font-bold text-xs md:text-sm transition shadow-md disabled:opacity-40 disabled:cursor-not-allowed">
              <span>下一頁</span>
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>

            <!-- Fullscreen Button -->
            <button id="fullscreen-btn" onclick="toggleFullscreen()" class="flex items-center justify-center p-2 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 text-slate-700 transition shadow-sm" title="切換全螢幕 (F)">
              <i id="fullscreen-icon" data-lucide="maximize" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </footer>

    </main>
  </div>

  <script>
    // 1. Vocabulary Dataset for [W01] 2026/09/03 (四)
    const rawWords = [
      { week: 1, day: 4, word: "sir", zh: "先生;長官", pos: "n.", category: "人物與稱謂", collocations: "Yes, sir. (是的，長官/先生。) / Dear Sir (敬啟者)", sentence: "May I help you with your bags, sir?", sentenceZh: "先生，需要我幫您拿行李嗎？" },
      { week: 1, day: 4, word: "Miss", zh: "小姐", pos: "n. | v. 想念/錯過", category: "人物與稱謂", collocations: "Miss Lee (李小姐) / young miss (年輕小姐)", sentence: "Miss Lin will give a speech this afternoon.", sentenceZh: "林小姐今天下午將發表演講。" },
      { week: 1, day: 4, word: "Mrs.", zh: "女士;太太", pos: "n.", category: "人物與稱謂", collocations: "Mrs. Smith (史密斯太太) / meet Mrs. (遇見…太太)", sentence: "Mrs. Chen made delicious cookies for the class.", sentenceZh: "陳太太為全班烤了美味的手工餅乾。" },
      { week: 1, day: 4, word: "that", zh: "那個", pos: "pron. | adj. | conj.", category: "人物與稱謂", collocations: "that one (那一個) / after that (在那之後)", sentence: "That is the bicycle I want to buy.", sentenceZh: "那就是我想買的腳踏車。" },
      { week: 1, day: 4, word: "with", zh: "和…一起", pos: "prep.", category: "介系詞", collocations: "agree with (同意) / stay with (與…同住/陪伴)", sentence: "I usually study with my classmates after school.", sentenceZh: "我放學後通常和同學一起讀書。" },
      { week: 1, day: 4, word: "ahead", zh: "向前;領先", pos: "adv.", category: "方位與空間", collocations: "go ahead (前進；請便) / ahead of time (提前)", sentence: "Look ahead and keep walking straight.", sentenceZh: "往前看，然後繼續直走。" },
      { week: 1, day: 1, word: "around", zh: "在...四周", pos: "prep. | adv. 大約", category: "方位與空間", collocations: "look around (環顧四周) / around the world (全世界)", sentence: "The students gathered around the teacher to listen.", sentenceZh: "學生們圍在老師四周聆聽。" },
      { week: 1, day: 4, word: "away", zh: "離開;遠離", pos: "adv.", category: "方位與空間", collocations: "go away (走開；離開) / stay away (遠離)", sentence: "He threw away the trash on his way home.", sentenceZh: "他在回家路上把垃圾扔掉了。" },
      { week: 1, day: 4, word: "speaker", zh: "演講者；擴音器", pos: "n.", category: "人物與稱謂", collocations: "guest speaker (特邀演講者) / bluetooth speaker (藍牙喇叭)", sentence: "The speaker gave an inspiring talk about reading.", sentenceZh: "演講者發表了一場關於閱讀的啟發性演說。" },
      { week: 1, day: 4, word: "stranger", zh: "陌生人", pos: "n.", category: "人物與稱謂", collocations: "total stranger (完全陌生的人) / stranger to (對…感到陌生)", sentence: "Don't accept gifts or food from a stranger.", sentenceZh: "不要接受陌生人給的禮物或食物。" }
    ];

    // 2. Supplementary Focus Data (國中重點補充資料庫)
    const supplementaryData = {
      "sir": {
        forms: "女性對應稱謂：ma'am (女士/長官夫人)；發音為 /sɝ/",
        grammar: "稱呼成年男性以示禮貌或尊稱長官；通常「單獨使用」，不直接加姓氏 (例如：Yes, sir.)。",
        phrases: "Dear Sir (信件敬啟者) / Yes, sir. (遵命；是的，長官) / sir or madam (先生或女士)",
        examPoint: "稱謂辨析：sir 與 ma'am 不加姓氏單獨使用；而 Mr. / Mrs. / Miss / Ms. 後面必須接姓氏或全名。"
      },
      "Miss": {
        forms: "名詞複數 Misses；動詞 miss (錯過；想念，三態 miss - missed - missed)",
        grammar: "作為尊稱時首字母大寫，後面接未婚女性的「姓氏」或「全名」(例如：Miss Lin)。",
        phrases: "Miss Right (真命天女) / miss the bus (錯過公車) / miss doing sth (錯過做某事)",
        examPoint: "稱謂辨析：Miss (未婚小姐), Mrs. (已婚太太), Ms. (女士，不分婚否)。作動詞時 miss + V-ing。"
      },
      "Mrs.": {
        forms: "Mistress 的縮寫；發音為 /ˈmɪs.ɪz/；複數為 Mmes. (Mesdames)",
        grammar: "用於稱呼「已婚女性」，後面必須接丈夫的姓氏或全名 (例如：Mrs. Smith)。",
        phrases: "meet Mrs. (遇見…太太) / Mrs. Chen (陳太太)",
        examPoint: "美式英文縮寫帶縮寫點「Mrs.」，英式為「Mrs」。現代社會常以中性的「Ms.」取代以避免探詢婚姻狀態。"
      },
      "that": {
        forms: "指示代名詞單數 that ➔ 複數 those；相反詞：this (這個) ➔ these (這些)",
        grammar: "可作指示代名詞、指示形容詞 (that car) 或引導名詞子句與關係代名詞。",
        phrases: "after that (在那之後) / that's why (那就是為什麼…) / that is to say (也就是說)",
        examPoint: "比較句型常考 that 代替前面提過的單數名詞 (如 The climate of Taipei is warmer than that of Tokyo.)。"
      },
      "with": {
        forms: "介系詞 (和…一起；帶有；使用…工具)；相反詞：without (沒有；無)",
        grammar: "後方接名詞、代名詞 (受格) 或 V-ing。表工具：write with a pen；表伴隨：with a smile。",
        phrases: "agree with sb (同意某人) / stay with (陪伴/同住) / have nothing to do with (與…無關)",
        examPoint: "主詞 + with + 受詞時，主詞為前者，動詞單複數由主要主詞決定 (例: John with his friends is here.)。"
      },
      "ahead": {
        forms: "副詞 (向前；在前面；提前)；同義詞：forward (向前)",
        grammar: "常與 of 搭配：ahead of (在…之前；領先…)。",
        phrases: "go ahead (前進；請便/做吧) / ahead of time (提前) / look ahead (向前看；展望未來)",
        examPoint: "日常會考情境對話：Go ahead! (請便！/ 做吧！)，用於同意對方的請求許可 (May I sit here? — Go ahead!)。"
      },
      "around": {
        forms: "介系詞 (在…四周；環繞)；副詞 (在周圍；大約 = about / approximately)",
        grammar: "表示時間或數字的大約：around 5 o'clock (大約五點) / around 50 people。",
        phrases: "look around (環顧四周) / travel around the world (環遊世界) / all year around (一整年)",
        examPoint: "方位與動作搭配：walk around the lake (繞著湖散步)；turn around (轉身)。"
      },
      "away": {
        forms: "副詞 (離開；在距離…處；遠離)",
        grammar: "常與動詞連用表示離開或消除狀態 (如 run away, throw away, give away)。",
        phrases: "go away (走開) / stay away from (遠離) / right away (立刻；馬上) / pass away (逝世)",
        examPoint: "動詞片語考點：throw away (丟棄)；受詞為代名詞時須置於中間 (throw it away，不可寫 throw away it)。"
      },
      "speaker": {
        forms: "名詞複數 speakers；動詞 speak (三態 speak - spoke - spoken)；名詞 speech (演講)",
        grammar: "由 speak (說話) + -er (人/器具) 組成，可指「演講者」或硬體「揚聲器/喇叭」。",
        phrases: "native speaker (母語人士) / guest speaker (特邀演講者) / bluetooth speaker (藍牙喇叭)",
        examPoint: "字尾衍生字：動詞 speak ➔ 名詞 speaker (演講者/音響) ➔ 抽象名詞 speech (演講/言論)。"
      },
      "stranger": {
        forms: "名詞複數 strangers；形容詞 strange (奇怪的；陌生的)；副詞 strangely",
        grammar: "由 strange + -er 組成，指「陌生人」。常搭配介系詞 to (a stranger to the city)。",
        phrases: "total stranger (完全陌生的人) / don't talk to strangers (不要跟陌生人說話)",
        examPoint: "字彙辨析：stranger 指「陌生人」；foreigner 指「外國人」；newcomer 指「新來的人」。"
      }
    };

    // 3. Pronunciation Override Mapping (TTS Speech Correction)
    const pronunciationOverrides = {
      "I": "eye",
      "Mr.": "Mister",
      "Mrs.": "Missus",
      "Ms.": "Mizz",
      "Miss": "Miss",
      "sir": "sir",
      "MRT": "M R T",
      "USA": "U S A",
      "e.g.": "for example",
      "i.e.": "that is"
    };

    let currentSlideIndex = 0;
    const totalSlides = rawWords.length + 1; // +1 for Cover slide
    let autoSpeechEnabled = true;

    // DOM Elements
    const slidesContainer = document.getElementById('slides-container');
    const slideSelector = document.getElementById('slide-selector');
    const slideIndicator = document.getElementById('slide-indicator');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    function buildSlides() {
      // 1. Cover option in select
      const coverOpt = document.createElement('option');
      coverOpt.value = "0";
      coverOpt.textContent = "00. 封面";
      slideSelector.appendChild(coverOpt);

      // 2. Generate each word slide
      rawWords.forEach((item, idx) => {
        const slideNum = idx + 1;
        const supp = supplementaryData[item.word] || {
          forms: "常規形態變化",
          grammar: "國中基礎核心必考單字。",
          phrases: item.collocations,
          examPoint: "注意單字拼寫與句子搭配用法。"
        };

        // Dropdown Option
        const opt = document.createElement('option');
        opt.value = slideNum.toString();
        opt.textContent = `${String(slideNum).padStart(2, '0')}. ${item.word} (${item.zh})`;
        slideSelector.appendChild(opt);

        // Word Slide Element
        const slideEl = document.createElement('section');
        slideEl.className = "slide-view p-3.5 md:p-7 flex flex-col justify-between mobile-slide-scroll";
        slideEl.dataset.title = `${item.word} (${item.zh})`;
        slideEl.dataset.day = `Day ${item.day}`;
        slideEl.dataset.category = item.category;
        slideEl.dataset.word = item.word;

        slideEl.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-12 gap-3.5 md:gap-5 h-full items-stretch">
            
            <!-- LEFT COLUMN -->
            <div class="col-span-1 md:col-span-7 flex flex-col justify-between gap-3 md:gap-0 md:h-[510px]">
              
              <!-- Word Title & POS Badge Row -->
              <div class="flex items-center justify-between bg-white/95 px-4 md:px-6 py-2.5 md:py-3.5 rounded-2xl border-2 border-sky-200 card-shadow">
                <div class="flex items-baseline gap-2.5 md:gap-4 flex-wrap">
                  <span class="text-4xl md:text-[64px] font-black text-orange-600 tracking-tight leading-none drop-shadow-sm font-['Fredoka']">
                    ${item.word}
                  </span>
                  <div class="px-3 md:px-4 py-1 md:py-1.5 rounded-full bg-sky-100/90 text-sky-800 border border-sky-300 font-bold text-lg md:text-[26px] shadow-sm flex items-center gap-1.5">
                    <span class="text-sky-950 font-bold">${item.zh}</span>
                    <span class="text-sky-600 font-medium text-sm md:text-[22px] ml-1 bg-sky-200/60 px-2 md:px-2.5 py-0.5 rounded-md">${item.pos}</span>
                  </div>
                </div>
                <button onclick="speakText('${item.word}')" class="p-2 md:p-3 bg-orange-500 hover:bg-orange-600 active:scale-95 text-white rounded-xl md:rounded-2xl shadow-md transition-transform flex items-center justify-center shrink-0" title="朗讀單字 (TTS)">
                  <i data-lucide="volume-2" class="w-5 h-5 md:w-7 md:h-7"></i>
                </button>
              </div>

              <!-- Collocation Card -->
              <div class="bg-gradient-to-br from-white to-sky-50/60 p-3 md:p-4 rounded-2xl border-2 border-sky-100 card-shadow flex flex-col justify-center min-h-[110px] md:h-[185px]">
                <div class="flex items-center gap-2 mb-1.5 md:mb-2">
                  <span class="p-1 md:p-1.5 bg-sky-600 text-white rounded-lg flex items-center justify-center shadow-xs">
                    <i data-lucide="link-2" class="w-3.5 h-3.5 md:w-4 md:h-4"></i>
                  </span>
                  <h3 class="text-base md:text-[24px] font-extrabold text-sky-900 tracking-tight">常用搭配詞 (Collocations)</h3>
                </div>
                <div class="text-base md:text-[23px] font-semibold text-slate-700 bg-white/80 p-2.5 md:p-3 rounded-xl border border-sky-100 leading-snug">
                  ${item.collocations}
                </div>
              </div>

              <!-- Sentence Card -->
              <div class="bg-gradient-to-br from-white to-amber-50/40 p-3 md:p-4 rounded-2xl border-2 border-orange-100 card-shadow flex flex-col justify-center min-h-[140px] md:h-[225px]">
                <div class="flex items-center justify-between mb-1.5 md:mb-2">
                  <div class="flex items-center gap-2">
                    <span class="p-1 md:p-1.5 bg-orange-500 text-white rounded-lg flex items-center justify-center shadow-xs">
                      <i data-lucide="message-square-quote" class="w-3.5 h-3.5 md:w-4 md:h-4"></i>
                    </span>
                    <h3 class="text-base md:text-[24px] font-extrabold text-orange-950 tracking-tight">實用例句 (Example)</h3>
                  </div>
                  <button onclick="speakSentence('${item.sentence.replace(/'/g, "\\'")}')" class="text-orange-600 hover:text-orange-800 text-xs md:text-sm font-bold flex items-center gap-1 bg-orange-100/80 px-2 md:px-2.5 py-1 rounded-lg">
                    <i data-lucide="volume-1" class="w-3 h-3 md:w-3.5 md:h-3.5"></i>
                    <span>朗讀</span>
                  </button>
                </div>
                <div class="bg-white/80 p-2.5 md:p-3 rounded-xl border border-orange-100 flex flex-col gap-1 md:gap-1.5 justify-center flex-1">
                  <p class="text-base md:text-[25px] font-bold text-slate-800 leading-snug tracking-normal">
                    ${item.sentence}
                  </p>
                  <p class="text-sm md:text-[23px] font-medium text-slate-600 leading-tight">
                    ${item.sentenceZh}
                  </p>
                </div>
              </div>

            </div>

            <!-- RIGHT COLUMN (Focus Panel) -->
            <div class="col-span-1 md:col-span-5 w-full md:h-[510px] bg-white rounded-2xl border-2 border-sky-300 card-shadow flex flex-col p-3.5 md:p-5 justify-between mb-2 md:mb-0">
              
              <!-- Header -->
              <div class="flex items-center gap-2 pb-2 border-b border-sky-200">
                <span class="p-1 md:p-1.5 bg-sky-700 text-white rounded-lg">
                  <i data-lucide="graduation-cap" class="w-4 h-4 md:w-5 md:h-5"></i>
                </span>
                <h3 class="text-base md:text-[25px] font-black text-sky-900 tracking-tight">國中重點補充 (Exam Focus)</h3>
              </div>

              <!-- Content items -->
              <div class="flex-1 overflow-y-visible md:overflow-y-auto pr-0 md:pr-1 py-2 flex flex-col gap-2.5 md:gap-3 custom-scroll">
                
                <!-- Forms -->
                <div class="bg-sky-50/80 p-2.5 md:p-3 rounded-xl border border-sky-200">
                  <div class="text-sm md:text-[25px] font-black text-sky-900 flex items-center gap-1 mb-0.5 md:mb-1">
                    <span>🔹</span> <span>變化 / 格位 / 形態</span>
                  </div>
                  <div class="text-sm md:text-[23px] font-medium text-slate-700 leading-snug">
                    ${supp.forms}
                  </div>
                </div>

                <!-- Exam Focus Point -->
                <div class="bg-orange-50/80 p-2.5 md:p-3 rounded-xl border border-orange-200">
                  <div class="text-sm md:text-[25px] font-black text-orange-950 flex items-center gap-1 mb-0.5 md:mb-1">
                    <span>🎯</span> <span>會考常考要點</span>
                  </div>
                  <div class="text-sm md:text-[23px] font-medium text-slate-700 leading-snug">
                    ${supp.examPoint}
                  </div>
                </div>

                <!-- Phrases & Grammar -->
                <div class="bg-slate-50 p-2.5 md:p-3 rounded-xl border border-slate-200">
                  <div class="text-sm md:text-[25px] font-black text-slate-900 flex items-center gap-1 mb-0.5 md:mb-1">
                    <span>💡</span> <span>常用片語與文法</span>
                  </div>
                  <div class="text-sm md:text-[23px] font-medium text-slate-700 leading-snug">
                    ${supp.phrases}
                  </div>
                  ${supp.grammar ? `<div class="text-xs md:text-[21px] text-slate-500 mt-1 border-t border-slate-200 pt-1 leading-tight">${supp.grammar}</div>` : ''}
                </div>

              </div>

              <!-- Footer Tag in Panel -->
              <div class="pt-2 border-t border-slate-100 flex justify-between items-center text-[10px] md:text-xs font-semibold text-slate-400">
                <span>單字編號：W01-D4-#${slideNum}</span>
                <span class="text-sky-600 bg-sky-50 px-2 py-0.5 rounded">會考必備單字</span>
              </div>

            </div>

          </div>
        `;
        slidesContainer.appendChild(slideEl);
      });

      // Render Lucide icons
      lucide.createIcons();
    }

    function updateSlideUI() {
      const slides = document.querySelectorAll('.slide-view');
      slides.forEach((slide, idx) => {
        if (idx === currentSlideIndex) {
          slide.classList.add('active');
          slide.scrollTop = 0;
        } else {
          slide.classList.remove('active');
        }
      });

      slideSelector.value = currentSlideIndex.toString();
      slideIndicator.textContent = `${currentSlideIndex} / ${totalSlides - 1}`;
      if (currentSlideIndex === 0) {
        slideIndicator.textContent = `封面 / ${totalSlides - 1}`;
      }

      const progressPercent = (currentSlideIndex / (totalSlides - 1)) * 100;
      progressBarFill.style.width = `${progressPercent}%`;

      prevBtn.disabled = currentSlideIndex === 0;
      nextBtn.disabled = currentSlideIndex === totalSlides - 1;

      const currentSlide = slides[currentSlideIndex];

      if (autoSpeechEnabled && currentSlideIndex > 0) {
        const wordToSpeak = currentSlide.dataset.word;
        if (wordToSpeak) {
          speakText(wordToSpeak);
        }
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < totalSlides) {
        currentSlideIndex = index;
        updateSlideUI();
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        goToSlide(currentSlideIndex - 1);
      }
    }

    function nextSlide() {
      if (currentSlideIndex < totalSlides - 1) {
        goToSlide(currentSlideIndex + 1);
      }
    }

    // 全螢幕切換功能
    function toggleFullscreen() {
      const isMobile = window.innerWidth < 768;
      
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        } else if (isMobile) {
          window.scrollTo(0, 1);
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    function updateFullscreenIcon() {
      const icon = document.getElementById('fullscreen-icon');
      if (!icon) return;
      const isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement);
      icon.setAttribute('data-lucide', isFullscreen ? 'minimize' : 'maximize');
      lucide.createIcons();
    }

    function getPhoneticCorrectedText(text) {
      const trimmed = text.trim();
      if (pronunciationOverrides[trimmed]) {
        return pronunciationOverrides[trimmed];
      }
      return text;
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const correctedText = getPhoneticCorrectedText(text);
      const utterance = new SpeechSynthesisUtterance(correctedText);
      utterance.lang = 'en-US';
      utterance.rate = 0.88;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.startsWith('en-US') || v.lang.startsWith('en'));
      if (enVoice) {
        utterance.voice = enVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    function speakSentence(sentence) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(sentence);
      utterance.lang = 'en-US';
      utterance.rate = 0.92;
      window.speechSynthesis.speak(utterance);
    }

    function speakCurrentWord() {
      if (currentSlideIndex === 0) {
        speakSentence("Welcome to English vocabulary practice!");
        return;
      }
      const currentSlide = document.querySelectorAll('.slide-view')[currentSlideIndex];
      if (currentSlide && currentSlide.dataset.word) {
        speakText(currentSlide.dataset.word);
      }
    }

    function fitPresentationStage() {
      const stage = document.getElementById('presentation-stage');
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      // 手機直向模式 (< 768px)：由 CSS RWD 自動滿版，不進行 transform scale
      if (windowWidth < 768) {
        stage.style.transform = 'none';
        return;
      }

      // 桌機/平板橫向模式：保持 1200x675 比例自適應縮放
      const baseWidth = 1200;
      const baseHeight = 675;
      const scaleX = (windowWidth * 0.96) / baseWidth;
      const scaleY = (windowHeight * 0.96) / baseHeight;
      const scale = Math.min(scaleX, scaleY, 1.15);

      stage.style.transform = `scale(${scale})`;
    }

    function initInteractions() {
      // 鍵盤操作
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          prevSlide();
        } else if (e.key === 'Home') {
          e.preventDefault();
          goToSlide(0);
        } else if (e.key === 'End') {
          e.preventDefault();
          goToSlide(totalSlides - 1);
        } else if (e.key.toLowerCase() === 'f') {
          e.preventDefault();
          toggleFullscreen();
        }
      });

      // 監聽全螢幕變化
      document.addEventListener('fullscreenchange', () => {
        updateFullscreenIcon();
        fitPresentationStage();
      });
      document.addEventListener('webkitfullscreenchange', () => {
        updateFullscreenIcon();
        fitPresentationStage();
      });

      // 手機觸控左右滑動
      let touchStartX = 0;
      let touchStartY = 0;
      const stage = document.getElementById('presentation-stage');

      stage.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      stage.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 50) {
          if (diffX < 0) {
            nextSlide();
          } else {
            prevSlide();
          }
        }
      }, { passive: true });

      window.addEventListener('resize', fitPresentationStage);
      window.addEventListener('orientationchange', fitPresentationStage);
    }

    window.onload = function() {
      buildSlides();
      fitPresentationStage();
      initInteractions();
      updateSlideUI();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }
    };
  </script>
