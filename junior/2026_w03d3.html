<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 一起背單字 (國中組) - [W03] 2026/09/16 (三)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary-color: #0369a1;
      --accent-orange: #ea580c;
      --slide-width: 1200px;
      --slide-height: 675px;
    }

    body {
      font-family: 'Fredoka', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f172a;
      color: #1e293b;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Desktop/Tablet 16:9 Stage Viewport */
    #viewport-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #presentation-stage {
      position: relative;
      width: var(--slide-width);
      height: var(--slide-height);
      transform-origin: center center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      border-radius: 28px;
      background-color: #ffffff;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.15s ease-out;
    }

    .slide-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: scale(0.985);
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }

    .slide-view.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      pointer-events: auto;
    }

    .card-shadow {
      box-shadow: 0 8px 24px -4px rgba(3, 105, 161, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #93c5fd;
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #0284c7;
    }

    /* Responsive adjustments for Mobile Portrait (< 768px) */
    @media (max-width: 767px) {
      body {
        overflow: auto;
      }
      #viewport-wrapper {
        align-items: stretch;
        height: 100vh;
        height: 100dvh;
      }
      #presentation-stage {
        width: 100% !important;
        height: 100% !important;
        transform: none !important;
        border-radius: 0 !important;
        border-width: 0 !important;
        box-shadow: none !important;
      }
      .slide-view {
        position: relative;
        height: 100%;
        overflow-y: auto;
        padding: 1rem !important;
        -webkit-overflow-scrolling: touch;
      }
      .slide-view:not(.active) {
        display: none !important;
      }
      .mobile-deck-grid {
        display: flex !important;
        flex-direction: column !important;
        gap: 1rem !important;
        height: auto !important;
      }
      .mobile-card-fix {
        width: 100% !important;
        height: auto !important;
        min-height: auto !important;
      }
    }
  </style>
</head>
<body>

  <div id="viewport-wrapper">
    <main id="presentation-stage" class="relative flex flex-col justify-between bg-gradient-to-br from-sky-50 via-white to-blue-50 border-4 border-sky-200">
      
      <!-- Slide Content Area (No top header bar) -->
      <div id="slides-container" class="relative flex-1 w-full h-full overflow-hidden">
        
        <!-- COVER SLIDE (Strictly 3 Elements: Title, Date, Category Tags) -->
        <section class="slide-view active p-6 md:p-10 flex flex-col items-center justify-center text-center relative" data-title="封面 (Cover)">
          <div class="max-w-3xl flex flex-col items-center justify-center my-auto">
            
            <!-- 1. Big Main Title -->
            <h2 class="text-4xl sm:text-5xl md:text-6xl font-black text-sky-900 tracking-wide mb-6 md:mb-8 drop-shadow-sm font-['Fredoka']">
              2026 一起背單字 <span class="text-orange-600">(國中組)</span>
            </h2>

            <!-- 2. Date -->
            <div class="text-lg sm:text-xl md:text-2xl font-bold text-slate-700 bg-white/95 px-6 md:px-8 py-2.5 md:py-3.5 rounded-2xl border-2 border-sky-200 shadow-sm mb-6 md:mb-8">
              📅 [W03] 2026/09/16 (三)
            </div>

            <!-- 3. Category Tags -->
            <div id="cover-categories" class="flex flex-wrap justify-center gap-3 md:gap-3.5 max-w-xl">
              <span class="px-4 md:px-5 py-2 md:py-2.5 rounded-xl bg-teal-50 text-teal-700 text-base md:text-xl font-bold border border-teal-200 shadow-sm">
                🏷️ 交通工具 (4字)
              </span>
              <span class="px-4 md:px-5 py-2 md:py-2.5 rounded-xl bg-amber-50 text-amber-700 text-base md:text-xl font-bold border border-amber-200 shadow-sm">
                🏷️ 數量與代名詞 (4字)
              </span>
              <span class="px-4 md:px-5 py-2 md:py-2.5 rounded-xl bg-indigo-50 text-indigo-700 text-base md:text-xl font-bold border border-indigo-200 shadow-sm">
                🏷️ 方位與空間 (2字)
              </span>
            </div>

          </div>
        </section>

      </div>

      <!-- Bottom Control Bar (Compact & Anti-Overflow Design) -->
      <footer class="w-full px-3 md:px-8 py-2 md:py-3 bg-white/95 border-t border-sky-100 flex flex-col gap-1.5 md:gap-2 z-20 shrink-0">
        <!-- Progress bar line -->
        <div class="w-full bg-slate-100 h-1.5 md:h-2 rounded-full overflow-hidden border border-slate-200">
          <div id="progress-bar-fill" class="bg-gradient-to-r from-sky-500 to-orange-400 h-full w-0 transition-all duration-300"></div>
        </div>

        <div class="flex items-center justify-between gap-1 sm:gap-2">
          <!-- Left: Prev & Pronounce Button -->
          <div class="flex items-center gap-1 sm:gap-2">
            <button id="prev-btn" onclick="prevSlide()" class="flex items-center gap-1 px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-xl bg-sky-100 hover:bg-sky-200 active:bg-sky-300 text-sky-900 font-bold text-xs sm:text-sm transition shadow-sm disabled:opacity-40 disabled:cursor-not-allowed">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
              <span class="hidden sm:inline">上一頁</span>
            </button>
            <button id="read-current-btn" onclick="speakCurrentWord()" class="flex items-center gap-1 px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl bg-orange-100 hover:bg-orange-200 active:bg-orange-300 text-orange-900 font-bold text-xs sm:text-sm transition shadow-sm" title="朗讀此頁單字">
              <i data-lucide="volume-2" class="w-4 h-4 text-orange-600"></i>
              <span class="hidden sm:inline">朗讀</span>
            </button>
          </div>

          <!-- Middle: Direct Jump Dropdown & Counter -->
          <div class="flex items-center gap-1.5 sm:gap-3">
            <span id="slide-indicator" class="text-xs sm:text-sm font-bold text-slate-600 shrink-0">1 / 10</span>
            <div class="relative">
              <select id="slide-selector" onchange="goToSlide(parseInt(this.value))" class="appearance-none bg-slate-50 border border-slate-300 hover:border-sky-400 text-slate-700 text-xs sm:text-xs font-bold rounded-lg pl-2 sm:pl-3 pr-6 sm:pr-8 py-1 sm:py-1.5 focus:outline-none focus:ring-2 focus:ring-sky-500 max-w-[130px] sm:max-w-[220px] truncate">
                <!-- Populated dynamically via JS -->
              </select>
              <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-500 absolute right-1.5 sm:right-2.5 top-2 sm:top-2 pointer-events-none"></i>
            </div>
          </div>

          <!-- Right: Next Button & Fullscreen Button -->
          <div class="flex items-center gap-1 sm:gap-2">
            <button id="next-btn" onclick="nextSlide()" class="flex items-center gap-1 px-3 sm:px-5 py-1.5 sm:py-2 rounded-xl bg-sky-600 hover:bg-sky-700 active:bg-sky-800 text-white font-bold text-xs sm:text-sm transition shadow-md disabled:opacity-40 disabled:cursor-not-allowed">
              <span>下一頁</span>
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
            <button id="fullscreen-btn" onclick="toggleFullScreen()" class="p-1.5 sm:p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition shadow-sm" title="全螢幕切換 (快速鍵: F)">
              <i id="fullscreen-icon" data-lucide="maximize" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </footer>

    </main>
  </div>

  <script>
    // 1. Vocabulary Dataset for [W03] 2026/09/16 (三)
    const rawWords = [
      { week: 3, day: 3, word: "car", zh: "汽車", pos: "n.", category: "交通工具", collocations: "drive a car (開車) / sports car (跑車)", sentence: "My father washed his car in front of the house.", sentenceZh: "我父親在房子前洗他的汽車。" },
      { week: 3, day: 3, word: "bike", zh: "單車", pos: "n. | v. 騎單車", category: "交通工具", collocations: "ride a bike (騎單車) / rent a bike (租腳踏車)", sentence: "We often ride our bikes around the lake on weekends.", sentenceZh: "我們週末常在湖邊騎腳踏車。" },
      { week: 3, day: 3, word: "taxi", zh: "計程車", pos: "n.", category: "交通工具", collocations: "take a taxi (搭計程車) / call a taxi (叫計程車)", sentence: "It was raining heavily, so we took a taxi home.", sentenceZh: "雨下得很大，所以我們搭計程車回家。" },
      { week: 3, day: 3, word: "train", zh: "火車", pos: "n. | v. 訓練", category: "交通工具", collocations: "take a train (搭火車) / train station (火車站)", sentence: "The high-speed train arrived in Kaohsiung on time.", sentenceZh: "高鐵準時抵達高雄。" },
      { week: 3, day: 3, word: "any", zh: "任何一個", pos: "det. | pron. | adv.", category: "數量與代名詞", collocations: "any time (任何時候) / any question (任何問題)", sentence: "Do you have any questions about this lesson?", sentenceZh: "關於這堂課你們有任何問題嗎？" },
      { week: 3, day: 3, word: "anything", zh: "任何事情", pos: "pron.", category: "數量與代名詞", collocations: "anything else (任何其他事) / anything new (任何新鮮事)", sentence: "Is there anything special you want to eat for dinner?", sentenceZh: "晚餐有你想吃的任何特別食物嗎？" },
      { week: 3, day: 3, word: "each", zh: "每個", pos: "det. | pron.", category: "數量與代名詞", collocations: "each other (彼此) / each student (每位學生)", sentence: "Each student received a free English textbook today.", sentenceZh: "今天每位學生都領到了一本免費的英文課本。" },
      { week: 3, day: 3, word: "every", zh: "每一個", pos: "det.", category: "數量與代名詞", collocations: "every day (每一天) / every time (每一次)", sentence: "She practices playing the violin for an hour every day.", sentenceZh: "她每天練習拉小提琴一小時。" },
      { week: 3, day: 3, word: "position", zh: "位置", pos: "n. | v. 放置/定位", category: "方位與空間", collocations: "good position (好職位；好位置) / change position (改變位置)", sentence: "He found a comfortable position to sit and read.", sentenceZh: "他找了一個舒服的姿勢坐下來看書。" },
      { week: 3, day: 3, word: "somewhere", zh: "某處", pos: "adv. | n.", category: "方位與空間", collocations: "somewhere else (別處) / live somewhere (住在某處)", sentence: "I think I left my umbrella somewhere in the classroom.", sentenceZh: "我想我把雨傘遺落在教室的某個地方了。" }
    ];

    // 2. Supplementary Focus Data (嚴格聚焦單字本體的國中重點補充資料庫)
    const supplementaryData = {
      "car": {
        forms: "名詞複數 cars；複合名詞：police car (警車), cable car (纜車), sports car (跑車)",
        grammar: "可數名詞；上下小型私家車固定搭配動詞片語：get in the car (上車) / get out of the car (下車)。",
        phrases: "by car (搭車/開車) / in a car (在車內) / drive a car (開車) / rent a car (租車) / wash the car (洗車)",
        examPoint: "會考最高頻交通介系詞考點：by car (不加冠詞，亦無複數) vs. in a car / in the car (有冠詞或所有格時，小客車固定用介系詞 in，絕不可用 on)！"
      },
      "bike": {
        forms: "名詞複數 bikes；動詞三態 bike - biked - biked (騎單車)；bicycle 的常用簡稱",
        grammar: "可作動詞：He bikes to school every day. = He goes to school by bike. = He rides a bike to school.",
        phrases: "ride a bike (騎單車) / rent a bike (租借單車) / on a bike (騎在單車上) / by bike (騎單車地) / mountain bike (登山越野車)",
        examPoint: "交通介系詞考點：by bike = on a bike (有冠詞或所有格時，單車一律搭配介系詞 on，如 on his bike)；搭乘動詞固定搭配 ride。"
      },
      "taxi": {
        forms: "名詞複數 taxis (亦作 taxies)；動詞三態 taxi - taxied - taxied (飛機在跑道滑行；乘計程車)；同義詞：cab",
        grammar: "上下計程車動詞片語：get in the taxi (上計程車) / get out of the taxi (下計程車)。",
        phrases: "take a taxi (搭計程車) / call a taxi (叫計程車) / taxi driver (計程車司機) / taxi stand (計程車排班處) / by taxi (搭計程車)",
        examPoint: "交通工具搭配必考：by taxi = in a taxi (有冠詞時小客車固定搭配介系詞 in，不可用 on)；搭乘計程車動詞用 take 或 call。"
      },
      "train": {
        forms: "名詞複數 trains；動詞三態 train - trained - trained (訓練/培訓)；名詞 training (訓練) / trainer (教練)",
        grammar: "名詞指「火車」；動詞指「培訓/鍛鍊」，常見句型：train sb to + 原形動詞 (培訓某人做…)。",
        phrases: "take a train (搭火車) / catch the train (趕上火車) / miss the train (錯過火車) / train station (火車站) / train hard (刻苦訓練)",
        examPoint: "可站立走動的大型大眾運輸工具，固定使用介系詞 on (by train = on the train = take a train)；上下火車用 get on / get off。"
      },
      "any": {
        forms: "限定詞 / 不定代名詞 / 副詞；對比詞：some (一些；某些)",
        grammar: "後方可接可數複數名詞 (any questions) 或不可數名詞 (any water)；在肯定句接單數名詞表「任何一個」(Any student can do this.)。",
        phrases: "not... any (完全沒有) / any time (任何時候) / at any rate (無論如何) / if any (如果有的話)",
        examPoint: "會考核心辨析：some 通常用於「肯定句」或表達客氣請求邀請的疑問句；any 則用於「否定句」或「一般疑問句」；在肯定句中 any 表示「任一/任何」。"
      },
      "anything": {
        forms: "不定代名詞 (由 any + thing 組成)；反義詞：nothing (沒有任何事物)；對比詞：something (某事)",
        grammar: "主要用於否定句與疑問句中；否定結構 not... anything = nothing (例：I don't know anything. = I know nothing.)。",
        phrases: "anything else (任何其他事) / anything new (任何新鮮事) / anything special (任何特別的事) / anything but (絕非/根本不)",
        examPoint: "【會考核心雙考點】：1. 不定代名詞作主詞「視為單數」，動詞用單數形 (Is anything wrong?)；2. 形容詞修飾不定代名詞「必須後置」(anything special)！"
      },
      "each": {
        forms: "限定詞 (每個) / 代名詞 (每個)；對比詞：every (每一個，僅作限定詞，不能單獨作代名詞)",
        grammar: "指兩者或兩者以上的「每一個」，強調個別；可獨立作代名詞 (Each of the students has a book.)。",
        phrases: "each other (彼此/互相，兩者之間) / each of + 複數名詞 (…中的每一個) / each and every (每一個；無一例外)",
        examPoint: "會考主詞動詞一致性必考：each of + 複數名詞當主詞時，「動詞一律用單數形」！例：Each of the boys has a bike. (不可用 have)！"
      },
      "every": {
        forms: "限定詞 (不可單獨作代名詞)；合成詞：everyone, everybody, everything, everywhere；副詞片語：every other day (每隔一天)",
        grammar: "every 強調全體中的每一個，範圍為三者或三者以上；修飾主詞時，動詞一律用單數形 (Every student wears a uniform.)。",
        phrases: "every day (每天，副詞片語，分開寫) vs. everyday (日常的，形容詞，連寫) / every other week (每隔一週) / every now and then (偶爾)",
        examPoint: "會考核心考點：1. every 後方一律接「可數單數名詞」(every child)；2. every + 基數詞 + 複數名詞 表每隔多久 (例：every four years 每四年)。"
      },
      "position": {
        forms: "名詞複數 positions；動詞三態 position - positioned - positioned (安放；定位)",
        grammar: "可數名詞；可指人體身體的「姿勢」，地理上的「位置/方位」，或職場組織裡的「職位/工作」。",
        phrases: "in position (就位；在適當位置) / out of position (不在定位) / change position (變換姿勢/換位置) / apply for a position (申請職位)",
        examPoint: "介系詞搭配考點：表示處於某種特定姿勢或狀態習慣搭配介系詞 in (例：sit in a comfortable position 以舒適的姿勢坐著)。"
      },
      "somewhere": {
        forms: "副詞 (在某處；到某處)；名詞 (某個地方)；對比詞：anywhere (任何地方), nowhere (無處), everywhere (到處)",
        grammar: "主要用於肯定句；在否定句與一般疑問句中通常改用 anywhere (例：Did you go anywhere last night?)。",
        phrases: "somewhere else (在別處/到別處) / somewhere near (在附近某處) / somewhere around (大約在…左右) / live somewhere (住在某處)",
        examPoint: "【會考核心後置修飾考點】：形容詞修飾 somewhere 必須置於其「後方」(後置修飾)，例如：somewhere warm (某個溫暖的地方)、somewhere quiet。"
      }
    };

    // 3. Pronunciation Override Mapping (TTS Speech Correction)
    const pronunciationOverrides = {
      "I": "eye",
      "Mr.": "Mister",
      "Mrs.": "Missus",
      "Ms.": "Mizz",
      "Miss": "Miss",
      "sir": "sir",
      "MRT": "M R T",
      "USA": "U S A",
      "e.g.": "for example",
      "i.e.": "that is"
    };

    let currentSlideIndex = 0;
    const totalSlides = rawWords.length + 1; // +1 for Cover slide
    let autoSpeechEnabled = true;

    // DOM Elements
    const slidesContainer = document.getElementById('slides-container');
    const slideSelector = document.getElementById('slide-selector');
    const slideIndicator = document.getElementById('slide-indicator');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    function buildSlides() {
      // 1. Cover option in select
      const coverOpt = document.createElement('option');
      coverOpt.value = "0";
      coverOpt.textContent = "00. 封面 - 2026 一起背單字 (國中組)";
      slideSelector.appendChild(coverOpt);

      // 2. Generate each word slide
      rawWords.forEach((item, idx) => {
        const slideNum = idx + 1;
        const supp = supplementaryData[item.word] || {
          forms: "常規形態變化",
          grammar: "國中基礎核心必考單字。",
          phrases: item.collocations,
          examPoint: "注意單字拼寫與句子搭配用法。"
        };

        // Dropdown Option
        const opt = document.createElement('option');
        opt.value = slideNum.toString();
        opt.textContent = `${String(slideNum).padStart(2, '0')}. Day ${item.day} - ${item.word} (${item.zh})`;
        slideSelector.appendChild(opt);

        // Word Slide Element
        const slideEl = document.createElement('section');
        slideEl.className = "slide-view p-4 md:p-7 flex flex-col justify-between";
        slideEl.dataset.title = `${item.word} (${item.zh})`;
        slideEl.dataset.day = `Day ${item.day}`;
        slideEl.dataset.category = item.category;
        slideEl.dataset.word = item.word;

        slideEl.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-12 gap-3 md:gap-5 h-full items-stretch mobile-deck-grid">
            
            <!-- LEFT COLUMN (Word Details: Title + Collocations + Sentence) -->
            <div class="md:col-span-7 flex flex-col justify-between gap-3 md:gap-0 md:h-[510px] mobile-card-fix">
              
              <!-- Word Title & POS Badge Row -->
              <div class="flex items-center justify-between bg-white/95 px-4 md:px-6 py-2.5 md:py-3.5 rounded-2xl border-2 border-sky-200 card-shadow shrink-0">
                <div class="flex items-baseline gap-2 md:gap-4 flex-wrap">
                  <span class="text-4xl sm:text-5xl md:text-[64px] font-black text-orange-600 tracking-tight leading-none drop-shadow-sm font-['Fredoka']">
                    ${item.word}
                  </span>
                  <div class="px-3 md:px-4 py-1 md:py-1.5 rounded-full bg-sky-100/90 text-sky-800 border border-sky-300 font-bold text-lg sm:text-xl md:text-[26px] shadow-sm flex items-center gap-1.5">
                    <span class="text-sky-950 font-bold">${item.zh}</span>
                    <span class="text-sky-600 font-medium text-sm sm:text-base md:text-[22px] ml-1 bg-sky-200/60 px-2.5 py-0.5 rounded-md">${item.pos}</span>
                  </div>
                </div>
                <button onclick="speakText('${item.word}')" class="p-2 md:p-3 bg-orange-500 hover:bg-orange-600 active:scale-95 text-white rounded-2xl shadow-md transition-transform flex items-center justify-center shrink-0" title="朗讀單字 (TTS)">
                  <i data-lucide="volume-2" class="w-5 h-5 md:w-7 md:h-7"></i>
                </button>
              </div>

              <!-- Collocation Card (Fixed Desktop Height: 185px) -->
              <div class="bg-gradient-to-br from-white to-sky-50/60 p-3 md:p-4 rounded-2xl border-2 border-sky-100 card-shadow flex flex-col justify-center md:h-[185px] shrink-0">
                <div class="flex items-center gap-2 mb-1.5 md:mb-2">
                  <span class="p-1 md:p-1.5 bg-sky-600 text-white rounded-lg flex items-center justify-center shadow-xs">
                    <i data-lucide="link-2" class="w-3.5 h-3.5 md:w-4 md:h-4"></i>
                  </span>
                  <h3 class="text-lg md:text-[24px] font-extrabold text-sky-900 tracking-tight">常用搭配詞 (Collocations)</h3>
                </div>
                <div class="text-base sm:text-lg md:text-[23px] font-semibold text-slate-700 bg-white/80 p-2.5 md:p-3 rounded-xl border border-sky-100 leading-snug">
                  ${item.collocations}
                </div>
              </div>

              <!-- Sentence Card (Fixed Desktop Height: 225px) -->
              <div class="bg-gradient-to-br from-white to-amber-50/40 p-3 md:p-4 rounded-2xl border-2 border-orange-100 card-shadow flex flex-col justify-center md:h-[225px] shrink-0">
                <div class="flex items-center justify-between mb-1.5 md:mb-2">
                  <div class="flex items-center gap-2">
                    <span class="p-1 md:p-1.5 bg-orange-500 text-white rounded-lg flex items-center justify-center shadow-xs">
                      <i data-lucide="message-square-quote" class="w-3.5 h-3.5 md:w-4 md:h-4"></i>
                    </span>
                    <h3 class="text-lg md:text-[24px] font-extrabold text-orange-950 tracking-tight">實用例句 (Example Sentence)</h3>
                  </div>
                  <button onclick="speakSentence('${item.sentence.replace(/'/g, "\\'")}')" class="text-orange-600 hover:text-orange-800 text-xs font-bold flex items-center gap-1 bg-orange-100/80 px-2 md:px-2.5 py-1 rounded-lg">
                    <i data-lucide="volume-1" class="w-3.5 h-3.5"></i>
                    <span>朗讀例句</span>
                  </button>
                </div>
                <div class="bg-white/80 p-2.5 md:p-3 rounded-xl border border-orange-100 flex flex-col gap-1 md:gap-1.5 justify-center flex-1">
                  <p class="text-base sm:text-lg md:text-[25px] font-bold text-slate-800 leading-snug tracking-normal">
                    ${item.sentence}
                  </p>
                  <p class="text-sm sm:text-base md:text-[23px] font-medium text-slate-600 leading-tight">
                    ${item.sentenceZh}
                  </p>
                </div>
              </div>

            </div>

            <!-- RIGHT COLUMN (Supplementary Panel: Desktop Width 440px, Height 510px) -->
            <div class="md:col-span-5 w-full md:h-[510px] bg-white rounded-2xl border-2 border-sky-300 card-shadow flex flex-col p-4 md:p-5 justify-between mobile-card-fix">
              
              <!-- Header -->
              <div class="flex items-center gap-2 pb-2 border-b border-sky-200 shrink-0">
                <span class="p-1 md:p-1.5 bg-sky-700 text-white rounded-lg">
                  <i data-lucide="graduation-cap" class="w-4 h-4 md:w-5 md:h-5"></i>
                </span>
                <h3 class="text-lg md:text-[25px] font-black text-sky-900 tracking-tight">國中重點補充 (Exam Focus)</h3>
              </div>

              <!-- Content items -->
              <div class="flex-1 overflow-y-auto pr-1 py-2 flex flex-col gap-2.5 md:gap-3 custom-scroll">
                
                <!-- Forms / Changes -->
                <div class="bg-sky-50/80 p-2.5 md:p-3 rounded-xl border border-sky-200">
                  <div class="text-base md:text-[25px] font-black text-sky-900 flex items-center gap-1.5 mb-1">
                    <span>🔹</span> <span>變化 / 格位 / 形態</span>
                  </div>
                  <div class="text-sm sm:text-base md:text-[23px] font-medium text-slate-700 leading-snug">
                    ${supp.forms}
                  </div>
                </div>

                <!-- Exam Focus Point (Strictly on Target Word) -->
                <div class="bg-orange-50/80 p-2.5 md:p-3 rounded-xl border border-orange-200">
                  <div class="text-base md:text-[25px] font-black text-orange-950 flex items-center gap-1.5 mb-1">
                    <span>🎯</span> <span>會考常考要點</span>
                  </div>
                  <div class="text-sm sm:text-base md:text-[23px] font-medium text-slate-700 leading-snug">
                    ${supp.examPoint}
                  </div>
                </div>

                <!-- Useful Phrases & Grammar -->
                <div class="bg-slate-50 p-2.5 md:p-3 rounded-xl border border-slate-200">
                  <div class="text-base md:text-[25px] font-black text-slate-900 flex items-center gap-1.5 mb-1">
                    <span>💡</span> <span>常用片語與文法</span>
                  </div>
                  <div class="text-sm sm:text-base md:text-[23px] font-medium text-slate-700 leading-snug">
                    ${supp.phrases}
                  </div>
                  ${supp.grammar ? `<div class="text-xs sm:text-sm md:text-[21px] text-slate-500 mt-1 border-t border-slate-200 pt-1 leading-tight">${supp.grammar}</div>` : ''}
                </div>

              </div>

              <!-- Footer Tag in Panel -->
              <div class="pt-2 border-t border-slate-100 flex justify-between items-center text-xs font-semibold text-slate-400 shrink-0">
                <span>單字編號：W03-D3-#${slideNum}</span>
                <span class="text-sky-600 bg-sky-50 px-2 py-0.5 rounded">會考必備單字</span>
              </div>

            </div>

          </div>
        `;
        slidesContainer.appendChild(slideEl);
      });

      // Render Lucide icons
      lucide.createIcons();
    }

    function updateSlideUI() {
      const slides = document.querySelectorAll('.slide-view');
      slides.forEach((slide, idx) => {
        if (idx === currentSlideIndex) {
          slide.classList.add('active');
          if (window.innerWidth < 768) {
            slide.scrollTop = 0; // Scroll back to top on mobile slide switch
          }
        } else {
          slide.classList.remove('active');
        }
      });

      slideSelector.value = currentSlideIndex.toString();
      slideIndicator.textContent = `${currentSlideIndex} / ${totalSlides - 1}`;
      if (currentSlideIndex === 0) {
        slideIndicator.textContent = `封面 / ${totalSlides - 1}`;
      }

      const progressPercent = (currentSlideIndex / (totalSlides - 1)) * 100;
      progressBarFill.style.width = `${progressPercent}%`;

      prevBtn.disabled = currentSlideIndex === 0;
      nextBtn.disabled = currentSlideIndex === totalSlides - 1;

      const currentSlide = slides[currentSlideIndex];

      if (autoSpeechEnabled && currentSlideIndex > 0) {
        const wordToSpeak = currentSlide.dataset.word;
        if (wordToSpeak) {
          speakText(wordToSpeak);
        }
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < totalSlides) {
        currentSlideIndex = index;
        updateSlideUI();
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        goToSlide(currentSlideIndex - 1);
      }
    }

    function nextSlide() {
      if (currentSlideIndex < totalSlides - 1) {
        goToSlide(currentSlideIndex + 1);
      }
    }

    function getPhoneticCorrectedText(text) {
      const trimmed = text.trim();
      if (pronunciationOverrides[trimmed]) {
        return pronunciationOverrides[trimmed];
      }
      return text;
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const correctedText = getPhoneticCorrectedText(text);
      const utterance = new SpeechSynthesisUtterance(correctedText);
      utterance.lang = 'en-US';
      utterance.rate = 0.88;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.startsWith('en-US') || v.lang.startsWith('en'));
      if (enVoice) {
        utterance.voice = enVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    function speakSentence(sentence) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(sentence);
      utterance.lang = 'en-US';
      utterance.rate = 0.92;
      window.speechSynthesis.speak(utterance);
    }

    function speakCurrentWord() {
      if (currentSlideIndex === 0) {
        speakSentence("Welcome to English vocabulary practice!");
        return;
      }
      const currentSlide = document.querySelectorAll('.slide-view')[currentSlideIndex];
      if (currentSlide && currentSlide.dataset.word) {
        speakText(currentSlide.dataset.word);
      }
    }

    function fitPresentationStage() {
      const stage = document.getElementById('presentation-stage');
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      // For Mobile Portrait (< 768px), disable transform scaling and use vertical responsive flow
      if (windowWidth < 768) {
        stage.style.transform = 'none';
        return;
      }

      const baseWidth = 1200;
      const baseHeight = 675;

      const scaleX = (windowWidth * 0.96) / baseWidth;
      const scaleY = (windowHeight * 0.96) / baseHeight;
      const scale = Math.min(scaleX, scaleY, 1.15);

      stage.style.transform = `scale(${scale})`;
    }

    function toggleFullScreen() {
      const doc = window.document;
      const docEl = doc.documentElement;

      const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (requestFullScreen) {
          requestFullScreen.call(docEl);
        }
      } else {
        if (cancelFullScreen) {
          cancelFullScreen.call(doc);
        }
      }
    }

    function updateFullscreenIcon() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      const btn = document.getElementById('fullscreen-btn');
      if (!btn) return;
      
      btn.innerHTML = isFullscreen 
        ? `<i data-lucide="minimize" class="w-4 h-4"></i>` 
        : `<i data-lucide="maximize" class="w-4 h-4"></i>`;
      lucide.createIcons();
    }

    function initInteractions() {
      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          prevSlide();
        } else if (e.key === 'Home') {
          e.preventDefault();
          goToSlide(0);
        } else if (e.key === 'End') {
          e.preventDefault();
          goToSlide(totalSlides - 1);
        } else if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          toggleFullScreen();
        }
      });

      // Fullscreen change events
      ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(ev => {
        document.addEventListener(ev, () => {
          updateFullscreenIcon();
          setTimeout(fitPresentationStage, 100);
        });
      });

      // Touch swipe gestures
      let touchStartX = 0;
      let touchStartY = 0;
      const stage = document.getElementById('presentation-stage');

      stage.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      stage.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        // Horizontal swipe detection
        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 45) {
          if (diffX < 0) {
            nextSlide();
          } else {
            prevSlide();
          }
        }
      }, { passive: true });

      window.addEventListener('resize', fitPresentationStage);
      window.addEventListener('orientationchange', () => {
        setTimeout(fitPresentationStage, 200);
      });
    }

    window.onload = function() {
      buildSlides();
      fitPresentationStage();
      initInteractions();
      updateSlideUI();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }
    };
  </script>
