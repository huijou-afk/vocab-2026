    const supplementaryData = {
      "warm": {

        grammar: "不定代名詞 + 不定詞：something to eat (吃的東西)、something to drink (喝的東西)。用於肯定句或客氣詢問 (Would you like something...?)。"

                  <button onclick="speakSentence('${wordObj.sentenceEn.replace(/'/g, "\\'")}')" class="flex items-center gap-1 text-xs md:text-sm font-bold text-orange-600 hover:text-orange-700 bg-orange-100/80 px-2.5 py-1 rounded-lg transition">
                    <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
                    <span>朗讀例句</span>
                  </button>
                </div>
                <div class="bg-white/80 p-2.5 md:p-3 rounded-xl border border-orange-100 flex flex-col gap-1">
                  <div class="text-base sm:text-lg md:text-[23px] font-bold text-slate-800 leading-snug font-fredoka">
                    ${wordObj.sentenceEn}
                  </div>
                  <div class="text-sm sm:text-base md:text-[20px] font-medium text-slate-600">
                    ${wordObj.sentenceZh}
                  </div>
                </div>
              </div>

            </div>

            <!-- 右側欄 (5 欄) 國中重點補充面板 -->
            <div class="md:col-span-5 w-full md:h-[510px] bg-white rounded-2xl border-2 border-sky-300 card-shadow flex flex-col p-4 md:p-5 justify-between mobile-card-fix">
              <div class="flex items-center gap-2 pb-2 border-b border-sky-100">
                <i data-lucide="graduation-cap" class="w-6 h-6 text-sky-700"></i>
                <span class="text-lg md:text-[25px] font-black text-sky-900 tracking-wide">國中重點補充 (Exam Focus)</span>
              </div>

              <!-- 滾動容器 -->
              <div class="flex-1 overflow-y-auto pr-1 py-2 flex flex-col gap-2.5 md:gap-3 custom-scroll">
                
                <!-- 區塊 1: 變化 / 格位 / 形態 -->
                <div class="bg-sky-50/80 p-2.5 md:p-3 rounded-xl border border-sky-200">
                  <div class="text-base md:text-[20px] font-black text-sky-900 mb-1 flex items-center gap-1.5">
                    <span>🔹 變化 / 格位 / 形態</span>
                  </div>
                  <div class="text-sm sm:text-base md:text-[18px] font-medium text-slate-700 leading-relaxed">
                    ${supp.morph}
                  </div>
                </div>

                <!-- 區塊 2: 會考常考要點 -->
                <div class="bg-orange-50/80 p-2.5 md:p-3 rounded-xl border border-orange-200">
                  <div class="text-base md:text-[20px] font-black text-orange-950 mb-1 flex items-center gap-1.5">
                    <span>🎯 會考常考要點</span>
                  </div>
                  <div class="text-sm sm:text-base md:text-[18px] font-medium text-slate-700 leading-relaxed">
                    ${supp.examFocus}
                  </div>
                </div>

                <!-- 區塊 3: 常用片語與文法 -->
                <div class="bg-slate-50 p-2.5 md:p-3 rounded-xl border border-slate-200">
                  <div class="text-base md:text-[20px] font-black text-slate-900 mb-1 flex items-center gap-1.5">
                    <span>💡 常用片語與文法</span>
                  </div>
                  <div class="text-sm sm:text-base md:text-[18px] font-medium text-slate-700 leading-relaxed">
                    ${supp.grammar}
                  </div>
                </div>

              </div>

              <!-- 底部標籤 -->
              <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-xs font-semibold text-slate-400">
                <span>單字編號：${wordObj.id}</span>
                <span class="text-sky-600 bg-sky-50 px-2 py-0.5 rounded border border-sky-200">會考必備單字</span>
              </div>
            </div>

          </div>
        `;

        container.appendChild(section);

        // 新增選單項目
        const opt = document.createElement("option");
        opt.value = slideIdx;
        opt.textContent = `${slideIdx + 1}. ${wordObj.word}`;
        selector.appendChild(opt);
      });

      totalSlides = rawWords.length + 1;
      lucide.createIcons();
    }

    // 更新投影片切換視角
    function updateSlideView() {
      const slides = document.querySelectorAll(".slide-view");
      slides.forEach((slide, idx) => {
        if (idx === currentSlideIndex) {
          slide.classList.add("active");
        } else {
          slide.classList.remove("active");
        }
      });

      // 更新進度條與頁數指示
      const percent = ((currentSlideIndex + 1) / totalSlides) * 100;
      document.getElementById("progress-bar-fill").style.width = `${percent}%`;
      document.getElementById("slide-indicator").textContent = `${currentSlideIndex + 1} / ${totalSlides}`;
      document.getElementById("slide-selector").value = currentSlideIndex;

      // 當切換到新頁面時，若不是封面，自動朗讀單字
      if (currentSlideIndex > 0) {
        const targetWord = rawWords[currentSlideIndex - 1].word;
        speakText(targetWord);
      }
    }

    function nextSlide() {
      if (currentSlideIndex < totalSlides - 1) {
        currentSlideIndex++;
        updateSlideView();
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
        updateSlideView();
      }
    }

    function goToSlide(index) {
      const idx = parseInt(index, 10);
      if (idx >= 0 && idx < totalSlides) {
        currentSlideIndex = idx;
        updateSlideView();
      }
    }

    // TTS 發音引擎
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      
      const cleanText = pronunciationOverrides[text.toLowerCase()] || text;
      const utterance = new SpeechSynthesisUtterance(cleanText);
      utterance.lang = 'en-US';
      utterance.rate = 0.85; // 國中生語速稍慢更清晰
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function speakSentence(sentence) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(sentence);
      utterance.lang = 'en-US';
      utterance.rate = 0.88;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    // 16:9 舞台自動縮放
    function fitPresentationStage() {
      const stage = document.getElementById("presentation-stage");
      if (!stage) return;

      if (window.innerWidth < 768) {
        stage.style.transform = "none";
        return;
      }

      const designWidth = 1200;
      const designHeight = 675;
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      // 保留少許安全邊界 (94%)
      const scaleX = (windowWidth * 0.96) / designWidth;
      const scaleY = (windowHeight * 0.96) / designHeight;
      const scale = Math.min(scaleX, scaleY, 1.25);

      stage.style.transform = `scale(${scale})`;
    }

    // 全螢幕切換
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function updateFullscreenIcon() {
      const icon = document.getElementById("fullscreen-icon");
      if (!icon) return;
      if (document.fullscreenElement) {
        icon.setAttribute("data-lucide", "minimize");
      } else {
        icon.setAttribute("data-lucide", "maximize");
      }
      lucide.createIcons();
    }

    // 事件監聽註冊
    window.addEventListener("resize", fitPresentationStage);
    document.addEventListener("fullscreenchange", updateFullscreenIcon);

    document.addEventListener("keydown", (e) => {
      // 避免在下拉選單操作時觸發快顯快捷鍵
      if (e.target.tagName === 'SELECT') return;

      if (e.key === "ArrowRight" || e.key === "Space") {
        e.preventDefault();
        nextSlide();
      } else if (e.key === "ArrowLeft") {
        e.preventDefault();
        prevSlide();
      } else if (e.key === "f" || e.key === "F") {
        e.preventDefault();
        toggleFullScreen();
      }
    });

    // 觸控滑動支援 (Swipe)
    let touchStartX = 0;
    let touchEndX = 0;
    document.getElementById("presentation-stage").addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    document.getElementById("presentation-stage").addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const swipeThreshold = 50;
      if (touchEndX < touchStartX - swipeThreshold) {
        nextSlide();
      }
      if (touchEndX > touchStartX + swipeThreshold) {
        prevSlide();
      }
    }

    // 控制列按鈕綁定
    document.getElementById("next-btn").addEventListener("click", nextSlide);
    document.getElementById("prev-btn").addEventListener("click", prevSlide);
    document.getElementById("fullscreen-btn").addEventListener("click", toggleFullScreen);
    document.getElementById("slide-selector").addEventListener("change", (e) => {
      goToSlide(e.target.value);
    });

    document.getElementById("read-current-btn").addEventListener("click", () => {
      if (currentSlideIndex === 0) {
        speakText("Welcome to Vocabulary Day. Let's study English together.");
      } else {
        const item = rawWords[currentSlideIndex - 1];
        speakText(item.word);
      }
    });

    // 初始化執行
    document.addEventListener("DOMContentLoaded", () => {
      buildSlides();
      fitPresentationStage();
      updateSlideView();
    });
  </script>
</body>
</html>
