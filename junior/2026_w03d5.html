    // ==========================================
    // 2. 語音朗讀與特殊字修正映射表
    // ==========================================
    const PRONUNCIATION_MAP = {
      "I": "eye",
      "Mr.": "Mister",
      "Mrs.": "Missus",
      "Ms.": "Miz",
      "Dr.": "Doctor",
      "MRT": "M R T",
      "No.": "Number",
      "etc.": "et cetera"
    };

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel(); // 停止先前的朗讀
      
      let speechString = text;
      // 進行修正對照
      if (PRONUNCIATION_MAP[text.trim()]) {
        speechString = PRONUNCIATION_MAP[text.trim()];
      }

      const utter = new SpeechSynthesisUtterance(speechString);
      utter.lang = 'en-US';
      utter.rate = 0.9; // 稍慢清晰，適合國中學生
      window.speechSynthesis.speak(utter);
    }

    // 3. 狀態與控制變數
    // ==========================================

    const stageWrapper = document.getElementById('stageWrapper');
    const slideContent = document.getElementById('slideContent');
    const progressBar = document.getElementById('progressBar');
    const pageSelect = document.getElementById('pageSelect');
    const pageTotal = document.getElementById('pageTotal');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');

    // ==========================================
    // 4. 響應式佈局計算 (fitPresentationStage)
    // ==========================================
    function fitPresentationStage() {
      const isMobilePortrait = window.innerWidth < 768;

      if (isMobilePortrait) {
        // 手機直向：解除固定 1200x675，改為直向滿版單欄 RWD，高度自適應滾動
        presentationStage.style.transform = 'none';
        presentationStage.style.width = '100%';
        presentationStage.style.height = '100%';
        presentationStage.style.overflowY = 'auto';
        presentationStage.className = "bg-slate-50 relative custom-scrollbar p-4 pb-12 w-full h-full";
      } else {
        // 桌機 / 橫向平板：等比例縮放基準 1200 x 675 (16:9)
        presentationStage.style.width = '1200px';
        presentationStage.style.height = '675px';
        presentationStage.style.overflowY = 'hidden';
        presentationStage.className = "bg-slate-50 relative overflow-hidden shadow-2xl origin-center";

        const wrapperWidth = stageWrapper.clientWidth;
        const wrapperHeight = stageWrapper.clientHeight;
        const scaleX = wrapperWidth / 1200;
        const scaleY = wrapperHeight / 675;
        const scale = Math.min(scaleX, scaleY) * 0.96; // 留 4% 舒適內縮邊距
        presentationStage.style.transform = `scale(${scale})`;
      }
    }

    // ==========================================

      if (index === 0) {

              <i data-lucide="sparkles" class="w-4 h-4"></i>
              <span>自然天氣・常用代名詞・生活名詞</span>
            </div>
            
            <h1 class="text-4xl sm:text-6xl md:text-7xl font-bold tracking-tight text-slate-900 font-fredoka mb-6">

            </h1>

              <i data-lucide="calendar" class="w-6 h-6 text-brand-orange"></i>
              <span>[W88] 2026/09/18 星期五</span>
            </div>

            <div class="mt-12 flex items-center gap-2 text-slate-400 text-xs sm:text-sm">
              <i data-lucide="mouse-pointer" class="w-4 h-4 animate-bounce"></i>
              <span>點擊「下一頁」或按鍵盤空白鍵開始學習</span>
            </div>
          </div>
        `;
      } else {
        // 【單字頁】
        const data = VOCAB_DATA[index - 1];
        slideContent.innerHTML = `
          <div class="w-full h-full flex flex-col md:flex-row p-4 md:p-8 gap-6 md:gap-8 justify-between items-stretch">
            
            <!-- 左欄：目標單字區塊 + 搭配詞 + 例句 -->
            <div class="flex-1 flex flex-col justify-between space-y-4 md:space-y-0">
              
              <!-- 1. 單字主展示區 -->
              <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div class="flex items-center gap-4 flex-wrap">
                  <h2 class="text-4xl sm:text-5xl md:text-6xl font-black text-brand-orange font-fredoka tracking-wide">
                    ${data.word}
                  </h2>
                  <button onclick="speakText('${data.word}')" class="p-2.5 rounded-2xl bg-brand-orangeLight text-brand-orange hover:bg-brand-orange hover:text-white transition active:scale-95 shadow-sm" title="朗讀目標單字">
                    <i data-lucide="volume-2" class="w-6 h-6"></i>
                  </button>
                  <span class="bg-sky-100 text-brand-blue font-bold px-4 py-1.5 rounded-full text-sm sm:text-base border border-sky-200">
                    ${data.pos} ${data.meaning}
                  </span>
                </div>
                <span class="text-xs sm:text-sm font-bold text-slate-400 bg-slate-100 px-3 py-1 rounded-full font-fredoka">
                  ${data.num}
                </span>
              </div>

              <!-- 2. 常用搭配詞卡片 -->
              <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
                <div class="flex items-center gap-2 text-brand-blue font-bold text-base sm:text-lg mb-3">
                  <div class="p-1.5 bg-sky-100 rounded-xl">
                    <i data-lucide="layers" class="w-4 h-4 sm:w-5 sm:h-5 text-brand-blue"></i>
                  </div>
                  <h3>常用搭配詞 (Collocations)</h3>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                  ${data.collocations.map(item => `
                    <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-3 flex flex-col justify-center">
                      <span class="font-fredoka text-base sm:text-lg font-bold text-slate-800">${item.en}</span>
                      <span class="text-xs sm:text-sm text-slate-500 mt-0.5">${item.zh}</span>
                    </div>
                  `).join('')}
                </div>
              </div>

              <!-- 3. 實用例句卡片 -->
              <div class="bg-white p-5 rounded-3xl border border-slate-200 shadow-sm">
                <div class="flex items-center justify-between mb-2">
                  <div class="flex items-center gap-2 text-brand-blue font-bold text-base sm:text-lg">
                    <div class="p-1.5 bg-sky-100 rounded-xl">
                      <i data-lucide="message-square-quote" class="w-4 h-4 sm:w-5 sm:h-5 text-brand-blue"></i>
                    </div>
                    <h3>實用會考例句</h3>
                  </div>
                  <button onclick="speakText(\`${data.sentence.en.replace(/'/g, "\\'")}\`)" class="flex items-center gap-1 text-xs font-bold text-brand-blue bg-sky-50 px-2.5 py-1 rounded-xl hover:bg-sky-100 transition active:scale-95">
                    <i data-lucide="volume-2" class="w-3.5 h-3.5"></i>
                    <span>朗讀例句</span>
                  </button>
                </div>
                <div class="bg-slate-50 border border-slate-200/80 rounded-2xl p-4">
                  <p class="font-fredoka text-base sm:text-lg font-semibold text-slate-900 leading-relaxed">
                    ${data.sentence.en}
                  </p>
                  <p class="text-xs sm:text-sm text-slate-600 mt-2 font-medium">
                    ${data.sentence.zh}
                  </p>
                </div>
              </div>

            </div>

            <!-- 右欄：國中重點補充面板 (嚴格聚焦目標單字本體，防偏題) -->
            <div class="w-full md:w-[440px] md:h-[510px] bg-sky-50/70 border-2 border-sky-200/80 rounded-3xl p-5 flex flex-col shrink-0 shadow-sm">
              <div class="flex items-center justify-between pb-3 border-b border-sky-200 mb-3">
                <div class="flex items-center gap-2 font-bold text-slate-800 text-base sm:text-lg">
                  <i data-lucide="book-open-check" class="w-5 h-5 text-brand-blue"></i>
                  <span>國中重點補充面板</span>
                </div>
                <span class="text-xs bg-brand-blue text-white px-2.5 py-0.5 rounded-full font-bold">聚焦本字考點</span>
              </div>

              <!-- 可滾動之重點區域 -->
              <div class="custom-scrollbar overflow-y-auto pr-1 space-y-4 text-xs sm:text-sm leading-normal flex-1">
                
                <!-- 形態/變化 -->
                <div class="bg-white rounded-2xl p-3.5 border border-sky-100 shadow-2xs">
                  <h4 class="font-bold text-slate-800 flex items-center gap-1.5 mb-2 text-brand-orange">
                    <i data-lucide="arrow-right-left" class="w-4 h-4"></i>
                    <span>單字變化與詞性形態</span>
                  </h4>
                  <ul class="space-y-1.5">
                    ${data.supplement.morphology.map(m => `
                      <li class="flex items-start gap-2">
                        <span class="bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded text-xs font-bold shrink-0">${m.label}</span>
                        <span class="text-slate-700 font-medium">${m.val}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>

                <!-- 會考常考要點 -->
                <div class="bg-white rounded-2xl p-3.5 border border-sky-100 shadow-2xs">
                  <h4 class="font-bold text-slate-800 flex items-center gap-1.5 mb-2 text-brand-blue">
                    <i data-lucide="alert-circle" class="w-4 h-4"></i>
                    <span>會考必考關鍵守則</span>
                  </h4>
                  <div class="space-y-2 text-slate-700">
                    ${data.supplement.examPoints.map(pt => `
                      <p class="font-medium bg-slate-50 p-2 rounded-xl border border-slate-100 leading-relaxed">${pt}</p>
                    `).join('')}
                  </div>
                </div>

                <!-- 語法與片語延伸 -->
                <div class="bg-white rounded-2xl p-3.5 border border-sky-100 shadow-2xs">
                  <h4 class="font-bold text-slate-800 flex items-center gap-1.5 mb-2 text-emerald-600">
                    <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                    <span>固定文法與句型延伸</span>
                  </h4>
                  <div class="space-y-1.5 text-slate-700">
                    ${data.supplement.grammar.map(g => `
                      <p class="font-medium text-xs sm:text-sm">${g}</p>
                    `).join('')}
                  </div>
                </div>

              </div>
            </div>

          </div>
        `;
      }

      // 重新渲染 Lucide 圖示
      lucide.createIcons();

      // 更新控制器狀態
      updateControls();

      // 自動發音朗讀（若是單字頁）
      if (index > 0) {
        speakText(VOCAB_DATA[index - 1].word);
      }
    }

    // ==========================================
    // 6. 控制列更新邏輯
    // ==========================================
    function updateControls() {
      // 更新進度條
      const percent = (currentIndex / (totalSlides - 1)) * 100;
      progressBar.style.width = `${percent}%`;

      // 更新下拉選單選取值
      pageSelect.value = currentIndex;

      // 按鈕啟用與停用狀態
      prevBtn.disabled = (currentIndex === 0);
      prevBtn.classList.toggle('opacity-40', currentIndex === 0);
      prevBtn.classList.toggle('pointer-events-none', currentIndex === 0);

      const isLast = (currentIndex === totalSlides - 1);
      nextBtn.disabled = isLast;
      nextBtn.classList.toggle('opacity-40', isLast);
      nextBtn.classList.toggle('pointer-events-none', isLast);
    }

    function goToSlide(index) {
      if (index < 0 || index >= totalSlides) return;
      currentIndex = index;
      renderSlide(currentIndex);
    }

    // 初始化下拉選單
    function initDropdown() {
      pageSelect.innerHTML = '';
      for (let i = 0; i < totalSlides; i++) {
        const option = document.createElement('option');
        option.value = i;
        if (i === 0) {
          option.textContent = `封面 - 今日進度`;
        } else {
          const item = VOCAB_DATA[i - 1];
          option.textContent = `${item.num} ${item.word} (${item.meaning})`;
        }
        pageSelect.appendChild(option);
      }
      pageTotal.textContent = `/ ${totalSlides - 1}`;
    }

    // ==========================================
    // 7. 互動事件監聽 (鍵盤、全螢幕、滑動)
    // ==========================================
    prevBtn.addEventListener('click', () => goToSlide(currentIndex - 1));
    nextBtn.addEventListener('click', () => goToSlide(currentIndex + 1));

    pageSelect.addEventListener('change', (e) => {
      goToSlide(parseInt(e.target.value, 10));
    });

    speakCurrentBtn.addEventListener('click', () => {
      if (currentIndex === 0) {
        speakText("Welcome to Vocabulary class.");
      } else {
        speakText(VOCAB_DATA[currentIndex - 1].word);
      }
    });

    // 鍵盤左右與空白鍵翻頁、F 鍵全螢幕
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        goToSlide(currentIndex + 1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        goToSlide(currentIndex - 1);
      } else if (e.key.toLowerCase() === 'f') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // 全螢幕切換
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        fsIcon.setAttribute('data-lucide', 'minimize');
      } else {
        fsIcon.setAttribute('data-lucide', 'maximize');
      }
      lucide.createIcons();
      fitPresentationStage();
    });

    // 觸控滑動支援 (Touch Swipe)
    let touchStartX = 0;
    let touchStartY = 0;
    stageWrapper.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    stageWrapper.addEventListener('touchend', (e) => {
      const diffX = e.changedTouches[0].screenX - touchStartX;
      const diffY = e.changedTouches[0].screenY - touchStartY;
      // 水平位移需大於垂直位移，避免干擾頁面內部上下滾動
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 40) {
        if (diffX < 0) {
          goToSlide(currentIndex + 1);
        } else {
          goToSlide(currentIndex - 1);
        }
      }
    }, { passive: true });

    // 螢幕大小變化時自適應計算
    window.addEventListener('resize', fitPresentationStage);
    window.addEventListener('orientationchange', fitPresentationStage);

    // ==========================================
    // 8. 系統啟動
    // ==========================================
    window.addEventListener('DOMContentLoaded', () => {
      initDropdown();
      renderSlide(0);
      fitPresentationStage();
    });
  </script>
</body>
</html>
