<!DOCTYPE html>

  <style>
    :root {
      --primary-color: #0369a1;
      --accent-orange: #ea580c;
      --slide-width: 1200px;
      --slide-height: 675px;
    }

    body {
      font-family: 'Fredoka', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f172a;
      color: #1e293b;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Desktop/Tablet 16:9 Stage Viewport */
    #viewport-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #presentation-stage {
      position: relative;
      width: var(--slide-width);
      height: var(--slide-height);
      transform-origin: center center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      border-radius: 28px;
      background-color: #ffffff;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.15s ease-out;
    }

    .slide-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: scale(0.985);
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }

    .slide-view.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      pointer-events: auto;
    }

    .card-shadow {
      box-shadow: 0 8px 24px -4px rgba(3, 105, 161, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #93c5fd;
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #0284c7;
    }

    /* Responsive adjustments for Mobile Portrait (< 768px) */
    @media (max-width: 767px) {
      body {
        overflow: auto;
      }
      #viewport-wrapper {
        align-items: stretch;
        height: 100vh;
        height: 100dvh;
      }
      #presentation-stage {
        width: 100% !important;
        height: 100% !important;
        transform: none !important;
        border-radius: 0 !important;
        border-width: 0 !important;
        box-shadow: none !important;
      }
      .slide-view {
        position: relative;
        height: 100%;
        overflow-y: auto;
        padding: 1rem !important;
        -webkit-overflow-scrolling: touch;
      }
      .slide-view:not(.active) {
        display: none !important;
      }
      .mobile-deck-grid {
        display: flex !important;
        flex-direction: column !important;
        gap: 1rem !important;
        height: auto !important;
      }
      .mobile-card-fix {
        width: 100% !important;
        height: auto !important;
        min-height: auto !important;
      }
    }
  </style>
</head>

              <i data-lucide="volume-2" class="w-4 h-4 text-orange-600"></i>

              <i id="fullscreen-icon" data-lucide="maximize" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </footer>

    </main>
  </div>

  <script>
    // 1. Vocabulary Dataset for [W02] 2026/09/08 (二)
    const rawWords = [
      { week: 2, day: 2, word: "daddy", zh: "爸爸", pos: "n.", category: "人物與稱謂", collocations: "call daddy (叫爸爸) / daddy's girl (爸爸的掌上明珠)", sentence: "The child ran happily into her daddy's arms.", sentenceZh: "孩子開心地跑進爸爸的懷裡。" },
      { week: 2, day: 2, word: "mother", zh: "媽媽；母親", pos: "n.", category: "人物與稱謂", collocations: "caring mother (細心的母親) / Mother's Day (母親節)", sentence: "Mother cooked a delicious dinner for all of us.", sentenceZh: "媽媽為我們大家煮了美味的晚餐。" },
      { week: 2, day: 2, word: "mom", zh: "媽媽", pos: "n.", category: "人物與稱謂", collocations: "call mom (打電話給媽媽) / help mom (幫媽媽忙)", sentence: "Mom reminded me to bring my umbrella this morning.", sentenceZh: "媽媽今天早上提醒我要帶雨傘。" },
      { week: 2, day: 2, word: "mommy", zh: "媽媽；媽咪", pos: "n.", category: "人物與稱謂", collocations: "sweet mommy (親愛的媽咪) / mommy and me (媽咪和我)", sentence: "The baby smiled sweetly at his mommy.", sentenceZh: "小嬰兒對著他的媽咪甜甜地笑。" },
      { week: 2, day: 2, word: "top", zh: "頂部；頭頂；陀螺", pos: "n. | adj. | v.", category: "方位與空間", collocations: "on top of (在…頂部) / from top to bottom (從上到下)", sentence: "We reached the top of the mountain before noon.", sentenceZh: "我們在中午之前到達了山頂。" },
      { week: 2, day: 2, word: "bell", zh: "鈴；鐘聲", pos: "n.", category: "日常用品", collocations: "ring a bell (按門鈴；聽起來耳熟) / school bell (鐘聲)", sentence: "The school bell rang and all the students went inside.", sentenceZh: "上課鐘聲響了，所有學生都進教室了。" },
      { week: 2, day: 2, word: "bowl", zh: "碗", pos: "n. | v. 打保齡球", category: "日常用品", collocations: "a bowl of (一碗…) / rice bowl (飯碗)", sentence: "He ate a large bowl of beef noodles for lunch.", sentenceZh: "他午餐吃了一大碗牛肉麵。" },
      { week: 2, day: 2, word: "cage", zh: "籠子", pos: "n. | v. 關入籠中", category: "日常用品", collocations: "bird cage (鳥籠) / lock in a cage (關在籠子裡)", sentence: "The parrot is singing happily inside its cage.", sentenceZh: "那隻鸚鵡在籠子裡歡快地唱著歌。" },
      { week: 2, day: 2, word: "host", zh: "主人；主持人", pos: "n. | v. 主辦/主持", category: "人物與稱謂", collocations: "party host (派對主持人) / TV host (電視節目主持人)", sentence: "The host gave a warm welcome to all the visitors.", sentenceZh: "主持人熱情地歡迎所有訪客。" },
      { week: 2, day: 2, word: "sidewalk", zh: "人行道", pos: "n.", category: "方位與空間", collocations: "walk on the sidewalk (走在人行道上) / wide sidewalk (寬敞的人行道)", sentence: "Children should always walk safely on the sidewalk.", sentenceZh: "小孩子應該始終安全地走在人行道上。" }
    ];

    // 2. Supplementary Focus Data (國中重點補充資料庫)
    const supplementaryData = {
      "daddy": {
        forms: "名詞複數 去 y 改 ies ➔ daddies；同義詞：dad, father；女性對應：mommy",
        grammar: "幼兒或家庭中親切稱呼父親；直接稱呼自己爸爸時首字母習慣大寫 (例如：Where is Daddy?)。",
        phrases: "daddy's girl (爸爸的掌上明珠) / call daddy (叫爸爸) / big daddy (老大；長輩)",
        examPoint: "稱謂與所有格考點：複數名詞所有格為 daddies'；生活英語對話中 Daddy 為親切口語表達。"
      },
      "mother": {
        forms: "名詞複數 mothers；口語稱謂：mom, mommy；男性對應：father",
        grammar: "尊稱自己的母親常大寫：Mother；形容詞形態：motherly (慈母般的)。",
        phrases: "Mother's Day (母親節) / mother tongue (母語) / mother-in-law (婆婆/岳母) / Mother Nature (大自然)",
        examPoint: "節日考點：Mother's Day（台灣每年五月第二個星期天），注意使用單數所有格 's。"
      },
      "mom": {
        forms: "名詞複數 moms；英式拼法：mum；同義字：mother, mommy",
        grammar: "指稱自己媽媽時大寫且不加冠詞 (Where is Mom?)；指別人的媽媽則小寫 (his mom)。",
        phrases: "stay-at-home mom (全職媽媽) / soccer mom (接送孩子參加活動的熱心媽媽)",
        examPoint: "日常生活情境題高頻字：家庭生活對話中直接叫媽媽一律用 \"Mom\"。"
      },
      "mommy": {
        forms: "名詞複數 去 y 改 ies ➔ mommies；英式拼法：mummy；男性對應：daddy",

        phrases: "mommy's boy (依賴媽媽的孩子/媽寶) / mommy and me (親子活動/媽咪和我)",
        examPoint: "名詞複數字尾變化：子音 + y 結尾去 y 加 ies (mommy ➔ mommies, daddy ➔ daddies)。"

      "top": {

        examPoint: "介系詞片語必考：on top of the mountain (在山頂上)；片語 on top of that 表示「此外/更甚者」。"
      },
      "bell": {
        forms: "名詞複數 bells；動詞 ring (ring - rang - rung)",
        grammar: "可數名詞，指鈴鐺、鐘聲或門鈴。",
        phrases: "ring a bell (按鈴；聽起來耳熟) / school bell (上下課鐘聲) / doorbell (門鈴) / wedding bell (結婚鐘聲)",
        examPoint: "會考高頻聽力與對話片語：That name rings a bell.（那個名字聽起來很耳熟 / 我有點印象）。"
      },
      "bowl": {
        forms: "名詞複數 bowls；動詞 bowl (打保齡球)；名詞 bowling (保齡球運動)",
        grammar: "常作為量詞單位：a bowl of + 不可數名詞 (a bowl of soup / rice / noodles)。",
        phrases: "a bowl of soup (一碗湯) / salad bowl (沙拉碗) / toilet bowl (馬桶)",
        examPoint: "量詞考點：複數時量詞加 s (two bowls of rice，不可寫成 two bowl of rices)。"
      },
      "cage": {
        forms: "名詞複數 cages；動詞三態 cage - caged - caged (把…關進籠中)",
        grammar: "指關動物的籠子或拘禁處；可數名詞。",
        phrases: "bird cage (鳥籠) / lock in a cage (關在籠子裡) / cage bird (籠中鳥；失去自由者)",
        examPoint: "動詞與介系詞搭配：keep the bird in a cage (把鳥養在籠子裡)；in a cage 表空間內部。"
      },
      "host": {
        forms: "名詞複數 hosts；女性主持人/女主人：hostess；相反詞：guest (客人/賓客)",
        grammar: "可作名詞指「男主人、節目主持人」；作動詞指「主辦、主持」(host a party / game)。",
        phrases: "party host (派對主人) / TV host (電視節目主持人) / host country (主辦國)",

    // 3. Pronunciation Override Mapping (TTS Speech Correction)
    const pronunciationOverrides = {
      "I": "eye",
      "Mr.": "Mister",
      "Mrs.": "Missus",
      "Ms.": "Mizz",
      "Miss": "Miss",
      "sir": "sir",
      "MRT": "M R T",
      "USA": "U S A",
      "e.g.": "for example",
      "i.e.": "that is"

    let currentSlideIndex = 0;

    let autoSpeechEnabled = true;

    // DOM Elements
    const slidesContainer = document.getElementById('slides-container');

    const progressBarFill = document.getElementById('progress-bar-fill');

    function buildSlides() {
      // 1. Cover option in select
      const coverOpt = document.createElement('option');
      coverOpt.value = "0";
      coverOpt.textContent = "00. 封面 - 2026 一起背單字 (國中組)";
      slideSelector.appendChild(coverOpt);

      // 2. Generate each word slide
      rawWords.forEach((item, idx) => {
        const slideNum = idx + 1;
        const supp = supplementaryData[item.word] || {
          forms: "常規形態變化",
          grammar: "國中基礎核心必考單字。",
          phrases: item.collocations,
          examPoint: "注意單字拼寫與句子搭配用法。"
        };

        // Dropdown Option
        const opt = document.createElement('option');
        opt.value = slideNum.toString();
        opt.textContent = `${String(slideNum).padStart(2, '0')}. Day ${item.day} - ${item.word} (${item.zh})`;

        slideEl.dataset.category = item.category;
        slideEl.dataset.word = item.word;

        slideEl.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-12 gap-3 md:gap-5 h-full items-stretch mobile-deck-grid">

              <!-- Word Title & POS Badge Row -->
              <div class="flex items-center justify-between bg-white/95 px-4 md:px-6 py-2.5 md:py-3.5 rounded-2xl border-2 border-sky-200 card-shadow shrink-0">
                <div class="flex items-baseline gap-2 md:gap-4 flex-wrap">
                  <span class="text-4xl sm:text-5xl md:text-[64px] font-black text-orange-600 tracking-tight leading-none drop-shadow-sm font-['Fredoka']">

                    <span class="text-sky-950 font-bold">${item.zh}</span>
                    <span class="text-sky-600 font-medium text-sm sm:text-base md:text-[22px] ml-1 bg-sky-200/60 px-2 md:px-2.5 py-0.5 rounded-md">${item.pos}</span>
                  </div>
                </div>
                <button onclick="speakText('${item.word}')" class="p-2 md:p-3 bg-orange-500 hover:bg-orange-600 active:scale-95 text-white rounded-2xl shadow-md transition-transform flex items-center justify-center shrink-0" title="朗讀單字 (TTS)">
                  <i data-lucide="volume-2" class="w-5 h-5 md:w-7 md:h-7"></i>
                </button>
              </div>

              <!-- Collocation Card (Fixed Desktop Height: 185px) -->

                    <h3 class="text-lg md:text-[24px] font-extrabold text-orange-950 tracking-tight">實用例句 (Example Sentence)</h3>

                  <button onclick="speakSentence('${item.sentence.replace(/'/g, "\\'")}')" class="text-orange-600 hover:text-orange-800 text-xs font-bold flex items-center gap-1 bg-orange-100/80 px-2 md:px-2.5 py-1 rounded-lg">
                    <i data-lucide="volume-1" class="w-3.5 h-3.5"></i>

            <!-- RIGHT COLUMN (Supplementary Panel: Desktop Width 440px, Height 510px) -->

              <!-- Header -->
              <div class="flex items-center gap-2 pb-2 border-b border-sky-200 shrink-0">

              <!-- Content items -->
              <div class="flex-1 overflow-y-auto pr-1 py-2 flex flex-col gap-2.5 md:gap-3 custom-scroll">
                
                <!-- Forms / Changes -->
                <div class="bg-sky-50/80 p-2.5 md:p-3 rounded-xl border border-sky-200">
                  <div class="text-base md:text-[25px] font-black text-sky-900 flex items-center gap-1.5 mb-1">
                    <span>🔹</span> <span>變化 / 格位 / 形態</span>

                <!-- Exam Focus Point -->
                <div class="bg-orange-50/80 p-2.5 md:p-3 rounded-xl border border-orange-200">

                <!-- Useful Phrases & Grammar -->
                <div class="bg-slate-50 p-2.5 md:p-3 rounded-xl border border-slate-200">

        slidesContainer.appendChild(slideEl);
      });

      // Render Lucide icons
      lucide.createIcons();

    function updateSlideUI() {
      const slides = document.querySelectorAll('.slide-view');
      slides.forEach((slide, idx) => {
        if (idx === currentSlideIndex) {
          slide.classList.add('active');
          if (window.innerWidth < 768) {
            slide.scrollTop = 0; // Scroll back to top on mobile slide switch
          }
        } else {
          slide.classList.remove('active');
        }
      });

      slideSelector.value = currentSlideIndex.toString();
      slideIndicator.textContent = `${currentSlideIndex} / ${totalSlides - 1}`;
      if (currentSlideIndex === 0) {
        slideIndicator.textContent = `封面 / ${totalSlides - 1}`;
      }

      const progressPercent = (currentSlideIndex / (totalSlides - 1)) * 100;
      progressBarFill.style.width = `${progressPercent}%`;

      prevBtn.disabled = currentSlideIndex === 0;
      nextBtn.disabled = currentSlideIndex === totalSlides - 1;

      const currentSlide = slides[currentSlideIndex];

      if (autoSpeechEnabled && currentSlideIndex > 0) {
        const wordToSpeak = currentSlide.dataset.word;
        if (wordToSpeak) {
          speakText(wordToSpeak);
        }
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < totalSlides) {
        currentSlideIndex = index;
        updateSlideUI();
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        goToSlide(currentSlideIndex - 1);
      }
    }

    function nextSlide() {
      if (currentSlideIndex < totalSlides - 1) {
        goToSlide(currentSlideIndex + 1);
      }
    }

    function getPhoneticCorrectedText(text) {
      const trimmed = text.trim();
      if (pronunciationOverrides[trimmed]) {
        return pronunciationOverrides[trimmed];
      }
      return text;
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const correctedText = getPhoneticCorrectedText(text);
      const utterance = new SpeechSynthesisUtterance(correctedText);
      utterance.lang = 'en-US';
      utterance.rate = 0.88;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.startsWith('en-US') || v.lang.startsWith('en'));
      if (enVoice) {
        utterance.voice = enVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    function speakSentence(sentence) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(sentence);
      utterance.lang = 'en-US';
      utterance.rate = 0.92;
      window.speechSynthesis.speak(utterance);
    }

    function speakCurrentWord() {
      if (currentSlideIndex === 0) {
        speakSentence("Welcome to English vocabulary practice!");
        return;
      }
      const currentSlide = document.querySelectorAll('.slide-view')[currentSlideIndex];
      if (currentSlide && currentSlide.dataset.word) {
        speakText(currentSlide.dataset.word);
      }
    }

    function fitPresentationStage() {
      const stage = document.getElementById('presentation-stage');
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      // For Mobile Portrait (< 768px), disable transform scaling and use vertical responsive flow
      if (windowWidth < 768) {
        stage.style.transform = 'none';
        return;
      }

      const baseWidth = 1200;
      const baseHeight = 675;

      const scaleX = (windowWidth * 0.96) / baseWidth;
      const scaleY = (windowHeight * 0.96) / baseHeight;
      const scale = Math.min(scaleX, scaleY, 1.15);

      stage.style.transform = `scale(${scale})`;
    }

    function toggleFullScreen() {
      const doc = window.document;
      const docEl = doc.documentElement;

      const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (requestFullScreen) {
          requestFullScreen.call(docEl);
        }
      } else {
        if (cancelFullScreen) {
          cancelFullScreen.call(doc);
        }
      }
    }

    function updateFullscreenIcon() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      const btn = document.getElementById('fullscreen-btn');
      if (!btn) return;
      
      btn.innerHTML = isFullscreen 
        ? `<i data-lucide="minimize" class="w-4 h-4"></i>` 
        : `<i data-lucide="maximize" class="w-4 h-4"></i>`;
      lucide.createIcons();
    }

    function initInteractions() {
      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          prevSlide();
        } else if (e.key === 'Home') {
          e.preventDefault();
          goToSlide(0);
        } else if (e.key === 'End') {
          e.preventDefault();
          goToSlide(totalSlides - 1);
        } else if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          toggleFullScreen();
        }
      });

      // Fullscreen change events
      ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(ev => {
        document.addEventListener(ev, () => {
          updateFullscreenIcon();
          setTimeout(fitPresentationStage, 100);
        });
      });

      // Touch swipe gestures
      let touchStartX = 0;
      let touchStartY = 0;
      const stage = document.getElementById('presentation-stage');

      stage.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      stage.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        // Horizontal swipe detection (more significant horizontal displacement than vertical)
        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 45) {
          if (diffX < 0) {
            nextSlide();
          } else {
            prevSlide();
          }
        }
      }, { passive: true });

      window.addEventListener('resize', fitPresentationStage);
      window.addEventListener('orientationchange', () => {
        setTimeout(fitPresentationStage, 200);
      });
    }

    window.onload = function() {
      buildSlides();
      fitPresentationStage();
      initInteractions();
      updateSlideUI();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }
    };
  </script>
