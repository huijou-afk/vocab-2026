  <!-- Tailwind CSS CDN -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary-color: #0369a1;
      --accent-orange: #ea580c;
      --slide-width: 1200px;
      --slide-height: 675px;
    }

    body {
      font-family: 'Fredoka', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f172a;
      color: #1e293b;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Desktop/Tablet 16:9 Stage Viewport */
    #viewport-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #presentation-stage {
      position: relative;
      width: var(--slide-width);
      height: var(--slide-height);
      transform-origin: center center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      border-radius: 28px;
      background-color: #ffffff;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.15s ease-out;
    }

    .slide-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: scale(0.985);
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }

    .slide-view.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      pointer-events: auto;
    }

    .card-shadow {
      box-shadow: 0 8px 24px -4px rgba(3, 105, 161, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #93c5fd;
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #0284c7;
    }

    /* Responsive adjustments for Mobile Portrait (< 768px) */
    @media (max-width: 767px) {
      body {
        overflow: auto;
      }
      #viewport-wrapper {
        align-items: stretch;
        height: 100vh;
        height: 100dvh;
      }
      #presentation-stage {
        width: 100% !important;
        height: 100% !important;
        transform: none !important;
        border-radius: 0 !important;
        border-width: 0 !important;
        box-shadow: none !important;
      }
      .slide-view {
        position: relative;
        height: 100%;
        overflow-y: auto;
        padding: 1rem !important;
        -webkit-overflow-scrolling: touch;
      }
      .slide-view:not(.active) {
        display: none !important;
      }
      .mobile-deck-grid {
        display: flex !important;
        flex-direction: column !important;
        gap: 1rem !important;
        height: auto !important;
      }
      .mobile-card-fix {
        width: 100% !important;
        height: auto !important;
        min-height: auto !important;
      }
    }
  </style>
</head>
<body>

  <div id="viewport-wrapper">
    <main id="presentation-stage" class="relative flex flex-col justify-between bg-gradient-to-br from-sky-50 via-white to-blue-50 border-4 border-sky-200">
      
      <!-- Slide Content Area (No top header bar) -->
      <div id="slides-container" class="relative flex-1 w-full h-full overflow-hidden">
        
        <!-- COVER SLIDE (Strictly 3 Elements: Title, Date, Category Tags) -->
        <section class="slide-view active p-6 md:p-10 flex flex-col items-center justify-center text-center relative" data-title="封面 (Cover)">
          <div class="max-w-3xl flex flex-col items-center justify-center my-auto">
            
            <!-- 1. Big Main Title -->
            <h2 class="text-4xl sm:text-5xl md:text-6xl font-black text-sky-900 tracking-wide mb-6 md:mb-8 drop-shadow-sm font-['Fredoka']">
              2026 一起背單字 <span class="text-orange-600">(國中組)</span>
            </h2>

            <!-- 2. Date -->
            <div class="text-lg sm:text-xl md:text-2xl font-bold text-slate-700 bg-white/95 px-6 md:px-8 py-2.5 md:py-3.5 rounded-2xl border-2 border-sky-200 shadow-sm mb-6 md:mb-8">
              📅 [W03] 2026/09/17 (四)
            </div>

            <!-- 3. Category Tags -->
            <div id="cover-categories" class="flex flex-wrap justify-center gap-3 md:gap-3.5 max-w-xl">

          </div>

        <!-- Progress bar line -->
        <div class="w-full bg-slate-100 h-1.5 md:h-2 rounded-full overflow-hidden border border-slate-200">

        </div>

        <div class="flex items-center justify-between gap-1 sm:gap-2">
          <!-- Left: Prev & Pronounce Button -->

            <button id="read-current-btn" onclick="speakCurrentWord()" class="flex items-center gap-1 px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl bg-orange-100 hover:bg-orange-200 active:bg-orange-300 text-orange-900 font-bold text-xs sm:text-sm transition shadow-sm" title="朗讀此頁單字">
              <i data-lucide="volume-2" class="w-4 h-4 text-orange-600"></i>

            <div class="relative">
              <select id="slide-selector" onchange="goToSlide(parseInt(this.value))" class="appearance-none bg-slate-50 border border-slate-300 hover:border-sky-400 text-slate-700 text-xs sm:text-xs font-bold rounded-lg pl-2 sm:pl-3 pr-6 sm:pr-8 py-1 sm:py-1.5 focus:outline-none focus:ring-2 focus:ring-sky-500 max-w-[130px] sm:max-w-[220px] truncate">

            </button>
            <button id="fullscreen-btn" onclick="toggleFullScreen()" class="p-1.5 sm:p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition shadow-sm" title="全螢幕切換 (快速鍵: F)">
              <i id="fullscreen-icon" data-lucide="maximize" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </footer>

    </main>
  </div>

  <script>
    // 1. Vocabulary Dataset for [W03] 2026/09/17 (四)
    const rawWords = [
      { week: 3, day: 4, word: "boat", zh: "小船", pos: "n.", category: "交通與地點", collocations: "row a boat (划船) / fishing boat (漁船)", sentence: "We enjoyed a peaceful ride on a wooden boat.", sentenceZh: "我們享受了一趟平靜的木舟之旅。" },
      { week: 3, day: 4, word: "zoo", zh: "動物園", pos: "n.", category: "交通與地點", collocations: "visit the zoo (參觀動物園) / Taipei Zoo (台北市立動物園)", sentence: "The children were excited to see the pandas at the zoo.", sentenceZh: "孩子們在動物園看到大貓熊感到非常興奮。" },
      { week: 3, day: 4, word: "bank", zh: "銀行", pos: "n. | v. 存錢", category: "交通與地點", collocations: "bank account (銀行帳戶) / river bank (河岸)", sentence: "She went to the bank to deposit some pocket money.", sentenceZh: "她去銀行存了一些零用錢。" },
      { week: 3, day: 4, word: "park", zh: "公園", pos: "n. | v. 停車", category: "交通與地點", collocations: "national park (國家公園) / park a car (停車)", sentence: "We often take a walk in the park after dinner.", sentenceZh: "我們常在晚餐後去公園散步。" },
      { week: 3, day: 4, word: "it", zh: "它；牠", pos: "pron.", category: "數量與代名詞", collocations: "it is (它是/天氣是) / make it (成功；趕上)", sentence: "It is a sunny and breezy morning.", sentenceZh: "這是一個陽光明媚且微風徐徐的早晨。" },
      { week: 3, day: 4, word: "me", zh: "我", pos: "pron. (受格)", category: "數量與代名詞", collocations: "give me (給我) / tell me (告訴我)", sentence: "Please help me carry these heavy books upstairs.", sentenceZh: "請幫我把這些厚重的書搬到樓上去。" },
      { week: 3, day: 4, word: "nothing", zh: "沒什麼", pos: "pron.", category: "數量與代名詞", collocations: "nothing special (沒什麼特別的) / have nothing to do with (與…無關)", sentence: "There is nothing in the fridge, so let's eat out.", sentenceZh: "冰箱裡什麼都沒有，我們出去吃吧。" },
      { week: 3, day: 4, word: "someone", zh: "某人", pos: "pron.", category: "數量與代名詞", collocations: "someone special (特別的人) / meet someone (遇見某人)", sentence: "Someone knocked on the classroom door loudly.", sentenceZh: "有人大聲地敲了教室的門。" },
      { week: 3, day: 4, word: "space", zh: "空間", pos: "n.", category: "空間與特質", collocations: "parking space (停車位) / outer space (外太空)", sentence: "There is enough space in the trunk for our luggage.", sentenceZh: "後車廂有足夠的空間放我們的行李。" },
      { week: 3, day: 4, word: "character", zh: "角色;性格", pos: "n.", category: "空間與特質", collocations: "main character (主角) / good character (良好品格)", sentence: "The main character in the story is brave and smart.", sentenceZh: "故事中的主角勇敢又聰明。" }
    ];

    // 2. Supplementary Focus Data (嚴格聚焦目標單字本體的國中重點補充資料庫)
    const supplementaryData = {
      "boat": {
        forms: "名詞複數 boats；動詞 boat (划船/乘船)；同類大船：ship (遠洋輪船/大艦艇)",
        grammar: "可數名詞；搭乘小船交通介系詞：by boat (無冠詞、無複數) / in a boat (在小船艙內) / on a boat (亦常見於觀光渡輪)。",
        phrases: "row a boat (划小船) / be in the same boat (處境相同；休戚與共) / rock the boat (破壞現狀/興風作浪) / miss the boat (錯失良機)",
        examPoint: "會考高頻素養片語必考：We are all in the same boat. (我們同在一條船上，面臨相同困境)；小型船隻用 boat，大型遠洋輪船用 ship。"
      },
      "zoo": {
        forms: "名詞複數 zoos (母音字母 o 結尾直接加 s，不可加 es)；全名為 zoological garden",
        grammar: "可數名詞；表示在動物園固定搭配地點介系詞 at (at the zoo / go to the zoo)。",
        phrases: "Taipei Zoo (台北市立動物園) / visit the zoo (參觀動物園) / petting zoo (可愛動物觸摸互動區) / like a zoo (混亂嘈雜的場所)",
        examPoint: "會考字尾複數規則考點：母音 + o 結尾直接加 s (zoo ➔ zoos, radio ➔ radios, video ➔ videos)；參觀地點固定搭配：at the zoo。"
      },
      "bank": {
        forms: "名詞複數 banks；動詞三態 bank - banked - banked (把錢存入銀行；傾斜飛行)",
        grammar: "一字多義核心考點：1. 存放金錢的金融機構「銀行」(可數)；2. 河流/湖泊兩側的「河岸/堤防」(常與 river 連用為 river bank)。",
        phrases: "bank account (銀行帳戶) / bank card (金融卡) / river bank (河岸) / bank on sb/sth (指望/依靠某人事物 = count on)",
        examPoint: "會考常考一字多義語境題：考題常利用「river bank (坐在河岸邊)」與「deposit money in the bank (去銀行存錢)」測驗文意辨析。"
      },
      "park": {
        forms: "名詞複數 parks；動詞三態 park - parked - parked (停放車輛)；動名詞 parking (停車)",
        grammar: "作名詞指「公園、園區」；作動詞指「停放車輛 (park the car)」，常見衍生名詞 parking lot (停車場) 與 parking space (停車位)。",
        phrases: "national park (國家公園) / amusement park (遊樂園) / parking lot (停車場) / No Parking (禁止停車標誌)",
        examPoint: "詞性轉換考點：名詞「公園 (take a walk in the park)」vs. 動詞「停車 (You cannot park here.)」；生活告示閱讀常考 No Parking。"
      },
      "it": {
        forms: "主格 it ➔ 受格 it ➔ 所有格 its (無撇號！) ➔ 反身代名詞 itself",
        grammar: "代替無生命單數事物或未知性別動物；亦作「虛主詞 (dummy subject)」表示時間、天氣、溫度、距離 (It is 8 o'clock / It rains / It is cold)。",
        phrases: "make it (及時趕到；成功達成) / It's up to you. (由你決定) / forget it (算了；別提了) / It depends. (看情況而定)",
        examPoint: "【會考核心雙考點】：1. 所有格 its (它的) 絕對不可加上撇號寫成 it's (it is 的縮寫)；2. 虛主詞核心句型：It is + adj. + (for sb) to + 原形動詞。"
      },
      "me": {
        forms: "第一人稱主格 I ➔ 受格 me ➔ 所有格 my ➔ 所有格代名詞 mine ➔ 反身代名詞 myself",
        grammar: "作為及物動詞或介系詞後方的「受格」(Help me / Look at me)；口語簡答自我認同常用 \"It's me.\" (正式文法為 It is I.)。",
        phrases: "between you and me (這是你我之間的私下秘密) / Excuse me. (不好意思/請問) / look at me (看著我) / Give me a break. (饒了我吧)",
        examPoint: "會考代名詞格位必考：介系詞與動詞後面一律嚴格使用「受格 me」(例如：between you and me，絕對不可寫成 between you and I)！"
      },
      "nothing": {
        forms: "不定代名詞 (由 no + thing 組成)；對比詞：something (某事), everything (每件事), anything (任何事)",
        grammar: "作主詞時「動詞一律視為單數」(Nothing is impossible.)；否定結構 not... anything = nothing (I know nothing. = I don't know anything.)。",
        phrases: "nothing special (沒什麼特別的) / have nothing to do with (與…毫無關聯) / nothing but (只不過是/僅僅) / for nothing (免費；徒勞無功)",
        examPoint: "【會考核心後置修飾與單數考點】：1. 形容詞修飾 nothing 必須「後置」(例：nothing special、nothing new)；2. 作主詞時動詞必用單數形！"
      },
      "someone": {
        forms: "不定代名詞 (由 some + one 組成)；同義詞：somebody；否定/疑問對應詞：anyone / anybody",
        grammar: "主要用於肯定句；作主詞時「動詞一律視為單數」(Someone is knocking on the door.)；在期望得到肯定回答的禮貌疑問句中亦可用 someone。",
        phrases: "someone special (特別的人/心儀對象) / someone else (別的人) / be someone (成為重要人物/有成就的人)",
        examPoint: "【會考核心雙考點】：1. someone 當主詞時「動詞一律用單數」(Someone has left the umbrella.)；2. 形容詞修飾必須「後置」(someone special)。"
      },
      "space": {
        forms: "指宇宙空間/餘地時通常「不可數」；指特定劃分的「車位/空格」時為可數名詞 (複數 spaces)；形容詞 spacious (寬敞的)",
        grammar: "指宇宙「外太空 (outer space)」時前面通常不加冠詞 (travel into space)；指實體空間時常搭配量詞 enough space / a lot of space。",
        phrases: "parking space (停車位) / outer space (外太空) / space station (太空站) / make space for (為…騰出空間) / open space (開放空間)",
        examPoint: "名詞可數性辨析考點：指宇宙太空時為不可數名詞且通常不加 the (sent into space)；指具體劃分的停車格或空格時為可數 (find a parking space)。"
      },
      "character": {
        forms: "名詞複數 characters；注意開頭字母發音：ch 發 /k/ 音，非 /tʃ/！形容詞 characteristic (特有的)",
        grammar: "國中核心多義字：1. 小說/電影/戲劇中的「角色/人物」(可數)；2. 個人的「性格/道德品格」(常作不可數)；3. 中文字「漢字/字元」(Chinese characters，可數)。",
        phrases: "main character (主角) / in character (符合個性/入戲) / out of character (不合常態/不符合個性) / Chinese character (中文字/漢字)",
        examPoint: "會考閱讀題型核心關鍵字：閱讀理解測驗題幹高頻出現 main character 指篇章「主角」；發音陷阱題中注意 ch 發 /k/ 音 (同 school, chemistry)。"
      }
    };

    // 3. Pronunciation Override Mapping (TTS Speech Correction)
    const pronunciationOverrides = {
      "I": "eye",
      "Mr.": "Mister",
      "Mrs.": "Missus",
      "Ms.": "Mizz",
      "Miss": "Miss",
      "sir": "sir",
      "MRT": "M R T",
      "USA": "U S A",
      "e.g.": "for example",
      "i.e.": "that is"
    };

    let currentSlideIndex = 0;
    const totalSlides = rawWords.length + 1; // +1 for Cover slide
    let autoSpeechEnabled = true;

    // DOM Elements
    const slidesContainer = document.getElementById('slides-container');
    const slideSelector = document.getElementById('slide-selector');
    const slideIndicator = document.getElementById('slide-indicator');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    function buildSlides() {
      // 1. Cover option in select
      const coverOpt = document.createElement('option');
      coverOpt.value = "0";
      coverOpt.textContent = "00. 封面 - 2026 一起背單字 (國中組)";
      slideSelector.appendChild(coverOpt);

      // 2. Generate each word slide
      rawWords.forEach((item, idx) => {
        const slideNum = idx + 1;
        const supp = supplementaryData[item.word] || {
          forms: "常規形態變化",
          grammar: "國中基礎核心必考單字。",
          phrases: item.collocations,
          examPoint: "注意單字拼寫與句子搭配用法。"
        };

        // Dropdown Option
        const opt = document.createElement('option');
        opt.value = slideNum.toString();
        opt.textContent = `${String(slideNum).padStart(2, '0')}. Day ${item.day} - ${item.word} (${item.zh})`;
        slideSelector.appendChild(opt);

        // Word Slide Element
        const slideEl = document.createElement('section');
        slideEl.className = "slide-view p-4 md:p-7 flex flex-col justify-between";

                  <i data-lucide="volume-2" class="w-5 h-5 md:w-7 md:h-7"></i>

              <!-- Collocation Card (Fixed Desktop Height: 185px) -->
              <div class="bg-gradient-to-br from-white to-sky-50/60 p-3 md:p-4 rounded-2xl border-2 border-sky-100 card-shadow flex flex-col justify-center md:h-[185px] shrink-0">
                <div class="flex items-center gap-2 mb-1.5 md:mb-2">

                <div class="text-base sm:text-lg md:text-[23px] font-semibold text-slate-700 bg-white/80 p-2.5 md:p-3 rounded-xl border border-sky-100 leading-snug">

              <!-- Sentence Card (Fixed Desktop Height: 225px) -->
              <div class="bg-gradient-to-br from-white to-amber-50/40 p-3 md:p-4 rounded-2xl border-2 border-orange-100 card-shadow flex flex-col justify-center md:h-[225px] shrink-0">
                <div class="flex items-center justify-between mb-1.5 md:mb-2">

                    <i data-lucide="volume-1" class="w-3.5 h-3.5"></i>

            <!-- RIGHT COLUMN (Supplementary Panel: Desktop Width 440px, Height 510px) -->

                <div class="bg-orange-50/80 p-2.5 md:p-3 rounded-xl border border-orange-200">

      // Render Lucide icons
      lucide.createIcons();

    function updateSlideUI() {
      const slides = document.querySelectorAll('.slide-view');
      slides.forEach((slide, idx) => {
        if (idx === currentSlideIndex) {
          slide.classList.add('active');
          if (window.innerWidth < 768) {
            slide.scrollTop = 0; // Scroll back to top on mobile slide switch
          }
        } else {
          slide.classList.remove('active');
        }
      });

      slideSelector.value = currentSlideIndex.toString();
      slideIndicator.textContent = `${currentSlideIndex} / ${totalSlides - 1}`;
      if (currentSlideIndex === 0) {
        slideIndicator.textContent = `封面 / ${totalSlides - 1}`;
      }

      const progressPercent = (currentSlideIndex / (totalSlides - 1)) * 100;
      progressBarFill.style.width = `${progressPercent}%`;

      prevBtn.disabled = currentSlideIndex === 0;
      nextBtn.disabled = currentSlideIndex === totalSlides - 1;

      const currentSlide = slides[currentSlideIndex];

      if (autoSpeechEnabled && currentSlideIndex > 0) {
        const wordToSpeak = currentSlide.dataset.word;
        if (wordToSpeak) {
          speakText(wordToSpeak);
        }
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < totalSlides) {
        currentSlideIndex = index;
        updateSlideUI();
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        goToSlide(currentSlideIndex - 1);
      }
    }

    function nextSlide() {
      if (currentSlideIndex < totalSlides - 1) {
        goToSlide(currentSlideIndex + 1);
      }
    }

    function getPhoneticCorrectedText(text) {
      const trimmed = text.trim();
      if (pronunciationOverrides[trimmed]) {
        return pronunciationOverrides[trimmed];
      }
      return text;
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const correctedText = getPhoneticCorrectedText(text);
      const utterance = new SpeechSynthesisUtterance(correctedText);
      utterance.lang = 'en-US';
      utterance.rate = 0.88;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.startsWith('en-US') || v.lang.startsWith('en'));
      if (enVoice) {
        utterance.voice = enVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    function speakSentence(sentence) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(sentence);
      utterance.lang = 'en-US';
      utterance.rate = 0.92;
      window.speechSynthesis.speak(utterance);
    }

    function speakCurrentWord() {
      if (currentSlideIndex === 0) {
        speakSentence("Welcome to English vocabulary practice!");
        return;
      }
      const currentSlide = document.querySelectorAll('.slide-view')[currentSlideIndex];
      if (currentSlide && currentSlide.dataset.word) {
        speakText(currentSlide.dataset.word);
      }
    }

    function fitPresentationStage() {
      const stage = document.getElementById('presentation-stage');
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      // For Mobile Portrait (< 768px), disable transform scaling and use vertical responsive flow
      if (windowWidth < 768) {
        stage.style.transform = 'none';
        return;
      }

      const baseWidth = 1200;
      const baseHeight = 675;

      const scaleX = (windowWidth * 0.96) / baseWidth;
      const scaleY = (windowHeight * 0.96) / baseHeight;
      const scale = Math.min(scaleX, scaleY, 1.15);

      stage.style.transform = `scale(${scale})`;
    }

    function toggleFullScreen() {
      const doc = window.document;
      const docEl = doc.documentElement;

      const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (requestFullScreen) {
          requestFullScreen.call(docEl);
        }
      } else {
        if (cancelFullScreen) {
          cancelFullScreen.call(doc);
        }
      }
    }

    function updateFullscreenIcon() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      const btn = document.getElementById('fullscreen-btn');
      if (!btn) return;
      
      btn.innerHTML = isFullscreen 
        ? `<i data-lucide="minimize" class="w-4 h-4"></i>` 
        : `<i data-lucide="maximize" class="w-4 h-4"></i>`;
      lucide.createIcons();
    }

    function initInteractions() {
      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          prevSlide();
        } else if (e.key === 'Home') {
          e.preventDefault();
          goToSlide(0);
        } else if (e.key === 'End') {
          e.preventDefault();
          goToSlide(totalSlides - 1);
        } else if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          toggleFullScreen();
        }
      });

      // Fullscreen change events
      ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(ev => {
        document.addEventListener(ev, () => {
          updateFullscreenIcon();
          setTimeout(fitPresentationStage, 100);
        });
      });

      // Touch swipe gestures
      let touchStartX = 0;
      let touchStartY = 0;
      const stage = document.getElementById('presentation-stage');

      stage.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      stage.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        // Horizontal swipe detection
        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 45) {
          if (diffX < 0) {
            nextSlide();
          } else {
            prevSlide();
          }
        }
      }, { passive: true });

      window.addEventListener('resize', fitPresentationStage);
      window.addEventListener('orientationchange', () => {
        setTimeout(fitPresentationStage, 200);
      });
    }

    window.onload = function() {
      buildSlides();
      fitPresentationStage();
      initInteractions();
      updateSlideUI();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }
    };
  </script>
