<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 一起背單字 (國中組) - [W03] 2026/09/14 (一)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Fredoka & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --primary-color: #0369a1;
      --accent-orange: #ea580c;
      --slide-width: 1200px;
      --slide-height: 675px;
    }

    body {
      font-family: 'Fredoka', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #0f172a;
      color: #1e293b;
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Desktop/Tablet 16:9 Stage Viewport */
    #viewport-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #presentation-stage {
      position: relative;
      width: var(--slide-width);
      height: var(--slide-height);
      transform-origin: center center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
      border-radius: 28px;
      background-color: #ffffff;
      overflow: hidden;
      flex-shrink: 0;
      transition: transform 0.15s ease-out;
    }

    .slide-view {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, transform 0.2s ease;
      transform: scale(0.985);
      pointer-events: none;
      display: flex;
      flex-direction: column;
    }

    .slide-view.active {
      opacity: 1;
      visibility: visible;
      transform: scale(1);
      pointer-events: auto;
    }

    .card-shadow {
      box-shadow: 0 8px 24px -4px rgba(3, 105, 161, 0.08), 0 4px 12px -2px rgba(0, 0, 0, 0.04);
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #93c5fd;
      border-radius: 10px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: #0284c7;
    }

    @media (max-width: 767px) {
      body {
        overflow: auto;
      }
      #viewport-wrapper {
        align-items: stretch;
        height: 100vh;
        height: 100dvh;
      }
      #presentation-stage {
        width: 100% !important;
        height: 100% !important;
        transform: none !important;
        border-radius: 0 !important;
        border-width: 0 !important;
        box-shadow: none !important;
      }
      .slide-view {
        position: relative;
        height: 100%;
        overflow-y: auto;
        padding: 1rem !important;
        -webkit-overflow-scrolling: touch;
      }
      .slide-view:not(.active) {
        display: none !important;
      }
      .mobile-deck-grid {
        display: flex !important;
        flex-direction: column !important;
        gap: 1rem !important;
        height: auto !important;
      }
      .mobile-card-fix {
        width: 100% !important;
        height: auto !important;
        min-height: auto !important;
      }
    }
  </style>
</head>
<body>

  <div id="viewport-wrapper">
    <main id="presentation-stage" class="relative flex flex-col justify-between bg-gradient-to-br from-sky-50 via-white to-blue-50 border-4 border-sky-200">
      
      <!-- Slide Content Area (No top header bar) -->
      <div id="slides-container" class="relative flex-1 w-full h-full overflow-hidden">
        
        <!-- COVER SLIDE (Strictly 3 Elements: Title, Date, Category Tags) -->
        <section class="slide-view active p-6 md:p-10 flex flex-col items-center justify-center text-center relative" data-title="封面 (Cover)">
          <div class="max-w-3xl flex flex-col items-center justify-center my-auto">
            
            <!-- 1. Big Main Title -->
            <h2 class="text-4xl sm:text-5xl md:text-6xl font-black text-sky-900 tracking-wide mb-6 md:mb-8 drop-shadow-sm font-['Fredoka']">
              2026 一起背單字 <span class="text-orange-600">(國中組)</span>
            </h2>

            <!-- 2. Date -->
            <div class="text-lg sm:text-xl md:text-2xl font-bold text-slate-700 bg-white/95 px-6 md:px-8 py-2.5 md:py-3.5 rounded-2xl border-2 border-sky-200 shadow-sm mb-6 md:mb-8">
              📅 [W03] 2026/09/14 (一)
            </div>

            <!-- 3. Category Tags -->
            <div id="cover-categories" class="flex flex-wrap justify-center gap-3 md:gap-3.5 max-w-xl">
              <span class="px-4 md:px-5 py-2 md:py-2.5 rounded-xl bg-teal-50 text-teal-700 text-base md:text-xl font-bold border border-teal-200 shadow-sm">
                🏷️ 方位與空間 (5字)
              </span>
              <span class="px-4 md:px-5 py-2 md:py-2.5 rounded-xl bg-amber-50 text-amber-700 text-base md:text-xl font-bold border border-amber-200 shadow-sm">
                🏷️ 日常用品 (5字)
              </span>
            </div>

          </div>
        </section>

      </div>

      <!-- Bottom Control Bar (Compact & Anti-Overflow Design) -->
      <footer class="w-full px-3 md:px-8 py-2 md:py-3 bg-white/95 border-t border-sky-100 flex flex-col gap-1.5 md:gap-2 z-20 shrink-0">
        <!-- Progress bar line -->
        <div class="w-full bg-slate-100 h-1.5 md:h-2 rounded-full overflow-hidden border border-slate-200">
          <div id="progress-bar-fill" class="bg-gradient-to-r from-sky-500 to-orange-400 h-full w-0 transition-all duration-300"></div>
        </div>

        <div class="flex items-center justify-between gap-1 sm:gap-2">
          <!-- Left: Prev & Pronounce Button -->
          <div class="flex items-center gap-1 sm:gap-2">
            <button id="prev-btn" onclick="prevSlide()" class="flex items-center gap-1 px-2.5 sm:px-4 py-1.5 sm:py-2 rounded-xl bg-sky-100 hover:bg-sky-200 active:bg-sky-300 text-sky-900 font-bold text-xs sm:text-sm transition shadow-sm disabled:opacity-40 disabled:cursor-not-allowed">
              <i data-lucide="chevron-left" class="w-4 h-4"></i>
              <span class="hidden sm:inline">上一頁</span>
            </button>
            <button id="read-current-btn" onclick="speakCurrentWord()" class="flex items-center gap-1 px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl bg-orange-100 hover:bg-orange-200 active:bg-orange-300 text-orange-900 font-bold text-xs sm:text-sm transition shadow-sm" title="朗讀此頁單字">
              <i data-lucide="volume-2" class="w-4 h-4 text-orange-600"></i>
              <span class="hidden sm:inline">朗讀</span>
            </button>
          </div>

          <!-- Middle: Direct Jump Dropdown & Counter -->
          <div class="flex items-center gap-1.5 sm:gap-3">
            <span id="slide-indicator" class="text-xs sm:text-sm font-bold text-slate-600 shrink-0">1 / 10</span>
            <div class="relative">
              <select id="slide-selector" onchange="goToSlide(parseInt(this.value))" class="appearance-none bg-slate-50 border border-slate-300 hover:border-sky-400 text-slate-700 text-xs sm:text-xs font-bold rounded-lg pl-2 sm:pl-3 pr-6 sm:pr-8 py-1 sm:py-1.5 focus:outline-none focus:ring-2 focus:ring-sky-500 max-w-[130px] sm:max-w-[220px] truncate">
                <!-- Populated dynamically via JS -->
              </select>
              <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-slate-500 absolute right-1.5 sm:right-2.5 top-2 sm:top-2 pointer-events-none"></i>
            </div>
          </div>

          <!-- Right: Next Button & Fullscreen Button -->
          <div class="flex items-center gap-1 sm:gap-2">
            <button id="next-btn" onclick="nextSlide()" class="flex items-center gap-1 px-3 sm:px-5 py-1.5 sm:py-2 rounded-xl bg-sky-600 hover:bg-sky-700 active:bg-sky-800 text-white font-bold text-xs sm:text-sm transition shadow-md disabled:opacity-40 disabled:cursor-not-allowed">
              <span>下一頁</span>
              <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </button>
            <button id="fullscreen-btn" onclick="toggleFullScreen()" class="p-1.5 sm:p-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 transition shadow-sm" title="全螢幕切換 (快速鍵: F)">
              <i id="fullscreen-icon" data-lucide="maximize" class="w-4 h-4"></i>
            </button>
          </div>
        </div>
      </footer>

    </main>
  </div>

  <script>
    // 1. Vocabulary Dataset for [W03] 2026/09/14 (一)
    const rawWords = [
      { week: 3, day: 1, word: "on", zh: "在…上面", pos: "prep. | adv.", category: "方位與空間", collocations: "on time (準時) / put on (穿上)", sentence: "The English textbook is on the teacher's desk.", sentenceZh: "英文課本在老師的桌上。" },
      { week: 3, day: 1, word: "at", zh: "在", pos: "prep.", category: "方位與空間", collocations: "at school (在學校) / at night (在夜間)", sentence: "We will meet at the entrance of the museum at nine.", sentenceZh: "我們九點在博物館門口集合。" },
      { week: 3, day: 1, word: "by", zh: "旁邊", pos: "prep. | adv.", category: "方位與空間", collocations: "by the way (順帶一提) / stand by (支持；在旁守候)", sentence: "Come and sit by the window with me.", sentenceZh: "過來和我一起坐在窗邊吧。" },
      { week: 3, day: 1, word: "umbrella", zh: "雨傘", pos: "n.", category: "日常用品", collocations: "open an umbrella (撐開雨傘) / take an umbrella (帶雨傘)", sentence: "Don't forget to take an umbrella with you because it might rain.", sentenceZh: "別忘了帶把傘，因為可能會下雨。" },
      { week: 3, day: 1, word: "notebook", zh: "筆記本", pos: "n.", category: "日常用品", collocations: "open a notebook (打開筆記本) / notebook computer (筆記型電腦)", sentence: "I wrote down all the important grammar rules in my notebook.", sentenceZh: "我把所有重要的文法規則都寫在筆記本上了。" },
      { week: 3, day: 1, word: "pipe", zh: "管子", pos: "n. | v. 輸送", category: "日常用品", collocations: "water pipe (水管) / smoke a pipe (抽菸斗)", sentence: "Water is leaking from the broken kitchen pipe.", sentenceZh: "水正從廚房破損的水管中漏出來。" },
      { week: 3, day: 1, word: "pot", zh: "鍋子", pos: "n. | v. 盆栽", category: "日常用品", collocations: "hot pot (火鍋) / flower pot (花盆)", sentence: "Mom is boiling some delicious chicken soup in the big pot.", sentenceZh: "媽媽正在大鍋裡煮美味的雞湯。" },
      { week: 3, day: 1, word: "price", zh: "價格", pos: "n. | v. 定價", category: "日常用品", collocations: "high price (高價) / price tag (價格標籤)", sentence: "The price of vegetables increased a lot after the typhoon.", sentenceZh: "颱風過後蔬菜的價格上漲了許多。" },
      { week: 3, day: 1, word: "straight", zh: "直的", pos: "adj. | adv. 直直地", category: "方位與空間", collocations: "straight line (直線) / go straight (直走)", sentence: "Go straight down this road and turn left at the corner.", sentenceZh: "沿著這條路直走，並在轉角處左轉。" },
      { week: 3, day: 1, word: "direction", zh: "方向;說明", pos: "n.", category: "方位與空間", collocations: "follow directions (遵從指示/方向) / right direction (正確的方向)", sentence: "We asked the police officer for directions to the station.", sentenceZh: "我們向警察詢問去車站的方向。" }
    ];

    // 2. Supplementary Focus Data (國中重點補充資料庫)
    const supplementaryData = {
      "on": {
        forms: "介系詞 (在…上面；在…特定日子；關於)；副詞 (開著；向前/繼續)；相反詞：off (關閉/脫離)",
        grammar: "時間用法：接特定日期、星期、節日當天 (on Monday, on September 14, on Christmas Day)；空間用法：物體表面接觸。",
        phrases: "on time (準時) / put on (穿上) / turn on (打開電器) / on sale (特價中) / on foot (步行)",
        examPoint: "會考最高頻介系詞辨析：in (月份/年份) vs. on (特定日期/星期) vs. at (具體幾點幾分)；以及 on time (準時) vs. in time (及時)。"
      },
      "at": {
        forms: "介系詞 (在…地點/小地方；在…特定時刻/年齡)",
        grammar: "時間用法：接特定時刻 (at 9:00, at noon, at night)；空間用法：接具體門牌、小地點或特定活動場所 (at the bus stop, at school)。",
        phrases: "at school (在學校) / at home (在家) / at night (在夜間) / look at (看著) / be good at (擅長於)",
        examPoint: "會考常考片語：be good at + V-ing (擅長做…)；介系詞辨析：in the morning / afternoon 但夜間固定用「at night」！"
      },
      "by": {
        forms: "介系詞 (在…旁邊；搭乘…交通工具；被…；在…之前)；副詞 (經過)；同義詞：beside, next to",
        grammar: "交通工具用法：by + 交通工具單數 (不加冠詞或所有格，如 by bus, by train)；若有冠詞則用 on / in (on the bus, in a car)。",
        phrases: "by the way (順帶一提) / by hand (純手工) / by mistake (無意中/錯誤地) / stand by (待命/支持某人)",
        examPoint: "交通工具考點必考：by bike = on a bike；by car = in a car。作空間介系詞時「by the window」等同於「beside / next to the window」。"
      },
      "umbrella": {
        forms: "名詞複數 umbrellas；母音開頭單數冠詞固定用「an」(an umbrella)",
        grammar: "可數名詞；搭配動詞：open an umbrella (撐傘), close an umbrella (收傘), take / bring an umbrella (帶傘)。",
        phrases: "under an umbrella (在傘下) / folding umbrella (折疊傘) / keep sth for a rainy day (未雨綢繆)",
        examPoint: "冠詞考點陷阱：開頭母音發 /ʌ/，因此「一把傘」是 an umbrella，絕不可寫 a umbrella。"
      },
      "notebook": {
        forms: "名詞複數 notebooks；複合名詞：note (筆記) + book (書本)",
        grammar: "可數名詞；作「筆記型電腦」時常稱 notebook 或 notebook computer (口語中亦常稱 laptop)。",
        phrases: "spiral notebook (線圈筆記本) / notebook computer (筆記型電腦) / write down in a notebook (寫在筆記本上)",
        examPoint: "搭配介系詞：write down in a notebook (寫在筆記本「裡」，用介系詞 in)；注意可數名詞單數需加冠詞 a notebook。"
      },
      "pipe": {
        forms: "名詞複數 pipes；動詞 pipe (用管道輸送；吹笛，三態 piped - piped)",
        grammar: "可數名詞，指輸送水、氣體的「水管/管子」，亦可指抽菸用的「菸斗」。",
        phrases: "water pipe (水管) / gas pipe (瓦斯管) / smoke a pipe (抽菸斗) / pipeline (管道/管線)",
        examPoint: "生活英語閱讀常考：water pipe burst (水管爆裂)；The pipe is leaking. (水管正在漏水)。"
      },
      "pot": {
        forms: "名詞複數 pots；動詞 pot (把…栽入盆中，重複 t 加 ed ➔ potted)",
        grammar: "可數名詞，指煮湯燉菜的「鍋子、深鍋」或種植物的「花盆 (flower pot)」。",
        phrases: "hot pot (火鍋) / flower pot (花盆) / a pot of tea (一壺茶) / melting pot (文化大熔爐)",
        examPoint: "生活情境對話：eat hot pot (吃火鍋)；量詞用法 a pot of soup (一鍋湯)，複數為 two pots of soup。"
      },
      "price": {
        forms: "名詞複數 prices；動詞 price (為…定價，priced)；形容詞 priceless (無價的；極珍貴的)",
        grammar: "可數名詞；形容價格高低只能用「high (高)」或「low (低)」，【絕對不可用 expensive 或 cheap】！",
        phrases: "price tag (標價標籤) / at a high/low price (以高價/低價) / half price (半價) / pay the price (付出代價)",
        examPoint: "會考最高頻字詞搭配陷阱：The price is high. (價格很高，正確)；不可說 The price is expensive. (錯誤)！"
      },
      "straight": {
        forms: "形容詞 (直的；筆直的)；副詞 (直直地；直接地)；形副同形；相反詞：crooked (彎曲的) / curly (捲曲的)",
        grammar: "形容詞與副詞同形，絕無 straightly 這個字！修飾動詞直接用 straight (例：Go straight.)。",
        phrases: "go straight (直走) / straight line (直線) / straight hair (直髮) / think straight (清晰冷靜地思考)",
        examPoint: "會考問路與指引最高頻句型：Go straight for two blocks and turn right.；注意同形副詞考點 (不可加 ly)。"
      },
      "direction": {
        forms: "名詞複數 directions；動詞 direct (指示/導演)；形容詞 direct (直接的)；副詞 directly",
        grammar: "常以複數形式 directions 表示「指引、使用說明、方向指示」；單數表地理「方位/方向」。",
        phrases: "ask for directions (問路) / follow the directions (按照說明指示做) / in the right direction (朝著正確方向)",
        examPoint: "問路與生活對話高頻考點：ask sb for directions (向某人問路，習慣用複數 directions)；give directions (指路)。"
      }
    };

    // 3. Pronunciation Override Mapping (TTS Speech Correction)
    const pronunciationOverrides = {
      "I": "eye",
      "Mr.": "Mister",
      "Mrs.": "Missus",
      "Ms.": "Mizz",
      "Miss": "Miss",
      "sir": "sir",
      "MRT": "M R T",
      "USA": "U S A",
      "e.g.": "for example",
      "i.e.": "that is"
    };

    let currentSlideIndex = 0;
    const totalSlides = rawWords.length + 1; // +1 for Cover slide
    let autoSpeechEnabled = true;

    // DOM Elements
    const slidesContainer = document.getElementById('slides-container');
    const slideSelector = document.getElementById('slide-selector');
    const slideIndicator = document.getElementById('slide-indicator');
    const progressBarFill = document.getElementById('progress-bar-fill');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    function buildSlides() {
      // 1. Cover option in select
      const coverOpt = document.createElement('option');
      coverOpt.value = "0";
      coverOpt.textContent = "00. 封面 - 2026 一起背單字 (國中組)";
      slideSelector.appendChild(coverOpt);

      // 2. Generate each word slide
      rawWords.forEach((item, idx) => {
        const slideNum = idx + 1;
        const supp = supplementaryData[item.word] || {
          forms: "常規形態變化",
          grammar: "國中基礎核心必考單字。",
          phrases: item.collocations,
          examPoint: "注意單字拼寫與句子搭配用法。"
        };

        // Dropdown Option
        const opt = document.createElement('option');
        opt.value = slideNum.toString();
        opt.textContent = `${String(slideNum).padStart(2, '0')}. Day ${item.day} - ${item.word} (${item.zh})`;
        slideSelector.appendChild(opt);

        // Word Slide Element
        const slideEl = document.createElement('section');
        slideEl.className = "slide-view p-4 md:p-7 flex flex-col justify-between";
        slideEl.dataset.title = `${item.word} (${item.zh})`;
        slideEl.dataset.day = `Day ${item.day}`;
        slideEl.dataset.category = item.category;
        slideEl.dataset.word = item.word;

        slideEl.innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-12 gap-3 md:gap-5 h-full items-stretch mobile-deck-grid">
            
            <!-- LEFT COLUMN (Word Details: Title + Collocations + Sentence) -->
            <div class="md:col-span-7 flex flex-col justify-between gap-3 md:gap-0 md:h-[510px] mobile-card-fix">
              
              <!-- Word Title & POS Badge Row -->
              <div class="flex items-center justify-between bg-white/95 px-4 md:px-6 py-2.5 md:py-3.5 rounded-2xl border-2 border-sky-200 card-shadow shrink-0">
                <div class="flex items-baseline gap-2 md:gap-4 flex-wrap">
                  <span class="text-4xl sm:text-5xl md:text-[64px] font-black text-orange-600 tracking-tight leading-none drop-shadow-sm font-['Fredoka']">
                    ${item.word}
                  </span>
                  <div class="px-3 md:px-4 py-1 md:py-1.5 rounded-full bg-sky-100/90 text-sky-800 border border-sky-300 font-bold text-lg sm:text-xl md:text-[26px] shadow-sm flex items-center gap-1.5">
                    <span class="text-sky-950 font-bold">${item.zh}</span>
                    <span class="text-sky-600 font-medium text-sm sm:text-base md:text-[22px] ml-1 bg-sky-200/60 px-2.5 py-0.5 rounded-md">${item.pos}</span>
                  </div>
                </div>
                <button onclick="speakText('${item.word}')" class="p-2 md:p-3 bg-orange-500 hover:bg-orange-600 active:scale-95 text-white rounded-2xl shadow-md transition-transform flex items-center justify-center shrink-0" title="朗讀單字 (TTS)">
                  <i data-lucide="volume-2" class="w-5 h-5 md:w-7 md:h-7"></i>
                </button>
              </div>

              <!-- Collocation Card (Fixed Desktop Height: 185px) -->

                    <h3 class="text-lg md:text-[24px] font-extrabold text-orange-950 tracking-tight">實用例句 (Example Sentence)</h3>

                  <button onclick="speakSentence('${item.sentence.replace(/'/g, "\\'")}')" class="text-orange-600 hover:text-orange-800 text-xs font-bold flex items-center gap-1 bg-orange-100/80 px-2 md:px-2.5 py-1 rounded-lg">
                    <i data-lucide="volume-1" class="w-3.5 h-3.5"></i>

            <!-- RIGHT COLUMN (Supplementary Panel: Desktop Width 440px, Height 510px) -->

              <!-- Header -->
              <div class="flex items-center gap-2 pb-2 border-b border-sky-200 shrink-0">

              <!-- Content items -->
              <div class="flex-1 overflow-y-auto pr-1 py-2 flex flex-col gap-2.5 md:gap-3 custom-scroll">
                
                <!-- Forms / Changes -->
                <div class="bg-sky-50/80 p-2.5 md:p-3 rounded-xl border border-sky-200">
                  <div class="text-base md:text-[25px] font-black text-sky-900 flex items-center gap-1.5 mb-1">
                    <span>🔹</span> <span>變化 / 格位 / 形態</span>

                <!-- Exam Focus Point -->
                <div class="bg-orange-50/80 p-2.5 md:p-3 rounded-xl border border-orange-200">

                <div class="bg-slate-50 p-2.5 md:p-3 rounded-xl border border-slate-200">

        slidesContainer.appendChild(slideEl);
      });

      // Render Lucide icons
      lucide.createIcons();

    function updateSlideUI() {
      const slides = document.querySelectorAll('.slide-view');
      slides.forEach((slide, idx) => {
        if (idx === currentSlideIndex) {
          slide.classList.add('active');
          if (window.innerWidth < 768) {
            slide.scrollTop = 0; // Scroll back to top on mobile slide switch
          }
        } else {
          slide.classList.remove('active');
        }
      });

      slideSelector.value = currentSlideIndex.toString();
      slideIndicator.textContent = `${currentSlideIndex} / ${totalSlides - 1}`;
      if (currentSlideIndex === 0) {
        slideIndicator.textContent = `封面 / ${totalSlides - 1}`;
      }

      const progressPercent = (currentSlideIndex / (totalSlides - 1)) * 100;
      progressBarFill.style.width = `${progressPercent}%`;

      prevBtn.disabled = currentSlideIndex === 0;
      nextBtn.disabled = currentSlideIndex === totalSlides - 1;

      const currentSlide = slides[currentSlideIndex];

      if (autoSpeechEnabled && currentSlideIndex > 0) {
        const wordToSpeak = currentSlide.dataset.word;
        if (wordToSpeak) {
          speakText(wordToSpeak);
        }
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < totalSlides) {
        currentSlideIndex = index;
        updateSlideUI();
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        goToSlide(currentSlideIndex - 1);
      }
    }

    function nextSlide() {
      if (currentSlideIndex < totalSlides - 1) {
        goToSlide(currentSlideIndex + 1);
      }
    }

    function getPhoneticCorrectedText(text) {
      const trimmed = text.trim();
      if (pronunciationOverrides[trimmed]) {
        return pronunciationOverrides[trimmed];
      }
      return text;
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const correctedText = getPhoneticCorrectedText(text);
      const utterance = new SpeechSynthesisUtterance(correctedText);
      utterance.lang = 'en-US';
      utterance.rate = 0.88;
      utterance.pitch = 1.0;

      const voices = window.speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.startsWith('en-US') || v.lang.startsWith('en'));
      if (enVoice) {
        utterance.voice = enVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    function speakSentence(sentence) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(sentence);
      utterance.lang = 'en-US';
      utterance.rate = 0.92;
      window.speechSynthesis.speak(utterance);
    }

    function speakCurrentWord() {
      if (currentSlideIndex === 0) {
        speakSentence("Welcome to English vocabulary practice!");
        return;
      }
      const currentSlide = document.querySelectorAll('.slide-view')[currentSlideIndex];
      if (currentSlide && currentSlide.dataset.word) {
        speakText(currentSlide.dataset.word);
      }
    }

    function fitPresentationStage() {
      const stage = document.getElementById('presentation-stage');
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      // For Mobile Portrait (< 768px), disable transform scaling and use vertical responsive flow
      if (windowWidth < 768) {
        stage.style.transform = 'none';
        return;
      }

      const baseWidth = 1200;
      const baseHeight = 675;

      const scaleX = (windowWidth * 0.96) / baseWidth;
      const scaleY = (windowHeight * 0.96) / baseHeight;
      const scale = Math.min(scaleX, scaleY, 1.15);

      stage.style.transform = `scale(${scale})`;
    }

    function toggleFullScreen() {
      const doc = window.document;
      const docEl = doc.documentElement;

      const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (requestFullScreen) {
          requestFullScreen.call(docEl);
        }
      } else {
        if (cancelFullScreen) {
          cancelFullScreen.call(doc);
        }
      }
    }

    function updateFullscreenIcon() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      const btn = document.getElementById('fullscreen-btn');
      if (!btn) return;
      
      btn.innerHTML = isFullscreen 
        ? `<i data-lucide="minimize" class="w-4 h-4"></i>` 
        : `<i data-lucide="maximize" class="w-4 h-4"></i>`;
      lucide.createIcons();
    }

    function initInteractions() {
      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          prevSlide();
        } else if (e.key === 'Home') {
          e.preventDefault();
          goToSlide(0);
        } else if (e.key === 'End') {
          e.preventDefault();
          goToSlide(totalSlides - 1);
        } else if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          toggleFullScreen();
        }
      });

      // Fullscreen change events
      ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(ev => {
        document.addEventListener(ev, () => {
          updateFullscreenIcon();
          setTimeout(fitPresentationStage, 100);
        });
      });

      // Touch swipe gestures
      let touchStartX = 0;
      let touchStartY = 0;
      const stage = document.getElementById('presentation-stage');

      stage.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      stage.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        // Horizontal swipe detection (more significant horizontal displacement than vertical)
        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 45) {
          if (diffX < 0) {
            nextSlide();
          } else {
            prevSlide();
          }
        }
      }, { passive: true });

      window.addEventListener('resize', fitPresentationStage);
      window.addEventListener('orientationchange', () => {
        setTimeout(fitPresentationStage, 200);
      });
    }

    window.onload = function() {
      buildSlides();
      fitPresentationStage();
      initInteractions();
      updateSlideUI();

      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }
    };
  </script>
