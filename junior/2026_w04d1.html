            let fixed = text;
            for (let key in speechFixes) {
                let regex = new RegExp('\\b' + key + '\\b', 'g');
                fixed = fixed.replace(regex, speechFixes[key]);
            }
            return fixed;
        }

        // --- 核心朗讀 TTS 函式 ---
        function speakText(text) {
            if (!text) return;
            const cleanText = applySpeechFixes(text);

                audioCache[cacheKey].currentTime = 0;
                audioCache[cacheKey].play().catch(e => console.log("Audio play error:", e));
                return;

            audioCache[cacheKey] = audio;
            audio.play().catch(e => console.log("Audio play error:", e));
        }

        // --- 導航控制函式 ---
        function nextSlide() {
            if (currentSlideIndex < slidesData.length - 1) {
                currentSlideIndex++;
                renderSlide();
            }
        }

        function prevSlide() {
            if (currentSlideIndex > 0) {
                currentSlideIndex--;
                renderSlide();
            }
        }

        function goToSlide(index) {
            if (index >= 0 && index < slidesData.length) {
                currentSlideIndex = index;
                renderSlide();
            }
        }

        // --- 縮放計算 (fitPresentationStage) ---
        function fitPresentationStage() {
            if (window.innerWidth < 768) return; // 手機直向不進行縮放
            const container = document.getElementById('presentation-container');
            const targetWidth = 1200;
            const targetHeight = 675;
            
            const scaleX = window.innerWidth / targetWidth;
            const scaleY = window.innerHeight / targetHeight;
            let scale = Math.min(scaleX, scaleY) * 0.92; // 留點邊距
            if (scale > 1) scale = 1;

            container.style.transform = `scale(${scale})`;
            container.style.transformOrigin = 'center center';
        }

        // --- 全螢幕切換 ---
        function toggleFullscreen() {
            const icon = document.getElementById('fullscreen-icon');
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Error attempting to enable fullscreen:", err);
                });
                icon.setAttribute('data-lucide', 'minimize');
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                icon.setAttribute('data-lucide', 'maximize');
            }
            lucide.createIcons();
        }

        // --- 鍵盤與觸控事件監聽 ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                nextSlide();
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                prevSlide();
            } else if (e.key === 'f' || e.key === 'F') {
                toggleFullscreen();
            }
        });

        // 觸控滑動支援 (Touch Swipe)
        let touchStartX = 0;
        let touchEndX = 0;

        document.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, false);

        document.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, false);

        function handleSwipe() {
            if (window.innerWidth >= 768) return; // 桌機模式不需要觸控滑動換頁
            const threshold = 50;
            if (touchEndX < touchStartX - threshold) {
                nextSlide();
            }
            if (touchEndX > touchStartX + threshold) {
                prevSlide();
            }
        }

        window.addEventListener('resize', fitPresentationStage);

        // 初始化執行
        window.onload = () => {
            initSlideSelect();
            renderSlide();
            fitPresentationStage();
        };
    </script>
