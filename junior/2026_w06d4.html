      let processed = text;
      Object.keys(pronunciationOverrides).forEach(key => {
        const escapedKey = key.replace(/\./g, '\\.');
        const regex = new RegExp(`\\b${escapedKey}\\b`, 'g');
        processed = processed.replace(regex, pronunciationOverrides[key]);
      });
      return processed;
    }

    // iOS & Desktop Voice Selection Priority Filter
    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      availableVoices = window.speechSynthesis.getVoices();
      if (!availableVoices || availableVoices.length === 0) return;

      // 1. 優先尋找 iOS 的 Samantha / Ava 高品質版本（Enhanced 或 Premium）
      const enhancedAppleVoice = availableVoices.find(v => 
        v.lang.startsWith("en") && 
        (v.name.toLowerCase().includes("samantha") || v.name.toLowerCase().includes("ava")) &&
        (v.name.toLowerCase().includes("enhanced") || v.name.toLowerCase().includes("premium"))
      );

      // 2. 尋找 Google US English
      const googleVoice = availableVoices.find(v => 
        v.name.includes("Google") && (v.name.includes("US English") || v.lang === "en-US")
      );

      // 3. 尋找一般 Samantha / Ava（避開 Compact 機械音）
      const normalAppleVoice = availableVoices.find(v => 
        v.lang.startsWith("en") && 
        (v.name.toLowerCase().includes("samantha") || v.name.toLowerCase().includes("ava")) &&
        !v.name.toLowerCase().includes("compact")
      );

      // 4. 次選其他 en-US 語音
      const anyUSVoice = availableVoices.find(v => v.lang === "en-US");

      // 判定最終採用的語音
      selectedPreferredVoice = enhancedAppleVoice || googleVoice || normalAppleVoice || anyUSVoice || availableVoices[0] || null;
      if (selectedPreferredVoice) {
        console.log("當前使用的語音：", selectedPreferredVoice.name);
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = initVoices;
    }

    // Web Speech API speak function using selected preferred voice
    function speakText(text) {
      return new Promise((resolve) => {
        if (!('speechSynthesis' in window)) {
          resolve();
          return;
        }

        window.speechSynthesis.cancel(); // Cancel any ongoing speech

        const cleanText = applySpeechFixes(text).trim();
        if (!cleanText) {
          resolve();
          return;
        }

        const utterance = new SpeechSynthesisUtterance(cleanText);
        if (selectedPreferredVoice) {
          utterance.voice = selectedPreferredVoice;
        }
        utterance.lang = 'en-US';
        utterance.rate = 0.92;

        utterance.onend = () => { resolve(); };
        utterance.onerror = () => { resolve(); };

        window.speechSynthesis.speak(utterance);
      });
    }

    function speakSentence(sentence) {
      speakText(sentence);
    }

    async function playWordAndSentenceSequence(word, sentence) {
      await speakText(word);
      await new Promise(r => setTimeout(r, 450));
      await speakText(sentence);
    }

    function speakCurrentWord() {
      if (currentSlideIndex === 0) {
        speakText("Welcome to English vocabulary practice!");
        return;
      }
      const currentSlide = document.querySelectorAll('.slide-view')[currentSlideIndex];
      if (currentSlide) {
        const word = currentSlide.dataset.word;
        const sentence = currentSlide.dataset.sentence;
        if (word && sentence) {
          playWordAndSentenceSequence(word, sentence);
        } else if (word) {
          speakText(word);
        }
      }
    }

              <!-- Header -->
              <div class="flex items-center gap-2 pb-2 border-b border-sky-200 shrink-0">

      // Render Lucide icons
      lucide.createIcons();

    function updateSlideUI() {
      const slides = document.querySelectorAll('.slide-view');
      slides.forEach((slide, idx) => {
        if (idx === currentSlideIndex) {
          slide.classList.add('active');
          if (window.innerWidth < 768) {
            slide.scrollTop = 0; // Reset scroll on mobile
          }
        } else {
          slide.classList.remove('active');
        }
      });

      slideSelector.value = currentSlideIndex.toString();
      slideIndicator.textContent = `${currentSlideIndex} / ${totalSlides - 1}`;
      if (currentSlideIndex === 0) {
        slideIndicator.textContent = `封面 / ${totalSlides - 1}`;
      }

      const progressPercent = (currentSlideIndex / (totalSlides - 1)) * 100;
      progressBarFill.style.width = `${progressPercent}%`;

      prevBtn.disabled = currentSlideIndex === 0;
      nextBtn.disabled = currentSlideIndex === totalSlides - 1;

      const currentSlide = slides[currentSlideIndex];

      if (autoSpeechEnabled && currentSlideIndex > 0) {
        const wordToSpeak = currentSlide.dataset.word;
        const sentenceToSpeak = currentSlide.dataset.sentence;
        if (wordToSpeak && sentenceToSpeak) {
          playWordAndSentenceSequence(wordToSpeak, sentenceToSpeak);
        } else if (wordToSpeak) {
          speakText(wordToSpeak);
        }
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < totalSlides) {
        currentSlideIndex = index;
        updateSlideUI();
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        goToSlide(currentSlideIndex - 1);
      }
    }

    function nextSlide() {
      if (currentSlideIndex < totalSlides - 1) {
        goToSlide(currentSlideIndex + 1);
      }
    }

    function fitPresentationStage() {
      const stage = document.getElementById('presentation-stage');
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      // Disable transform scale for mobile portrait (< 768px)
      if (windowWidth < 768) {
        stage.style.transform = 'none';
        return;
      }

      const baseWidth = 1200;
      const baseHeight = 675;

      const scaleX = (windowWidth * 0.96) / baseWidth;
      const scaleY = (windowHeight * 0.96) / baseHeight;
      const scale = Math.min(scaleX, scaleY, 1.15);

      stage.style.transform = `scale(${scale})`;
    }

    function toggleFullScreen() {
      const doc = window.document;
      const docEl = doc.documentElement;

      const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (requestFullScreen) {
          requestFullScreen.call(docEl);
        }
      } else {
        if (cancelFullScreen) {
          cancelFullScreen.call(doc);
        }
      }
    }

    function updateFullscreenIcon() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      const btn = document.getElementById('fullscreen-btn');
      if (!btn) return;
      
      btn.innerHTML = isFullscreen 
        ? `<i data-lucide="minimize" class="w-4 h-4"></i>` 
        : `<i data-lucide="maximize" class="w-4 h-4"></i>`;
      lucide.createIcons();
    }

    function initInteractions() {
      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          prevSlide();
        } else if (e.key === 'Home') {
          e.preventDefault();
          goToSlide(0);
        } else if (e.key === 'End') {
          e.preventDefault();
          goToSlide(totalSlides - 1);
        } else if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          toggleFullScreen();
        }
      });

      // Fullscreen change events
      ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(ev => {
        document.addEventListener(ev, () => {
          updateFullscreenIcon();
          setTimeout(fitPresentationStage, 100);
        });
      });

      // Touch swipe gestures
      let touchStartX = 0;
      let touchStartY = 0;
      const stage = document.getElementById('presentation-stage');

      stage.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      stage.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        // Horizontal swipe detection
        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 45) {
          if (diffX < 0) {
            nextSlide();
          } else {
            prevSlide();
          }
        }
      }, { passive: true });

      window.addEventListener('resize', fitPresentationStage);
      window.addEventListener('orientationchange', () => {
        setTimeout(fitPresentationStage, 200);
      });
    }

    window.onload = function() {
      initVoices();
      buildSlides();
      fitPresentationStage();
      initInteractions();
      updateSlideUI();
    };
  </script>
