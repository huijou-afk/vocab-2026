    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    function applySpeechFixes(text) {
      if (!text) return "";
      let processed = text;
      Object.keys(pronunciationOverrides).forEach(key => {
        const escapedKey = key.replace(/\./g, '\\.');
        const regex = new RegExp(`\\b${escapedKey}\\b`, 'g');
        processed = processed.replace(regex, pronunciationOverrides[key]);
      });
      return processed;
    }

    // iOS & Desktop Voice Selection Priority Filter
    function initVoices() {
      if (!('speechSynthesis' in window)) return;
      availableVoices = window.speechSynthesis.getVoices();
      if (!availableVoices || availableVoices.length === 0) return;

      // 1. 優先尋找 iOS 的 Samantha / Ava 高品質版本（Enhanced 或 Premium）
      const enhancedAppleVoice = availableVoices.find(v => 
        v.lang.startsWith("en") && 
        (v.name.toLowerCase().includes("samantha") || v.name.toLowerCase().includes("ava")) &&
        (v.name.toLowerCase().includes("enhanced") || v.name.toLowerCase().includes("premium"))
      );

      // 2. 尋找 Google US English
      const googleVoice = availableVoices.find(v => 
        v.name.includes("Google") && (v.name.includes("US English") || v.lang === "en-US")
      );

      // 3. 尋找一般 Samantha / Ava（避開 Compact 機械音）
      const normalAppleVoice = availableVoices.find(v => 
        v.lang.startsWith("en") && 
        (v.name.toLowerCase().includes("samantha") || v.name.toLowerCase().includes("ava")) &&
        !v.name.toLowerCase().includes("compact")
      );

      // 4. 次選其他 en-US 語音
      const anyUSVoice = availableVoices.find(v => v.lang === "en-US");

      // 判定最終採用的語音
      selectedPreferredVoice = enhancedAppleVoice || googleVoice || normalAppleVoice || anyUSVoice || availableVoices[0] || null;
      if (selectedPreferredVoice) {
        console.log("當前使用的語音：", selectedPreferredVoice.name);
      }
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = initVoices;
    }

    // Web Speech API speak function using selected preferred voice
    function speakText(text) {
      return new Promise((resolve) => {
        if (!('speechSynthesis' in window)) {
          resolve();
          return;
        }

        window.speechSynthesis.cancel(); // Cancel any ongoing speech

        const cleanText = applySpeechFixes(text).trim();
        if (!cleanText) {
          resolve();
          return;
        }

        const utterance = new SpeechSynthesisUtterance(cleanText);
        if (selectedPreferredVoice) {
          utterance.voice = selectedPreferredVoice;
        }
        utterance.lang = 'en-US';
        utterance.rate = 0.92;

        utterance.onend = () => { resolve(); };
        utterance.onerror = () => { resolve(); };

        window.speechSynthesis.speak(utterance);
      });
    }

    function speakSentence(sentence) {
      speakText(sentence);
    }

    async function playWordAndSentenceSequence(word, sentence) {
      await speakText(word);
      await new Promise(r => setTimeout(r, 450));
      await speakText(sentence);
    }

    function speakCurrentWord() {
      if (currentSlideIndex === 0) {
        speakText("Welcome to English vocabulary practice!");
        return;
      }
      const currentSlide = document.querySelectorAll('.slide-view')[currentSlideIndex];
      if (currentSlide) {
        const word = currentSlide.dataset.word;
        const sentence = currentSlide.dataset.sentence;
        if (word && sentence) {
          playWordAndSentenceSequence(word, sentence);
        } else if (word) {
          speakText(word);
        }
      }
    }

    function buildSlides() {

      slideSelector.appendChild(coverOpt);

      // 2. Generate each word slide
      rawWords.forEach((item, idx) => {
        const slideNum = idx + 1;

          grammar: "國中基礎核心必考單字。",

        // Dropdown Option
        const opt = document.createElement('option');

        const slideEl = document.createElement('section');

        slideEl.innerHTML = `

                  <span class="text-4xl sm:text-5xl md:text-[58px] font-black text-orange-600 tracking-tight leading-none drop-shadow-sm font-['Fredoka']">

                    <span class="text-sky-950 font-bold">${item.zh}</span>

                  </div>
                </div>
                <button onclick="speakText('${item.word}')" class="p-2 md:p-3 bg-orange-500 hover:bg-orange-600 active:scale-95 text-white rounded-2xl shadow-md transition-transform flex items-center justify-center shrink-0" title="朗讀單字 (Web Speech API)">
                  <i data-lucide="volume-2" class="w-5 h-5 md:w-7 md:h-7"></i>
                </button>
              </div>

              <!-- Collocation Card (Desktop Height: 185px) -->
              <div class="bg-gradient-to-br from-white to-sky-50/60 p-3 md:p-4 rounded-2xl border-2 border-sky-100 card-shadow flex flex-col justify-center md:h-[185px] shrink-0">
                <div class="flex items-center gap-2 mb-1.5 md:mb-2">
                  <span class="p-1 md:p-1.5 bg-sky-600 text-white rounded-lg flex items-center justify-center shadow-xs">
                    <i data-lucide="link-2" class="w-3.5 h-3.5 md:w-4 md:h-4"></i>
                  </span>
                  <h3 class="text-lg md:text-[24px] font-extrabold text-sky-900 tracking-tight">常用搭配詞 (Collocations)</h3>
                </div>
                <div class="text-base sm:text-lg md:text-[23px] font-semibold text-slate-700 bg-white/80 p-2.5 md:p-3 rounded-xl border border-sky-100 leading-snug">
                  ${item.collocations}
                </div>
              </div>

              <!-- Sentence Card (Desktop Height: 225px) -->
              <div class="bg-gradient-to-br from-white to-amber-50/40 p-3 md:p-4 rounded-2xl border-2 border-orange-100 card-shadow flex flex-col justify-center md:h-[225px] shrink-0">
                <div class="flex items-center justify-between mb-1.5 md:mb-2">
                  <div class="flex items-center gap-2">
                    <span class="p-1 md:p-1.5 bg-orange-500 text-white rounded-lg flex items-center justify-center shadow-xs">
                      <i data-lucide="message-square-quote" class="w-3.5 h-3.5 md:w-4 md:h-4"></i>
                    </span>
                    <h3 class="text-lg md:text-[24px] font-extrabold text-orange-950 tracking-tight">實用例句 (Example Sentence)</h3>
                  </div>
                  <button onclick="speakSentence('${item.sentence.replace(/'/g, "\\'")}')" class="text-orange-600 hover:text-orange-800 text-xs font-bold flex items-center gap-1 bg-orange-100/80 px-2 md:px-2.5 py-1 rounded-lg">
                    <i data-lucide="volume-1" class="w-3.5 h-3.5"></i>
                    <span>朗讀例句</span>
                  </button>
                </div>
                <div class="bg-white/80 p-2.5 md:p-3 rounded-xl border border-orange-100 flex flex-col gap-1 md:gap-1.5 justify-center flex-1">
                  <p class="text-base sm:text-lg md:text-[25px] font-bold text-slate-800 leading-snug tracking-normal">
                    ${item.sentence}
                  </p>
                  <p class="text-sm sm:text-base md:text-[23px] font-medium text-slate-600 leading-tight">
                    ${item.sentenceZh}
                  </p>
                </div>
              </div>

            </div>

            <!-- RIGHT COLUMN (Supplementary Panel: Desktop Width 440px, Height 510px) -->
            <div class="md:col-span-5 w-full md:h-[510px] bg-white rounded-2xl border-2 border-sky-300 card-shadow flex flex-col p-4 md:p-5 justify-between mobile-card-fix">
              
              <!-- Header -->
              <div class="flex items-center gap-2 pb-2 border-b border-sky-200 shrink-0">
                <span class="p-1 md:p-1.5 bg-sky-700 text-white rounded-lg">
                  <i data-lucide="graduation-cap" class="w-4 h-4 md:w-5 md:h-5"></i>
                </span>
                <h3 class="text-lg md:text-[25px] font-black text-sky-900 tracking-tight">國中重點補充 (Exam Focus)</h3>
              </div>

              <!-- Content items -->
              <div class="flex-1 overflow-y-auto pr-1 py-2 flex flex-col gap-2.5 md:gap-3 custom-scroll">
                
                <!-- Forms / Changes -->
                <div class="bg-sky-50/80 p-2.5 md:p-3 rounded-xl border border-sky-200">
                  <div class="text-base md:text-[25px] font-black text-sky-900 flex items-center gap-1.5 mb-1">
                    <span>🔹</span> <span>變化 / 格位 / 形態</span>
                  </div>
                  <div class="text-sm sm:text-base md:text-[23px] font-medium text-slate-700 leading-snug">
                    ${supp.forms}
                  </div>
                </div>

                <!-- Exam Focus Point -->
                <div class="bg-orange-50/80 p-2.5 md:p-3 rounded-xl border border-orange-200">
                  <div class="text-base md:text-[25px] font-black text-orange-950 flex items-center gap-1.5 mb-1">
                    <span>🎯</span> <span>會考常考要點</span>
                  </div>
                  <div class="text-sm sm:text-base md:text-[23px] font-medium text-slate-700 leading-snug">
                    ${supp.examPoint}
                  </div>
                </div>

                <!-- Useful Phrases & Grammar -->
                <div class="bg-slate-50 p-2.5 md:p-3 rounded-xl border border-slate-200">
                  <div class="text-base md:text-[25px] font-black text-slate-900 flex items-center gap-1.5 mb-1">
                    <span>💡</span> <span>常用片語與文法</span>
                  </div>
                  <div class="text-sm sm:text-base md:text-[23px] font-medium text-slate-700 leading-snug">
                    ${supp.phrases}
                  </div>
                  ${supp.grammar ? `<div class="text-xs sm:text-sm md:text-[21px] text-slate-500 mt-1 border-t border-slate-200 pt-1 leading-tight">${supp.grammar}</div>` : ''}

              </div>

              <!-- Footer Tag in Panel -->
              <div class="pt-2 border-t border-slate-100 flex justify-between items-center text-xs font-semibold text-slate-400 shrink-0">
                <span>單字編號：W05-D5-#${slideNum}</span>
                <span class="bg-sky-50 text-sky-600 px-2.5 py-0.5 rounded-full font-bold">會考必備單字</span>
              </div>

            </div>

          </div>
        `;
        slidesContainer.appendChild(slideEl);
      });

      // Render Lucide icons
      lucide.createIcons();
    }

    function updateSlideUI() {
      const slides = document.querySelectorAll('.slide-view');
      slides.forEach((slide, idx) => {
        if (idx === currentSlideIndex) {
          slide.classList.add('active');
          if (window.innerWidth < 768) {
            slide.scrollTop = 0; // Reset scroll on mobile
          }
        } else {
          slide.classList.remove('active');
        }
      });

      slideSelector.value = currentSlideIndex.toString();
      slideIndicator.textContent = `${currentSlideIndex} / ${totalSlides - 1}`;
      if (currentSlideIndex === 0) {
        slideIndicator.textContent = `封面 / ${totalSlides - 1}`;
      }

      const progressPercent = (currentSlideIndex / (totalSlides - 1)) * 100;
      progressBarFill.style.width = `${progressPercent}%`;

      prevBtn.disabled = currentSlideIndex === 0;
      nextBtn.disabled = currentSlideIndex === totalSlides - 1;

      const currentSlide = slides[currentSlideIndex];

      if (autoSpeechEnabled && currentSlideIndex > 0) {
        const wordToSpeak = currentSlide.dataset.word;
        const sentenceToSpeak = currentSlide.dataset.sentence;
        if (wordToSpeak && sentenceToSpeak) {
          playWordAndSentenceSequence(wordToSpeak, sentenceToSpeak);
        } else if (wordToSpeak) {
          speakText(wordToSpeak);
        }
      }
    }

    function goToSlide(index) {
      if (index >= 0 && index < totalSlides) {
        currentSlideIndex = index;
        updateSlideUI();
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        goToSlide(currentSlideIndex - 1);
      }
    }

    function nextSlide() {
      if (currentSlideIndex < totalSlides - 1) {
        goToSlide(currentSlideIndex + 1);
      }
    }

    function fitPresentationStage() {
      const stage = document.getElementById('presentation-stage');
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      // Disable transform scale for mobile portrait (< 768px)
      if (windowWidth < 768) {
        stage.style.transform = 'none';
        return;
      }

      const baseWidth = 1200;
      const baseHeight = 675;

      const scaleX = (windowWidth * 0.96) / baseWidth;
      const scaleY = (windowHeight * 0.96) / baseHeight;
      const scale = Math.min(scaleX, scaleY, 1.15);

      stage.style.transform = `scale(${scale})`;
    }

    function toggleFullScreen() {
      const doc = window.document;
      const docEl = doc.documentElement;

      const requestFullScreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
      const cancelFullScreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

      if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (requestFullScreen) {
          requestFullScreen.call(docEl);
        }
      } else {
        if (cancelFullScreen) {
          cancelFullScreen.call(doc);
        }
      }
    }

    function updateFullscreenIcon() {
      const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement;
      const btn = document.getElementById('fullscreen-btn');
      if (!btn) return;
      
      btn.innerHTML = isFullscreen 
        ? `<i data-lucide="minimize" class="w-4 h-4"></i>` 
        : `<i data-lucide="maximize" class="w-4 h-4"></i>`;
      lucide.createIcons();
    }

    function initInteractions() {
      // Keyboard shortcuts
      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
          e.preventDefault();
          nextSlide();
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault();
          prevSlide();
        } else if (e.key === 'Home') {
          e.preventDefault();
          goToSlide(0);
        } else if (e.key === 'End') {
          e.preventDefault();
          goToSlide(totalSlides - 1);
        } else if (e.key === 'f' || e.key === 'F') {
          e.preventDefault();
          toggleFullScreen();
        }
      });

      // Fullscreen change events
      ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'].forEach(ev => {
        document.addEventListener(ev, () => {
          updateFullscreenIcon();
          setTimeout(fitPresentationStage, 100);
        });
      });

      // Touch swipe gestures
      let touchStartX = 0;
      let touchStartY = 0;
      const stage = document.getElementById('presentation-stage');

      stage.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });

      stage.addEventListener('touchend', (e) => {
        const touchEndX = e.changedTouches[0].screenX;
        const touchEndY = e.changedTouches[0].screenY;
        const diffX = touchEndX - touchStartX;
        const diffY = touchEndY - touchStartY;

        // Horizontal swipe detection
        if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > 45) {
          if (diffX < 0) {
            nextSlide();
          } else {
            prevSlide();
          }
        }
      }, { passive: true });

      window.addEventListener('resize', fitPresentationStage);
      window.addEventListener('orientationchange', () => {
        setTimeout(fitPresentationStage, 200);
      });
    }

    window.onload = function() {
      initVoices();
      buildSlides();
      fitPresentationStage();
      initInteractions();
      updateSlideUI();
    };
  </script>
