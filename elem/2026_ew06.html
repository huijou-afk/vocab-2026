<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 一起背單字 (國小組) - W06</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cloudflare.com">
  <!-- Google Fonts: Fredoka & Noto Sans TC -->
  <link rel="preconnect" href="https://googleapis.com">
  <link rel="preconnect" href="https://gstatic.com" crossorigin>
  <link href="https://googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background-color: #fffdf7;
      color: #333333;
      user-select: none;
    }
    .fun-border {
      border: 4px solid #fde047;
      box-shadow: 0 6px 0 rgba(253, 224, 71, 0.3);
    }
    /* 在大螢幕 (電腦/平板) 限制 16:9 簡報舞台 */
    @media (min-width: 768px) {
      #presentation-stage {
        width: 1000px;
        height: 562px;
        position: relative;
        border: 4px solid #fde047;
        box-shadow: 0 8px 0 rgba(253, 224, 71, 0.4);
      }
    }
  </style>
</head>
<body class="overflow-x-hidden min-h-screen flex flex-col items-center justify-between p-3 md:p-6">

  <!-- 主體簡報舞台 (手機版滿版、電腦版固定簡報比例) -->
  <main class="w-full flex-1 flex items-center justify-center my-auto px-2 max-w-5xl">
    <div id="presentation-stage" class="w-full bg-gradient-to-b from-[#fffefb] to-[#fffde7] rounded-3xl p-6 md:p-12 flex flex-col items-center justify-center relative min-h-[400px] md:min-h-0 fun-border md:border-none md:shadow-none">
      
      <!-- 裝飾小圖示 (電腦版顯示，手機版隱藏避免擋字) -->
      <div class="hidden md:block absolute top-6 left-6 text-yellow-400 text-3xl animate-bounce"><i class="fa-solid fa-star"></i></div>
      <div class="hidden md:block absolute top-10 right-10 text-amber-300 text-2xl animate-pulse"><i class="fa-solid fa-cloud"></i></div>
      <div class="hidden md:block absolute bottom-8 left-12 text-yellow-300 text-3xl animate-pulse"><i class="fa-solid fa-sun"></i></div>
      
      <!-- 週別標籤 -->
      <div class="bg-yellow-100 text-amber-800 px-5 py-2 rounded-full font-bold text-base md:text-xl mb-6 shadow-sm border-2 border-yellow-300 flex items-center gap-2">
        <i class="fa-solid fa-calendar-days text-amber-500"></i> [W06]2026/10/05~10/12
      </div>
      
      <!-- 主標題 -->
      <h1 class="text-4xl md:text-5xl font-black text-amber-600 mb-6 text-center drop-shadow-md leading-tight">
        2026 一起背單字 <br class="block md:hidden"><span class="text-sky-500">(國小組)</span>
      </h1>
      
      <!-- 主題標籤分類 -->
      <div class="grid grid-cols-2 md:flex md:flex-wrap justify-center gap-3 max-w-2xl mb-8 md:mb-12 w-full px-4 md:px-0">
        <span class="bg-sky-100 text-sky-700 font-bold px-3 py-2 rounded-xl text-center md:text-lg border border-sky-200">交通旅遊</span>
        <span class="bg-emerald-100 text-emerald-700 font-bold px-3 py-2 rounded-xl text-center md:text-lg border border-emerald-200">城市探索</span>
        <span class="bg-amber-100 text-amber-700 font-bold px-3 py-2 rounded-xl text-center md:text-lg border border-amber-200">天氣氣象</span>
        <span class="bg-rose-100 text-rose-700 font-bold px-3 py-2 rounded-xl text-center md:text-lg border border-rose-200">服飾穿搭</span>
      </div>

      <!-- 開始按鈕 -->
      <button onclick="goToSlide(1)" class="w-full md:w-auto bg-amber-400 hover:bg-amber-500 text-white text-xl md:text-2xl font-bold px-8 py-3.5 rounded-2xl shadow-lg border-b-4 border-amber-600 active:translate-y-1 transition-all flex items-center justify-center gap-3">
        <i class="fa-solid fa-rocket"></i> 開始快樂背單字！
      </button>
    </div>
  </main>

  <!-- 底部緊湊抗破版控制列 -->
  <nav aria-label="簡報控制列" class="w-full max-w-5xl bg-white border-4 border-amber-200 rounded-2xl shadow-lg p-3 flex flex-col md:flex-row items-center justify-between gap-3 mt-4">
    
    <!-- 第一列：上/下一頁按鈕 -->
    <div class="flex items-center justify-between w-full md:w-auto gap-2">
      <button onclick="prevSlide()" class="flex-1 md:flex-none bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-4 py-2.5 rounded-xl border-2 border-amber-300 flex items-center justify-center gap-1.5 transition text-sm md:text-base">
        <i class="fa-solid fa-chevron-left"></i> 上一頁
      </button>
      <button onclick="nextSlide()" class="flex-1 md:flex-none bg-amber-400 hover:bg-amber-500 text-white font-bold px-5 py-2.5 rounded-xl border-b-4 border-amber-600 active:translate-y-0.5 flex items-center justify-center gap-1.5 transition text-sm md:text-base shadow-sm">
        下一頁 <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <!-- 第二列：頁碼選單與進度條 -->
    <div class="flex items-center gap-2 w-full md:flex-1 md:max-w-md mx-0 md:mx-4">
      <select id="jump-select" onchange="onSelectJump(this)" class="bg-yellow-50 border-2 border-yellow-300 text-amber-900 font-bold rounded-xl px-2 py-2 text-xs md:text-sm outline-none focus:border-amber-500 cursor-pointer max-w-[180px] md:max-w-none truncate">
        <option>封面：[W06]2026/10/05~10/12</option>
      </select>
      <div class="flex-1 bg-gray-100 h-3 rounded-full overflow-hidden border border-gray-200">
        <div id="progress-bar" class="bg-amber-400 h-full w-12 transition-all duration-300 rounded-full"></div>
      </div>
    </div>

    <!-- 第三列：音量與自動控制按鈕 -->
    <div class="flex items-center justify-center w-full md:w-auto gap-2">
      <button onclick="speakCurrentWord()" class="flex-1 md:flex-none bg-sky-100 hover:bg-sky-200 text-sky-700 font-bold px-4 py-2 rounded-xl border-2 border-sky-300 transition flex items-center justify-center gap-1.5 text-sm" title="朗讀目前單字">
        <i class="fa-solid fa-volume-high text-base"></i>
        <span>朗讀</span>
      </button>
      <button id="auto-read-btn" onclick="toggleAutoRead()" class="flex-1 md:flex-none bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-4 py-2 rounded-xl border-2 border-gray-300 transition flex items-center justify-center gap-1.5 text-sm" title="自動朗讀開關">
        <i id="auto-icon" class="fa-solid fa-play text-gray-500"></i>
        <span>自動朗讀</span>
      </button>
    </div>
  </nav>

  <script>
    // 預留原本的 JavaScript 函式外殼，確保您的核心邏輯不會報錯
    function goToSlide(n){}
    function prevSlide(){}
    function nextSlide(){}
    function onSelectJump(e){}
    function speakCurrentWord(){}
    function toggleAutoRead(){}
  </script>
</body>
</html>
