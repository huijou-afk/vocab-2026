<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 一起背單字 (國小組) - W06</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Fredoka & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background-color: #fffdf7;
      color: #333333;
      user-select: none;
    }
    .fun-border {
      border: 4px solid #fde047;
      box-shadow: 0 8px 0 rgba(253, 224, 71, 0.4);
    }
    .fun-card {
      background: #ffffff;
      border: 3px solid #fef08a;
      border-radius: 24px;
      box-shadow: 0 6px 0 rgba(254, 240, 138, 0.5);
    }
    
    /* 修正手機端的縮放容器排版 */
    #stage-wrapper {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    
    #presentation-stage {
      width: 1200px;
      height: 675px;
      position: relative;
      transform-origin: center center;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="overflow-x-hidden min-h-screen flex flex-col items-center justify-between p-2 md:p-4">

  <!-- 主體簡報舞台外層包裹（負責處理縮放後的空間剪裁） -->
  <main class="w-full flex-1 flex items-center justify-center relative my-auto">
    <div id="stage-wrapper">
      <div id="presentation-stage" class="transition-all duration-100">
        
        <!-- 封面頁 (Slide 0) -->
        <div id="slide-0" class="slide-pane absolute inset-0 flex flex-col items-center justify-center p-8 bg-gradient-to-b from-[#fffefb] to-[#fffde7] rounded-3xl fun-border">
          <div class="absolute top-6 left-6 text-yellow-400 text-3xl animate-bounce"><i class="fa-solid fa-star"></i></div>
          <div class="absolute top-10 right-10 text-amber-300 text-2xl animate-pulse"><i class="fa-solid fa-cloud"></i></div>
          <div class="absolute bottom-8 left-12 text-yellow-300 text-3xl animate-pulse"><i class="fa-solid fa-sun"></i></div>
          
          <div class="bg-yellow-100 text-amber-800 px-6 py-2 rounded-full font-bold text-xl mb-4 shadow-sm border-2 border-yellow-300 flex items-center gap-2">
            <i class="fa-solid fa-calendar-days text-amber-500"></i> [W06]2026/10/05~10/12
          </div>
          
          <h1 class="text-5xl md:text-6xl font-black text-amber-600 mb-6 text-center drop-shadow-md">
            2026 一起背單字 <span class="text-sky-500">(國小組)</span>
          </h1>
          
          <div class="flex flex-wrap justify-center gap-3 max-w-2xl mb-10">
            <span class="bg-sky-100 text-sky-700 font-bold px-4 py-1.5 rounded-full text-lg border border-sky-200">交通旅遊</span>
            <span class="bg-emerald-100 text-emerald-700 font-bold px-4 py-1.5 rounded-full text-lg border border-emerald-200">城市探索</span>
            <span class="bg-amber-100 text-amber-700 font-bold px-4 py-1.5 rounded-full text-lg border border-amber-200">天氣氣象</span>
            <span class="bg-rose-100 text-rose-700 font-bold px-4 py-1.5 rounded-full text-lg border border-rose-200">服飾穿搭</span>
          </div>

          <button onclick="goToSlide(1)" class="bg-amber-400 hover:bg-amber-500 text-white text-2xl font-bold px-10 py-4 rounded-2xl shadow-lg border-b-4 border-amber-600 active:translate-y-1 transition-all flex items-center gap-3">
            <i class="fa-solid fa-rocket"></i> 開始快樂背單字！
          </button>
        </div>

        <!-- 單字頁動態生成容器將透過 JS 組合 -->
        <div id="slides-container"></div>

      </div>
    </div>
  </main>

  <!-- 底部控制列 -->
  <nav aria-label="簡報控制列" class="w-full max-w-5xl bg-white border-4 border-amber-200 rounded-2xl shadow-lg px-4 py-3 flex flex-wrap items-center justify-between gap-3 mt-2z-10 relative">
    <!-- 導航按鈕群組 -->
    <div class="flex items-center gap-2">
      <button onclick="prevSlide()" class="bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold px-4 py-2 rounded-xl border-2 border-amber-300 flex items-center gap-1.5 transition text-sm md:text-base">
        <i class="fa-solid fa-chevron-left"></i> 上一頁
      </button>
      <button onclick="nextSlide()" class="bg-amber-400 hover:bg-amber-500 text-white font-bold px-5 py-2 rounded-xl border-b-4 border-amber-600 active:translate-y-0.5 flex items-center gap-1.5 transition text-sm md:text-base shadow-sm">
        下一頁 <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>

    <!-- 頁碼下拉選單與進度條 -->
    <div class="flex items-center gap-3 flex-1 min-w-[200px] mx-2">
      <select id="jump-select" onchange="onSelectJump(this)" class="bg-yellow-50 border-2 border-yellow-300 text-amber-900 font-bold rounded-xl px-3 py-1.5 text-sm outline-none focus:border-amber-500 cursor-pointer">
        <option>第 1 頁 / 封面</option>
      </select>
      <div class="flex-1 bg-gray-100 h-3 rounded-full overflow-hidden border border-gray-200">
        <div id="progress-bar" class="bg-amber-400 h-full w-0 transition-all duration-300 rounded-full"></div>
      </div>
    </div>

    <!-- 功能控制按鈕 -->
    <div class="flex items-center gap-2">
      <button onclick="speakCurrentWord()" class="bg-sky-100 hover:bg-sky-200 text-sky-700 font-bold p-2.5 rounded-xl border-2 border-sky-300 transition flex items-center gap-1.5 text-sm" title="朗讀目前單字">
        <i class="fa-solid fa-volume-high text-lg"></i>
        <span class="hidden sm:inline">朗讀</span>
      </button>
      <button id="auto-read-btn" onclick="toggleAutoRead()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold p-2.5 rounded-xl border-2 border-gray-300 transition flex items-center gap-1.5 text-sm" title="自動朗讀開關">
        <i id="auto-icon" class="fa-solid fa-play text-gray-500"></i>
        <span class="hidden sm:inline">自動朗讀</span>
      </button>
    </div>
  </nav>

  <!-- 關鍵修正：加入自動計算並等比例縮放舞台的 JS -->
  <script>
    function doScale() {
      const stage = document.getElementById('presentation-stage');
      const wrapper = document.getElementById('stage-wrapper');
      if (!stage || !wrapper) return;
      
      // 獲取目前外層容器可以使用的實際寬度
      const targetWidth = wrapper.offsetWidth;
      const baseWidth = 1200;
      const baseHeight = 675;
      
      // 如果螢幕寬度小於 1200px，計算縮放比例
      if (targetWidth < baseWidth) {
        const scale = targetWidth / baseWidth;
        stage.style.transform = `scale(${scale})`;
        // 同步修正外層包裹高度，避免等比例縮小後上下留出太多空白
        wrapper.style.height = `${baseHeight * scale}px`;
      } else {
        stage.style.transform = 'scale(1)';
        wrapper.style.height = `${baseHeight}px`;
      }
    }

    // 監聽視窗大小改變或手機翻轉
    window.addEventListener('resize', doScale);
    window.addEventListener('DOMContentLoaded', doScale);
    
    // 虛擬模擬原本技術函式的外殼避免噴 Error
    function goToSlide(n){}
    function prevSlide(){}
    function nextSlide(){}
    function onSelectJump(e){}
    function speakCurrentWord(){}
    function toggleAutoRead(){}
  </script>
</body>
</html>
