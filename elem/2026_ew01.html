    // Special Pronunciation Mapping
    const speechCorrections = {
      "I": "eye",
      "Mr.": "Mister",
      "Mrs.": "Missus",
      "MRT": "M R T",
      "USA": "U S A",
      "adj.": "adjective",
      "adv.": "adverb",
      "pron.": "pronoun",
      "n.": "noun",
      "v.": "verb"
    };

    let autoAudioEnabled = true;
    let currentIndex = 0; // 0 = Cover Slide, 1..20 = Words
    const totalSlides = wordList.length; // 20 words + 1 cover (0 to 20)

    function speakText(text, lang = 'en-US') {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel(); // stop previous speech

      // Apply correction mapping for exact word or tokens
      let correctedText = text;
      if (speechCorrections[text.trim()]) {
        correctedText = speechCorrections[text.trim()];
      }

      const utterance = new SpeechSynthesisUtterance(correctedText);
      utterance.lang = lang;
      utterance.rate = 0.88; // friendly kid pace
      utterance.pitch = 1.05; // slightly cheerful tone

      // Try selecting premium English voices if available
      const voices = window.speechSynthesis.getVoices();
      const engVoice = voices.find(v => (v.lang === 'en-US' || v.lang === 'en_US') && (v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('Google')));
      if (engVoice) {
        utterance.voice = engVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

  <script>
    const stageContainer = document.getElementById('stage-container');
    const presentationStage = document.getElementById('presentation-stage');
    const slideWrapper = document.getElementById('slide-wrapper');
    const slideSelect = document.getElementById('slide-select');
    const progressBar = document.getElementById('progress-bar');
    const progressText = document.getElementById('progress-text');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');
    const btnSpeakMain = document.getElementById('btn-speak-main');
    const btnAutoAudio = document.getElementById('btn-auto-audio');
    const autoAudioText = document.getElementById('auto-audio-text');
    const btnFullscreen = document.getElementById('btn-fullscreen');
    const fullscreenIcon = document.getElementById('fullscreen-icon');

    // 1. Populate Dropdown Select
    function populateDropdown() {
      slideSelect.innerHTML = '';
      
      // Cover option
      const coverOpt = document.createElement('option');
      coverOpt.value = '0';
      coverOpt.textContent = '🌟 封面：2026 一起背單字 (W01)';
      slideSelect.appendChild(coverOpt);

      // Word options
      wordList.forEach((item, idx) => {
        const opt = document.createElement('option');
        opt.value = String(idx + 1);
        opt.textContent = `${String(idx + 1).padStart(2, '0')}. ${item.word} (${item.chinese})`;
        slideSelect.appendChild(opt);
      });
    }

    // 2. Render Slide by Index
    function renderCurrentSlide() {
      if (currentIndex === 0) {
        slideWrapper.innerHTML = renderCoverSlide();
        btnSpeakMain.style.display = 'none';
      } else {
        const wordData = wordList[currentIndex - 1];
        slideWrapper.innerHTML = renderWordSlide(wordData, currentIndex);
        btnSpeakMain.style.display = 'flex';

        // Auto speak on slide change if enabled
        if (autoAudioEnabled) {
          setTimeout(() => {
            speakText(wordData.word);
          }, 200);
        }
      }

      // Update Controls
      slideSelect.value = String(currentIndex);
      const percent = Math.round(((currentIndex) / totalSlides) * 100);
      progressBar.style.width = `${Math.max(5, percent)}%`;
      progressText.textContent = `${currentIndex} / ${totalSlides}`;

      // Update Prev / Next button states
      btnPrev.disabled = (currentIndex === 0);
      btnPrev.style.opacity = (currentIndex === 0) ? '0.4' : '1';
      btnPrev.style.pointerEvents = (currentIndex === 0) ? 'none' : 'auto';

      if (currentIndex === totalSlides) {
        btnNext.innerHTML = `<i class="fa-solid fa-rotate-left"></i> <span class="hidden sm:inline">重新開始</span>`;
      } else {
        btnNext.innerHTML = `<span class="hidden sm:inline">下一頁</span> <i class="fa-solid fa-arrow-right"></i>`;
      }
    }

    // 3. Navigation Controls
    function goToSlide(index) {
      if (index < 0) index = 0;
      if (index > totalSlides) index = 0; // loop back to cover
      currentIndex = index;
      renderCurrentSlide();
    }

    function nextSlide() {
      goToSlide(currentIndex + 1);
    }

    function prevSlide() {
      if (currentIndex > 0) {
        goToSlide(currentIndex - 1);
      }
    }

    // 4. Responsive Stage Scale Calculation (fitPresentationStage)
    function fitPresentationStage() {
      if (window.innerWidth < 768) {
        // Mobile portrait mode: natural flow layout
        presentationStage.style.transform = 'none';
        return;
      }

      const baseWidth = 1200;
      const baseHeight = 675;
      const containerWidth = stageContainer.clientWidth - 32; // padding buffer
      const containerHeight = stageContainer.clientHeight - 20;

      const scaleX = containerWidth / baseWidth;
      const scaleY = containerHeight / baseHeight;
      const scale = Math.min(scaleX, scaleY, 1.15); // capped scale for crispness

      presentationStage.style.transform = `scale(${scale})`;
    }

    // 5. Fullscreen Toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        fullscreenIcon.className = 'fa-solid fa-compress text-lg';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
          fullscreenIcon.className = 'fa-solid fa-expand text-lg';
        }
      }
    }

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        fullscreenIcon.className = 'fa-solid fa-expand text-lg';
      } else {
        fullscreenIcon.className = 'fa-solid fa-compress text-lg';
      }
      setTimeout(fitPresentationStage, 100);
    });

    // 6. Touch Swipe Detection for Mobile
    let touchStartX = 0;
    let touchStartY = 0;
    let touchEndX = 0;
    let touchEndY = 0;

    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    document.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      touchEndY = e.changedTouches[0].screenY;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;
      // Ensure horizontal swipe is dominant and significant
      if (Math.abs(deltaX) > Math.abs(deltaY) && Math.abs(deltaX) > 45) {
        if (deltaX < 0) {
          nextSlide(); // Swipe Left -> Next
        } else {
          prevSlide(); // Swipe Right -> Prev
        }
      }
    }

    // 7. Keyboard Navigation
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      } else if (e.key === 's' || e.key === 'S') {
        if (currentIndex > 0) {
          speakText(wordList[currentIndex - 1].word);
        }
      }
    });

    // 8. Event Listeners Setup
    btnNext.addEventListener('click', nextSlide);
    btnPrev.addEventListener('click', prevSlide);
    btnFullscreen.addEventListener('click', toggleFullscreen);

    slideSelect.addEventListener('change', (e) => {
      goToSlide(parseInt(e.target.value, 10));
    });

    btnSpeakMain.addEventListener('click', () => {
      if (currentIndex > 0) {
        speakText(wordList[currentIndex - 1].word);
      }
    });

    btnAutoAudio.addEventListener('click', () => {
      autoAudioEnabled = !autoAudioEnabled;
      if (autoAudioEnabled) {
        autoAudioText.textContent = '自動朗讀: 開';
        btnAutoAudio.className = 'btn-3d bg-emerald-100 hover:bg-emerald-200 text-emerald-800 font-bold px-3 py-2 rounded-2xl flex items-center gap-1 border-2 border-emerald-300 shadow-[0_4px_0_#059669] text-xs md:text-sm cursor-pointer';
      } else {
        autoAudioText.textContent = '自動朗讀: 關';
        btnAutoAudio.className = 'btn-3d bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold px-3 py-2 rounded-2xl flex items-center gap-1 border-2 border-gray-300 shadow-[0_4px_0_#9CA3AF] text-xs md:text-sm cursor-pointer';
      }
    });

    window.addEventListener('resize', fitPresentationStage);
    window.addEventListener('orientationchange', () => {
      setTimeout(fitPresentationStage, 200);
    });

    window.addEventListener('DOMContentLoaded', () => {
      populateDropdown();
      renderCurrentSlide();
      fitPresentationStage();

      // Pre-warm Web Speech API
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }
    });
  </script>
