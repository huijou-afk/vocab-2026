    let currentIndex = 0; // 0 is Cover, 1~20 are words
    let autoSpeakEnabled = true;
    let synth = window.speechSynthesis;
    let isSpeaking = false;

    // Normalizing text for TTS
    function cleanPronunciationText(text) {
      let result = text;
      for (const [key, value] of Object.entries(pronunciationCorrection)) {
        const regex = new RegExp(`\\b${key}\\b`, 'gi');
        result = result.replace(regex, value);
      }
      return result;
    }

    // Pronounce text with browser SpeechSynthesis
    function speakText(text, onEndCallback) {
      if (!synth) return;
      synth.cancel();

      const cleaned = cleanPronunciationText(text);
      const utterance = new SpeechSynthesisUtterance(cleaned);
      utterance.lang = 'en-US';
      utterance.rate = 0.88; // friendly slightly slower pace for kids
      utterance.pitch = 1.05;

      const waves = document.querySelectorAll('.audio-wave');
      waves.forEach(w => w.classList.add('playing'));

      utterance.onend = () => {
        waves.forEach(w => w.classList.remove('playing'));
        if (onEndCallback) onEndCallback();
      };

      utterance.onerror = () => {
        waves.forEach(w => w.classList.remove('playing'));
      };

      synth.speak(utterance);
    }

    // Render the slide based on currentIndex
    function renderSlide() {
      const viewport = document.getElementById('slide-viewport');
      
      if (currentIndex === 0) {
        // Cover Slide
        viewport.innerHTML = `
          <div class="slide-enter w-full h-full bg-white rounded-3xl md:rounded-[36px] border-4 md:border-8 border-brand-yellow shadow-3d-yellow p-6 md:p-12 flex flex-col items-center justify-center text-center relative overflow-hidden">
            <!-- Decorative corner tags -->
            <div class="absolute top-6 left-6 flex items-center gap-2">
              <span class="bg-yellow-100 text-yellow-800 text-sm md:text-base font-black px-4 py-1.5 rounded-full border-2 border-yellow-400">
                <i class="fa-solid fa-sparkles text-amber-500 mr-1"></i>每週精選
              </span>
            </div>

            <!-- Big Title -->
            <div class="space-y-4 my-auto">
              <div class="inline-flex items-center justify-center p-3 bg-amber-100 text-amber-600 rounded-2xl mb-2">
                <i class="fa-solid fa-graduation-cap text-3xl md:text-5xl"></i>
              </div>
              <h1 class="text-3xl sm:text-5xl md:text-6xl font-black text-amber-950 tracking-wide font-fredoka">
                ${weekData.title}
              </h1>
              
              <!-- Subtitle: Strictly unmodified date format -->
              <div class="inline-block bg-amber-500 text-white font-extrabold text-xl sm:text-2xl md:text-3xl px-6 py-2.5 rounded-2xl shadow-[0_4px_0_#b45309] font-fredoka">
                ${weekData.dateTag}
              </div>

              <!-- Topic Category Capsule Badges (No slogans) -->
              <div class="pt-6 flex flex-wrap items-center justify-center gap-3 md:gap-4">
                ${weekData.categories.map(cat => `
                  <span class="bg-brand-skyLight text-brand-skyDark border-2 md:border-3 border-brand-sky text-lg md:text-2xl font-bold px-6 py-2.5 rounded-full shadow-sm">
                    <i class="fa-solid fa-tag text-sky-500 mr-2 text-base md:text-xl"></i>${cat}
                  </span>
                `).join('')}
              </div>
            </div>

            <!-- Start Reading CTA button -->
            <button onclick="goToNextSlide()" class="pulse-btn mt-auto bg-gradient-to-r from-amber-400 to-orange-400 hover:from-amber-500 hover:to-orange-500 text-amber-950 text-xl md:text-2xl font-black px-8 py-3.5 rounded-2xl border-3 border-amber-500 shadow-3d-yellow flex items-center gap-3 transition-transform">
              <span>開始學習單字卡</span>
              <i class="fa-solid fa-circle-play text-2xl text-amber-900"></i>
            </button>
          </div>
        `;
      } else {
        // Word Slide
        const wordObj = weekData.words[currentIndex - 1];
        const pageNumber = String(currentIndex).padStart(2, '0');
        const totalWords = String(weekData.words.length).padStart(2, '0');

        viewport.innerHTML = `
          <div class="slide-enter w-full h-full bg-white rounded-3xl md:rounded-[36px] border-4 md:border-8 border-brand-yellow shadow-3d-yellow p-5 md:p-8 flex flex-col justify-between relative overflow-hidden">
            
            <!-- Top Bar: Category Pill (20px) & Slide Index (20px) -->
            <div class="flex items-center justify-between w-full mb-3 shrink-0">
              <span class="inline-flex items-center bg-amber-100 text-amber-800 font-bold px-4 py-1 rounded-full border-2 border-amber-300" style="font-size: 20px;">
                <i class="fa-solid fa-layer-group text-amber-600 mr-2 text-base"></i>${wordObj.category}
              </span>
              <span class="font-fredoka font-black text-slate-400 bg-slate-100 px-4 py-1 rounded-full border border-slate-200" style="font-size: 20px;">
                ${pageNumber} / ${totalWords}
              </span>
            </div>

            <!-- Main Content Area: Left Cards + Right Mascot Tip Box -->
            <div class="flex-1 flex flex-col md:flex-row gap-5 md:gap-6 items-stretch overflow-y-auto md:overflow-visible pr-1 md:pr-0">
              
              <!-- LEFT COLUMN: Word Header + Collocations + Sentence -->
              <div class="flex-1 flex flex-col justify-between space-y-4">
                
                <!-- Word Title + Speaker + POS/Chinese Pill -->
                <div class="flex flex-wrap items-center gap-3 md:gap-4 shrink-0">
                  <h2 class="font-fredoka font-black text-brand-orange leading-tight tracking-tight hover:scale-105 transition-transform cursor-pointer" 
                      style="font-size: 58px;" 
                      onclick="speakText('${wordObj.word}')" 
                      title="點擊朗讀單字">
                    ${wordObj.word}
                  </h2>
                  
                  <!-- Speak Button -->
                  <button onclick="speakText('${wordObj.word}')" class="pulse-btn w-12 h-12 bg-amber-100 hover:bg-amber-200 text-brand-orange rounded-2xl border-2 border-amber-300 flex items-center justify-center text-2xl shadow-sm transition-all" title="播放發音">
                    <i class="fa-solid fa-volume-high"></i>
                  </button>

                  <!-- Chinese & POS Capsule (26px, Sky blue pill) -->
                  <span class="inline-flex items-center bg-brand-skyLight text-brand-skyDark border-2 md:border-3 border-brand-sky font-black px-4 py-1.5 rounded-full shadow-sm" style="font-size: 26px;">
                    ${wordObj.word} ${wordObj.chinese} ${wordObj.pos}
                  </span>
                </div>

                <!-- Collocation Card (常用搭配詞) -->
                <div class="bg-amber-50/70 rounded-2xl p-4 md:p-5 border-2 border-amber-200 shadow-3d-subtle">
                  <div class="flex items-center gap-2 text-amber-800 font-bold mb-2" style="font-size: 24px;">
                    <i class="fa-solid fa-puzzle-piece text-amber-500"></i>
                    <span>常用搭配詞</span>
                  </div>
                  <div class="text-slate-700 font-medium leading-relaxed pl-1" style="font-size: 23px;">
                    ${wordObj.collocations}
                  </div>
                </div>

                <!-- Practical Sentence Card (實用例句) -->
                <div class="bg-blue-50/70 rounded-2xl p-4 md:p-5 border-2 border-blue-200 shadow-3d-card relative">
                  <div class="flex items-center justify-between mb-2">
                    <div class="flex items-center gap-2 text-sky-800 font-bold" style="font-size: 24px;">
                      <i class="fa-solid fa-comment-dots text-sky-500"></i>
                      <span>實用例句</span>
                    </div>
                    <!-- Independent Sentence Audio Button -->
                    <button onclick="speakText(\`${wordObj.sentenceEn}\`)" class="pulse-btn px-3 py-1 bg-white hover:bg-sky-100 text-sky-700 border-2 border-sky-300 rounded-xl font-bold text-sm shadow-sm flex items-center gap-1.5 transition-all">
                      <i class="fa-solid fa-volume-high text-sky-500"></i>
                      <span>唸整句</span>
                    </button>
                  </div>
                  <div class="text-sky-950 font-semibold mb-1 leading-snug font-fredoka" style="font-size: 25px;">
                    ${wordObj.sentenceEn}
                  </div>
                  <div class="text-slate-600 font-normal leading-snug" style="font-size: 23px;">
                    ${wordObj.sentenceZh}
                  </div>
                </div>

              </div>

              <!-- RIGHT COLUMN: Fun Association Panel (Desktop 440px x 500px) -->
              <div class="w-full md:w-[440px] md:h-[500px] bg-gradient-to-b from-yellow-50 to-orange-50 rounded-3xl border-3 border-amber-300 shadow-3d-subtle p-5 md:p-6 flex flex-col justify-between shrink-0">
                <!-- Top Badge: 趣味聯想 Badge + Situation tag (20px) -->
                <div class="flex items-center justify-between w-full mb-2">
                  <span class="inline-flex items-center gap-1.5 bg-orange-500 text-white font-black px-3.5 py-1 rounded-xl shadow-sm text-base">
                    <i class="fa-solid fa-lightbulb"></i>
                    <span>趣味聯想</span>
                  </span>
                  <span class="text-amber-800 font-bold bg-white/80 px-3 py-1 rounded-xl border border-amber-200" style="font-size: 20px;">
                    <i class="fa-solid fa-compass text-amber-500 mr-1.5"></i>${wordObj.situation}
                  </span>
                </div>

                <!-- Center Cute Vector Illustration/Badge -->
                <div class="my-auto flex flex-col items-center justify-center p-4">
                  <div class="w-28 h-28 md:w-36 md:h-36 bg-white rounded-full border-4 border-amber-300 shadow-inner flex items-center justify-center transform hover:rotate-6 transition-transform">
                    <i class="${wordObj.icon} ${wordObj.iconColor} text-5xl md:text-7xl"></i>
                  </div>
                  <div class="mt-3 font-fredoka font-black text-amber-900 text-2xl tracking-wide">
                    ${wordObj.word.toUpperCase()}
                  </div>
                </div>

                <!-- Mascot Tip Box (Strictly 24px desktop, 20px mobile) -->
                <div class="bg-white/95 rounded-2xl p-4 border-2 border-amber-200 shadow-sm text-amber-950 font-bold text-left leading-relaxed">
                  <p class="text-[20px] md:text-[24px]">${wordObj.mascotTip}</p>
                </div>
              </div>

            </div>

          </div>
        `;
      }

      // Update control elements
      updateControls();

      // Trigger Auto-Pronunciation if enabled and not on cover
      if (autoSpeakEnabled && currentIndex > 0) {
        const wordObj = weekData.words[currentIndex - 1];
        setTimeout(() => {
          speakText(wordObj.word);
        }, 120);
      }
    }

    // Update toolbar buttons, progress bar and jump select
    function updateControls() {
      const totalSlides = weekData.words.length; // 20
      const select = document.getElementById('slide-select');
      const prevBtn = document.getElementById('btn-prev');
      const nextBtn = document.getElementById('btn-next');
      const progressBar = document.getElementById('progress-bar-fill');
      const progressText = document.getElementById('progress-text');
      const progressPct = document.getElementById('progress-pct');

      // Update select value
      select.value = currentIndex;

      // Update disabled status
      prevBtn.disabled = (currentIndex === 0);
      prevBtn.classList.toggle('opacity-50', currentIndex === 0);
      prevBtn.classList.toggle('cursor-not-allowed', currentIndex === 0);

      nextBtn.disabled = (currentIndex === totalSlides);
      nextBtn.classList.toggle('opacity-50', currentIndex === totalSlides);
      nextBtn.classList.toggle('cursor-not-allowed', currentIndex === totalSlides);

      // Calculate progress percentage
      const pct = Math.round((currentIndex / totalSlides) * 100);
      progressBar.style.width = `${pct}%`;
      progressPct.innerText = `${pct}%`;

      if (currentIndex === 0) {
        progressText.innerText = `封面 (${weekData.dateTag})`;
      } else {
        const currentWord = weekData.words[currentIndex - 1];
        progressText.innerText = `${currentIndex}/${totalSlides} · ${currentWord.word}`;
      }
    }

    // Populate Slide Select options
    function initSelectDropdown() {
      const select = document.getElementById('slide-select');
      select.innerHTML = '';

      // Cover Option
      const coverOpt = document.createElement('option');
      coverOpt.value = 0;
      coverOpt.textContent = '🌟 封面頁 (W03)';
      select.appendChild(coverOpt);

      // Words Options
      weekData.words.forEach((w, index) => {
        const opt = document.createElement('option');
        opt.value = index + 1;
        opt.textContent = `${String(index + 1).padStart(2, '0')}. ${w.word} (${w.chinese})`;
        select.appendChild(opt);
      });
    }

    // Navigation helpers
    function goToPrevSlide() {
      if (currentIndex > 0) {
        currentIndex--;
        renderSlide();
      }
    }

    function goToNextSlide() {
      if (currentIndex < weekData.words.length) {
        currentIndex++;
        renderSlide();
      }
    }

    function jumpToSlide(index) {
      if (index >= 0 && index <= weekData.words.length) {
        currentIndex = index;
        renderSlide();
      }
    }

    function speakCurrentWord() {
      if (currentIndex === 0) {
        speakText("Welcome to English vocabulary class!");
      } else {
        const wordObj = weekData.words[currentIndex - 1];
        speakText(wordObj.word);
      }
    }

    function toggleAutoSpeak() {
      autoSpeakEnabled = !autoSpeakEnabled;
      const btn = document.getElementById('btn-auto-speak');
      const icon = document.getElementById('auto-speak-icon');

      if (autoSpeakEnabled) {
        icon.className = 'fa-solid fa-toggle-on text-base text-blue-600';
        btn.classList.add('bg-blue-50', 'text-blue-700', 'border-blue-400');
        btn.classList.remove('bg-slate-100', 'text-slate-500', 'border-slate-300');
      } else {
        icon.className = 'fa-solid fa-toggle-off text-base text-slate-400';
        btn.classList.remove('bg-blue-50', 'text-blue-700', 'border-blue-400');
        btn.classList.add('bg-slate-100', 'text-slate-500', 'border-slate-300');
      }
    }

    // Dynamic 16:9 stage scaling for desktop & natural flow on mobile
    function fitPresentationStage() {
      const container = document.getElementById('stage-container');
      const stage = document.getElementById('presentation-stage');
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight - 68; // subtract control bar height

      if (windowWidth >= 768) {
        // Desktop / Tablet Landscape mode: scale 1200x675
        const targetWidth = 1200;
        const targetHeight = 675;
        const scaleX = (windowWidth - 32) / targetWidth;
        const scaleY = (windowHeight - 24) / targetHeight;
        const scale = Math.min(scaleX, scaleY, 1.15);

        stage.style.width = `${targetWidth}px`;
        stage.style.height = `${targetHeight}px`;
        stage.style.transform = `scale(${scale})`;
        stage.style.position = 'relative';
        container.classList.remove('overflow-y-auto');
      } else {
        // Mobile portrait mode (< 768px): free responsive layout
        stage.style.width = '100%';
        stage.style.height = '100%';
        stage.style.transform = 'none';
        stage.style.position = 'relative';
        container.classList.add('overflow-y-auto', 'mobile-scroll-container');
      }
    }

    // Fullscreen Toggle
    function toggleFullscreen() {
      const icon = document.getElementById('fullscreen-icon');
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          icon.className = 'fa-solid fa-compress';
        }).catch(err => {
          console.warn(`Fullscreen error: ${err.message}`);
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().then(() => {
            icon.className = 'fa-solid fa-expand';
          });
        }
      }
    }

    // Keyboard Shortcuts (Left / Right / Space / F)
    window.addEventListener('keydown', (e) => {
      // Don't trigger if user is selecting dropdown
      if (document.activeElement && document.activeElement.tagName === 'SELECT') return;

      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        goToNextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        goToPrevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // Touch Swipe Gesture for mobile/tablets
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;

      // Ensure horizontal swipe is dominant and above threshold
      if (Math.abs(deltaX) > 45 && Math.abs(deltaX) > Math.abs(deltaY) * 1.5) {
        if (deltaX < 0) {
          // Swipe Left -> Next
          goToNextSlide();
        } else {
          // Swipe Right -> Prev
          goToPrevSlide();
        }
      }
    }, { passive: true });

    // Handle resize & orientation change
    window.addEventListener('resize', fitPresentationStage);
    window.addEventListener('orientationchange', fitPresentationStage);

    // Initial launch
    window.addEventListener('DOMContentLoaded', () => {
      initSelectDropdown();
      fitPresentationStage();
      renderSlide();
    });
  </script>
</body>
</html>
