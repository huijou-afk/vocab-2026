<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2026 一起背單字 (國小組) - [W04]</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Font Awesome Free Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  
  <!-- Google Fonts: Fredoka & Noto Sans TC -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            fredoka: ['Fredoka', 'sans-serif'],
            noto: ['Noto Sans TC', 'sans-serif'],
          },
          colors: {
            brand: {
              cream: '#fffdf7',
              yellow: '#fef08a',
              yellowBorder: '#facc15',
              orange: '#ea580c',
              orangeDark: '#c2410c',
              sky: '#38bdf8',
              skyDark: '#0284c7',
              skyLight: '#e0f2fe',
              bubble: '#fef9c3',
              cardBg: '#ffffff',
            }
          },
          boxShadow: {
            '3d-yellow': '0 8px 0 #eab308, 0 14px 20px rgba(0,0,0,0.06)',
            '3d-orange': '0 6px 0 #c2410c, 0 10px 15px rgba(234,88,12,0.2)',
            '3d-blue': '0 6px 0 #0369a1, 0 10px 15px rgba(2,132,199,0.2)',
            '3d-subtle': '0 6px 0 #fde047, 0 10px 16px rgba(0,0,0,0.04)',
            '3d-card': '0 5px 0 #cbd5e1, 0 8px 12px rgba(0,0,0,0.03)',
            'control': '0 -4px 16px rgba(0,0,0,0.06)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background-color: #fffdf7;
      color: #334155;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Floating decorative bubbles and stars */
    .bg-decor {
      position: absolute;
      pointer-events: none;
      z-index: 0;
      opacity: 0.65;
    }

    /* Fixed 16:9 Presentation Stage */
    #stage-container {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: calc(100vh - 68px);
      position: relative;
      overflow: hidden;
    }

    #presentation-stage {
      width: 1200px;
      height: 675px;
      position: relative;
      transform-origin: center center;
      transition: transform 0.15s ease-out;
      flex-shrink: 0;
    }

    /* Scrollbar styling for small screen fluid view */
    .mobile-scroll-container::-webkit-scrollbar {
      width: 6px;
    }
    .mobile-scroll-container::-webkit-scrollbar-thumb {
      background-color: #fde047;
      border-radius: 9999px;
    }

    /* Slide transition pop-in */
    .slide-enter {
      animation: popIn 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes popIn {
      0% {
        opacity: 0;
        transform: scale(0.97) translateY(8px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .pulse-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 currentColor !important;
    }

    /* Audio wave animation effect */
    .audio-wave.playing {
      animation: waveBeat 0.8s infinite ease-in-out;
    }
    @keyframes waveBeat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col bg-[#fffdf7]">

  <!-- Background decorative floating stars & shapes -->
  <div class="bg-decor top-4 left-6 text-yellow-300 text-3xl animate-bounce" style="animation-duration: 3s;">
    <i class="fa-solid fa-star"></i>
  </div>
  <div class="bg-decor bottom-24 right-10 text-amber-200 text-4xl animate-pulse">
    <i class="fa-solid fa-star"></i>
  </div>
  <div class="bg-decor top-20 right-14 text-orange-200 text-2xl">
    <i class="fa-solid fa-sparkles"></i>
  </div>
  <div class="bg-decor bottom-32 left-12 text-yellow-200 text-3xl">
    <i class="fa-solid fa-cloud"></i>
  </div>

  <!-- Main Presentation Stage Area (No top header) -->
  <main id="stage-container" class="flex-1">
    <div id="presentation-stage" class="relative">
      <div id="slide-viewport" class="w-full h-full p-4 md:p-6 flex items-center justify-center">
        <!-- Dynamic slide content injected by JavaScript -->
      </div>
    </div>
  </main>

  <!-- Bottom Control Bar (Compact, anti-break layout) -->
  <footer class="h-[68px] w-full bg-white/95 backdrop-blur-md border-t-2 border-yellow-300 z-50 px-3 md:px-6 flex items-center justify-between shadow-control shrink-0">
    <!-- Left: Navigation buttons -->
    <div class="flex items-center space-x-2 shrink-0">
      <button id="btn-prev" onclick="goToPrevSlide()" class="pulse-btn px-3 py-2 md:px-4 md:py-2 bg-yellow-400 hover:bg-yellow-500 text-amber-950 font-bold rounded-xl border-2 border-yellow-500 shadow-[0_3px_0_#ca8a04] flex items-center gap-1.5 transition-all text-sm md:text-base">
        <i class="fa-solid fa-arrow-left"></i>
        <span class="hidden sm:inline">上一頁</span>
      </button>
      <button id="btn-next" onclick="goToNextSlide()" class="pulse-btn px-3 py-2 md:px-4 md:py-2 bg-yellow-400 hover:bg-yellow-500 text-amber-950 font-bold rounded-xl border-2 border-yellow-500 shadow-[0_3px_0_#ca8a04] flex items-center gap-1.5 transition-all text-sm md:text-base">
        <span class="hidden sm:inline">下一頁</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>

    <!-- Center: Jump Dropdown & Progress Bar -->
    <div class="flex items-center space-x-2 md:space-x-4 max-w-[480px] w-full mx-2 md:mx-4">
      <!-- Jump Dropdown Select -->
      <div class="relative shrink-0">
        <select id="slide-select" onchange="jumpToSlide(parseInt(this.value))" class="appearance-none bg-yellow-50 hover:bg-yellow-100 font-bold text-amber-950 border-2 border-yellow-400 rounded-xl px-2.5 py-1.5 pr-7 text-xs md:text-sm cursor-pointer outline-none focus:ring-2 focus:ring-yellow-40
