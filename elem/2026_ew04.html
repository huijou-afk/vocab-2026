  <script>
    let currentSlide = 0; // 0 = Cover, 1..20 = Vocab cards

    // Desktop/Tablet proportional 16:9 stage scaling
    function fitPresentationStage() {
      const stage = document.getElementById('stage-container');
      const wrapper = document.getElementById('presentation-wrapper');
      if (!stage || !wrapper) return;

      if (window.innerWidth >= 768) {
        const availableW = window.innerWidth - 32;
        const availableH = window.innerHeight - 90; // account for bottom bar

        const targetW = 1200;
        const targetH = 675;

        const scaleX = availableW / targetW;
        const scaleY = availableH / targetH;
        const scale = Math.min(scaleX, scaleY, 1.25); // cap at 1.25x for ultra wide

        stage.style.transform = `translate(-50%, -50%) scale(${scale})`;
      } else {
        stage.style.transform = 'none';
      }
    }

    window.addEventListener('resize', fitPresentationStage);
    window.addEventListener('orientationchange', () => {
      setTimeout(fitPresentationStage, 200);
    });

    // Populate Slide select menu
    function initSelectDropdown() {
      const select = document.getElementById('slide-select');
      select.innerHTML = '';

      const coverOption = document.createElement('option');

      vocabData.forEach((item, index) => {

        const num = String(index + 1).padStart(2, '0');
        opt.textContent = `${num}. ${item.word}`;

    function onSelectSlideChange(val) {
      renderSlide(parseInt(val, 10));
    }
  </script>

  <script>

      const percent = (currentSlide / totalVocab) * 100;
      if (progressFill) progressFill.style.width = `${percent}%`;
      if (progressIndicator) {
        progressIndicator.textContent = currentSlide === 0

      // Auto speech trigger if not cover

  <script>
    // Speech Synthesis implementation with correction dictionary
    function getCleanSpeechText(text) {
      const trimmed = text.trim();
      if (pronunciationMap[trimmed]) {
        return pronunciationMap[trimmed];
      }
      return trimmed;
    }

    function speakText(rawText, lang = 'en-US') {
      if (!('speechSynthesis' in window)) return;

      window.speechSynthesis.cancel(); // Cancel any ongoing utterance

      const speechText = getCleanSpeechText(rawText);
      const utterance = new SpeechSynthesisUtterance(speechText);
      utterance.lang = lang;
      utterance.rate = 0.85; // slightly slower for elementary school learners
      utterance.pitch = 1.05; // clear and friendly pitch

      // Attempt to pick a natural high-quality English voice if available
      const voices = window.speechSynthesis.getVoices();
      const preferredVoice = voices.find(v => (v.lang === 'en-US' || v.lang.startsWith('en')) && (v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('Google')));
      if (preferredVoice) {
        utterance.voice = preferredVoice;
      }

      window.speechSynthesis.speak(utterance);
    }

    function speakSentence(rawText) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utterance = new SpeechSynthesisUtterance(rawText);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    function speakCurrentWord() {
      if (currentSlide === 0) {
        speakSentence("Welcome to English vocabulary quest!");
      } else {
        const item = vocabData[currentSlide - 1];
        speakText(item.word);
      }
    }

    function toggleAutoSpeech() {
      autoSpeechEnabled = !autoSpeechEnabled;
      const statusSpan = document.getElementById('auto-speech-status');
      const icon = document.getElementById('auto-speech-icon');
      const btn = document.getElementById('btn-auto-speech');

      if (autoSpeechEnabled) {
        statusSpan.textContent = 'ON';
        statusSpan.className = 'bg-sky-700/80 px-1.5 py-0.5 rounded text-[11px] uppercase tracking-wider font-extrabold';
        icon.className = 'fa-solid fa-bolt text-yellow-300';
        btn.classList.replace('bg-slate-400', 'bg-sky-500');
      } else {
        statusSpan.textContent = 'OFF';
        statusSpan.className = 'bg-slate-700/80 px-1.5 py-0.5 rounded text-[11px] uppercase tracking-wider font-extrabold';
        icon.className = 'fa-solid fa-bolt-slash text-slate-300';
        btn.classList.replace('bg-sky-500', 'bg-slate-400');
      }
    }
  </script>

  <script>
    function goToNextSlide() {
      if (currentSlide < totalVocab) {
        renderSlide(currentSlide + 1);
      } else {
        // Loop back to cover or stay
        renderSlide(0);
      }
    }

    function goToPrevSlide() {
      if (currentSlide > 0) {
        renderSlide(currentSlide - 1);
      } else {
        renderSlide(totalVocab); // Go to last
      }
    }

    // Keyboard navigation (←, →, Space, F)
    window.addEventListener('keydown', (e) => {
      // Ignore if user is currently inside an active input or select
      if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

      if (e.key === 'ArrowRight' || e.code === 'Space') {
        e.preventDefault();
        goToNextSlide();
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        goToPrevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // Touch Swipe gesture support for mobile tablets
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const deltaX = touchEndX - touchStartX;
      const deltaY = touchEndY - touchStartY;

      // Only trigger if horizontal swipe is significant and dominant over vertical scroll
      if (Math.abs(deltaX) > 55 && Math.abs(deltaX) > Math.abs(deltaY) * 1.4) {
        if (deltaX < 0) {
          goToNextSlide(); // Swipe Left -> Next
        } else {
          goToPrevSlide(); // Swipe Right -> Prev
        }
      }
    }, { passive: true });

    // Fullscreen API implementation with maximize/minimize icon toggle
    function toggleFullscreen() {
      const icon = document.getElementById('fullscreen-icon');
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().then(() => {
          if (icon) icon.className = 'fa-solid fa-compress text-base sm:text-lg';
          setTimeout(fitPresentationStage, 250);
        }).catch(() => {
          // Fullscreen prevented or not supported
        });
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().then(() => {
            if (icon) icon.className = 'fa-solid fa-expand text-base sm:text-lg';
            setTimeout(fitPresentationStage, 250);
          });
        }
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const icon = document.getElementById('fullscreen-icon');
      if (document.fullscreenElement) {
        if (icon) icon.className = 'fa-solid fa-compress text-base sm:text-lg';
      } else {
        if (icon) icon.className = 'fa-solid fa-expand text-base sm:text-lg';
      }
      setTimeout(fitPresentationStage, 200);
    });

    // Initial load setup
    window.addEventListener('load', () => {
      initSelectDropdown();
      renderSlide(0); // Show cover first
      fitPresentationStage();

      // Preload voices for speech synthesis
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          window.speechSynthesis.getVoices();
        };
      }
    });
  </script>
