  <style>
    :root {
      --bg-cream: #FFFDF7;
      --primary-yellow: #FFCF25;
      --border-yellow: #F59E0B;
      --btn-orange: #FF7A00;
      --bubble-blue: #38BDF8;
    }
    
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    
    body {
      background-color: var(--bg-cream);
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
    }

    /* 可愛童趣風背景點綴 */
    .bg-pattern {
      background-image: 
        radial-gradient(#FDE68A 15%, transparent 16%),
        radial-gradient(#BAE6FD 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      opacity: 0.35;
    }

    /* 立體可愛卡片樣式 */
    .toy-border {
      border: 4px solid #F59E0B;
      box-shadow: 0 8px 0px #D97706, 0 14px 20px rgba(0,0,0,0.08);
      border-radius: 32px;
    }
    
    .toy-border-sub {
      border: 3px solid #E2E8F0;
      box-shadow: 0 5px 0px #CBD5E1;
      border-radius: 20px;
    }

    .toy-button {
      transition: all 0.15s ease;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
    }
    .toy-button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.15);
    }

    /* 寬螢幕等比縮放容器 (1200 x 675) */
    #presentation-stage {
      width: 1200px;
      height: 675px;
      transform-origin: center center;
      position: absolute;
      top: 50%;
      left: 50%;
      margin-top: -337.5px;
      margin-left: -600px;
    }

    /* 手機直向模式 (寬度 < 768px) 流式滿版自適應 */
    @media (max-width: 767px) {
      body {
        overflow-y: auto;
      }
      #presentation-stage {
        position: relative !important;
        width: 100% !important;
        height: auto !important;
        min-height: calc(100vh - 76px);
        top: 0 !important;
        left: 0 !important;
        margin: 0 !important;
        transform: none !important;
        padding-bottom: 90px;
      }
      .slide-container {
        border-radius: 20px !important;
        padding: 1.25rem !important;
        margin: 0.75rem !important;
        height: auto !important;
      }
      .mobile-stack {
        flex-direction: column !important;
      }
      .mobile-full {
        width: 100% !important;
        height: auto !important;
      }
      .mobile-title {
        font-size: 38px !important;
        line-height: 1.1 !important;
      }
      .mobile-badge {
        font-size: 18px !important;
        padding: 4px 12px !important;
      }
      .mobile-tip {
        font-size: 20px !important;
      }
    }

    /* 發音校正映射字典 */

      "I": "eye",
      "Mr.": "Mister",
      "Mrs.": "Missus",
      "Ms.": "Miz",
      "Dr.": "Doctor",
      "St.": "Saint",

    /* ==========================================================
       3. 響應式等比例縮放計算 (fitPresentationStage)
       ========================================================== */
    function fitPresentationStage() {
      const windowWidth = window.innerWidth;
      const windowHeight = window.innerHeight;

      // 手機直向模式 (寬度 < 768px) 取消固定縮放，回歸流式排版
      if (windowWidth < 768) {
        stage.style.transform = 'none';
        return;
      }

      // 桌機與橫向平板依 1200 x 675 (16:9) 進行安全縮放 (扣除底部 70px)
      const baseWidth = 1200;
      const baseHeight = 675;
      const availableHeight = windowHeight - 74;

      const scaleX = (windowWidth * 0.96) / baseWidth;
      const scaleY = (availableHeight * 0.94) / baseHeight;
      const scale = Math.min(scaleX, scaleY, 1.25); // 上限 1.25 倍避免字體模糊

      stage.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', fitPresentationStage);

    /* ==========================================================
       4. 語音朗讀合成 (SpeechSynthesis)
       ========================================================== */
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel(); // 停止目前朗讀

      const cleanText = text.trim();
      const speakTarget = PRONUNCIATION_MAP[cleanText] || cleanText;
      const utterance = new SpeechSynthesisUtterance(speakTarget);
      
      utterance.lang = 'en-US';
      utterance.rate = 0.85; // 專為國小學童設計的清晰適中語速
      utterance.pitch = 1.05; // 稍微輕快活潑的音調

      // 嘗試挑選優質英文語音
      const voices = window.speechSynthesis.getVoices();
      const enVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha')));
      if (enVoice) utterance.voice = enVoice;

      window.speechSynthesis.speak(utterance);
    }

        pageCounter.textContent = `${paddedCur} / ${totalCards}`;
        const pct = (currentIndex / totalCards) * 100;
        progressBar.style.width = `${pct}%`;
        btnSpeak.disabled = false;
        btnSpeak.classList.remove('opacity-40', 'cursor-not-allowed');
      }
      jumpSelect.value = currentIndex;

      // 封面頁渲染
      if (currentIndex === 0) {
        viewport.innerHTML = `
          <div class="slide-container toy-border bg-white w-full h-full flex flex-col items-center justify-center p-8 md:p-12 relative overflow-hidden text-center">
            <!-- 裝飾星星圖案 -->
            <i class="fa-solid fa-star text-amber-300 text-3xl absolute top-8 left-10 animate-bounce"></i>
            <i class="fa-solid fa-shapes text-sky-200 text-4xl absolute bottom-12 right-12"></i>
            <i class="fa-solid fa-pencil text-rose-300 text-3xl absolute top-12 right-16"></i>

            <div class="inline-flex items-center space-x-2 bg-amber-100 text-amber-800 px-6 py-2 rounded-full font-bold text-lg mb-6 border border-amber-300 shadow-sm">
              <i class="fa-solid fa-calendar-check text-amber-600"></i>
              <span>${WEEK_DATA.subTitle}</span>
            </div>

            <h1 class="text-4xl md:text-6xl font-black text-amber-500 tracking-wider mb-6 drop-shadow-sm">
              ${WEEK_DATA.title}
            </h1>

            <div class="w-24 h-2 bg-amber-400 rounded-full mb-8"></div>

            <div class="flex flex-wrap justify-center gap-3 max-w-2xl mb-8">
              ${WEEK_DATA.categories.map(cat => `
                <span class="bg-amber-50 text-amber-900 border-2 border-amber-300 px-5 py-2 rounded-full font-bold text-lg shadow-sm">
                  # ${cat}
                </span>
              `).join('')}
            </div>

            <button onclick="changePage(1)" class="toy-button bg-amber-400 hover:bg-amber-500 text-amber-950 font-black text-xl px-10 py-4 rounded-full border-2 border-amber-500 shadow-md flex items-center space-x-3 active:scale-95 transition cursor-pointer">
              <span>開始學習單字</span>
              <i class="fa-solid fa-circle-arrow-right"></i>
            </button>
          </div>
        `;
        return;
      }

      // 單字卡頁渲染 (左右雙欄)
      const data = VOCABULARY_LIST[currentIndex - 1];
      const pageNumberStr = `${String(currentIndex).padStart(2, '0')} / ${String(totalCards).padStart(2, '0')}`;

      viewport.innerHTML = `
        <div class="slide-container toy-border bg-white w-full h-full p-8 flex flex-col justify-between relative overflow-hidden">
          
          <!-- 頂部資訊列：左上方分類標籤 (20px) 與 右上方頁碼 (20px) -->
          <div class="flex justify-between items-center w-full mb-3">
            <span class="bg-amber-100 text-amber-900 px-4 py-1.5 rounded-full font-bold border border-amber-300 shadow-sm" style="font-size: 20px;">
              <i class="fa-solid fa-tag text-amber-600 mr-1.5"></i>${data.category}
            </span>
            <span class="font-bold text-amber-700 bg-amber-50 px-4 py-1.5 rounded-full border border-amber-200" style="font-size: 20px;">
              ${pageNumberStr}
            </span>
          </div>

          <!-- 主體雙欄排版 -->
          <div class="flex flex-1 items-stretch gap-6 mobile-stack">
            
            <!-- 左欄：單字主體與學習卡片 -->
            <div class="flex-1 flex flex-col justify-between">
              
              <!-- 單字標題區：單字 (64px 暖橘色) + 發音鍵 + 詞性與中文對應標籤 (26px 天藍色膠囊框) -->
              <div class="flex flex-wrap items-center gap-3 my-2">
                <span class="font-black text-[#FF7A00] tracking-tight leading-none mobile-title" style="font-size: 64px;">
                  ${data.word}
                </span>
                <button onclick="speakCurrentWord()" title="播放發音" class="toy-button bg-amber-100 hover:bg-amber-200 text-amber-700 border-2 border-amber-300 w-12 h-12 rounded-full flex items-center justify-center text-xl cursor-pointer">
                  <i class="fa-solid fa-volume-high"></i>
                </button>
                <div class="bg-sky-100 text-sky-900 border-2 border-sky-300 px-4 py-1.5 rounded-full font-bold shadow-sm mobile-badge" style="font-size: 26px;">
                  ${data.meaning} <span class="text-sky-700 font-semibold">${data.pos}</span>
                </div>
              </div>

              <!-- 常用搭配詞卡片：標題 24px、內容 23px -->
              <div class="toy-border-sub bg-amber-50/70 p-4 mb-3">
                <div class="font-bold text-amber-900 flex items-center mb-1.5" style="font-size: 24px;">
                  <i class="fa-solid fa-puzzle-piece text-amber-600 mr-2"></i>常用搭配詞
                </div>
                <div class="text-stone-800 font-medium leading-relaxed pl-1" style="font-size: 23px;">
                  ${data.collocation}
                </div>
              </div>

              <!-- 實用例句卡片：標題 24px、獨立發音按鈕、英文例句 25px、中文 23px -->
              <div class="toy-border-sub bg-sky-50/70 p-4">
                <div class="flex items-center justify-between mb-1.5">
                  <div class="font-bold text-sky-950 flex items-center" style="font-size: 24px;">
                    <i class="fa-solid fa-comment-dots text-sky-600 mr-2"></i>生活實用例句
                  </div>
                  <button onclick="speakSentence()" title="朗讀例句" class="toy-button bg-sky-200 hover:bg-sky-300 text-sky-800 px-3 py-1 rounded-full text-sm font-bold flex items-center space-x-1.5 border border-sky-400 cursor-pointer">
                    <i class="fa-solid fa-volume-high text-xs"></i>
                    <span>念例句</span>
                  </button>
                </div>
                <div class="text-slate-900 font-bold leading-snug mb-1" style="font-size: 25px;">
                  ${data.sentence}
                </div>
                <div class="text-stone-600 font-medium" style="font-size: 23px;">
                  ${data.sentenceCn}
                </div>
              </div>

            </div>

            <!-- 右側趣味聯想面板 (固定尺寸 440px × 500px，手機滿版自適應) -->
            <div class="w-[440px] h-[500px] toy-border-sub bg-gradient-to-b from-amber-50 to-orange-50 p-5 flex flex-col justify-between items-center text-center mobile-full shrink-0">
              <!-- 頂部標籤 (20px) -->
              <div class="w-full flex justify-between items-center">
                <span class="bg-amber-400 text-amber-950 px-3 py-1 rounded-full font-black text-sm uppercase tracking-wide">
                  Fun Memory
                </span>
                <span class="font-bold text-amber-800 flex items-center" style="font-size: 20px;">
                  <i class="fa-solid fa-lightbulb text-amber-500 mr-1.5"></i>情境聯想
                </span>
              </div>

              <!-- 可愛主題情境大向量圖示 -->
              <div class="flex-1 flex items-center justify-center my-2">
                <div class="w-36 h-36 bg-white rounded-full flex items-center justify-center border-4 border-amber-300 shadow-md transform hover:rotate-6 transition-transform">
                  <i class="fa-solid ${data.icon} text-amber-500 text-6xl"></i>
                </div>
              </div>

              <!-- 底部 Mascot Tip 記憶提示文字 (嚴格要求 24px，手機 20px) -->
              <div class="w-full bg-white/95 rounded-2xl p-4 border-2 border-amber-200 shadow-sm">
                <p class="font-bold text-amber-950 leading-snug mobile-tip" style="font-size: 24px;">
                  ${data.tip}
                </p>
              </div>
            </div>

          </div>
        </div>
      `;

      // 若啟用自動朗讀，翻頁即朗讀該頁單字
      if (autoSpeak) {
        speakCurrentWord();
      }
    }

    /* ==========================================================
       6. 朗讀與控制功能
       ========================================================== */
    function speakCurrentWord() {
      if (currentIndex > 0 && currentIndex <= totalCards) {
        speakText(VOCABULARY_LIST[currentIndex - 1].word);
      }
    }

    function speakSentence() {
      if (currentIndex > 0 && currentIndex <= totalCards) {
        speakText(VOCABULARY_LIST[currentIndex - 1].sentence);
      }
    }

    function changePage(targetIndex) {
      if (targetIndex < 0) targetIndex = 0;
      if (targetIndex >= totalPages) targetIndex = totalPages - 1;
      currentIndex = targetIndex;
      render();
    }

    /* 全螢幕切換 */
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
        fsIcon.classList.remove('fa-expand');
        fsIcon.classList.add('fa-compress');
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
          fsIcon.classList.remove('fa-compress');
          fsIcon.classList.add('fa-expand');
        }
      }
    }

    /* ==========================================================
       7. 下拉選單與事件監聽綁定
       ========================================================== */
    function populateJumpSelect() {
      jumpSelect.innerHTML = '';
      
      const coverOpt = document.createElement('option');
      coverOpt.value = '0';
      coverOpt.textContent = '📖 簡報封面';
      jumpSelect.appendChild(coverOpt);

      VOCABULARY_LIST.forEach((item, index) => {
        const opt = document.createElement('option');
        opt.value = index + 1;
        const pageNum = String(index + 1).padStart(2, '0');
        opt.textContent = `${pageNum}. ${item.word} (${item.meaning})`;
        jumpSelect.appendChild(opt);
      });
    }

    // 按鈕綁定
    btnPrev.addEventListener('click', () => changePage(currentIndex - 1));
    btnNext.addEventListener('click', () => changePage(currentIndex + 1));
    btnSpeak.addEventListener('click', speakCurrentWord);
    
    // 自動朗讀切換
    btnToggleAuto.addEventListener('click', () => {
      autoSpeak = !autoSpeak;
      if (autoSpeak) {
        autoSpeakIcon.className = "fa-solid fa-toggle-on text-base";
        btnToggleAuto.className = "toy-button bg-emerald-100 text-emerald-800 border-2 border-emerald-300 px-2.5 py-1 rounded-full text-xs font-bold flex items-center space-x-1";
      } else {
        autoSpeakIcon.className = "fa-solid fa-toggle-off text-base text-gray-400";
        btnToggleAuto.className = "toy-button bg-gray-100 text-gray-600 border-2 border-gray-300 px-2.5 py-1 rounded-full text-xs font-bold flex items-center space-x-1";
      }
    });

    // 頁碼跳轉
    jumpSelect.addEventListener('change', (e) => {
      changePage(parseInt(e.target.value, 10));
    });

    btnFullscreen.addEventListener('click', toggleFullScreen);

    // 鍵盤快速鍵 (方向鍵左右、空白鍵、F 鍵)
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
      if (e.key === 'ArrowRight' || e.key === ' ') {
        e.preventDefault();
        changePage(currentIndex + 1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        changePage(currentIndex - 1);
      } else if (e.key.toLowerCase() === 'f') {
        e.preventDefault();
        toggleFullScreen();
      }
    });

    // 行動裝置觸控滑動 (Touch Swipe)
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const touchEndY = e.changedTouches[0].screenY;
      const diffX = touchEndX - touchStartX;
      const diffY = touchEndY - touchStartY;

      // 水平位移大於 50px 且垂直位移小於 80px 時觸發翻頁
      if (Math.abs(diffX) > 50 && Math.abs(diffY) < 80) {
        if (diffX < 0) {
          changePage(currentIndex + 1); // 向左滑動 -> 下一頁
        } else {
          changePage(currentIndex - 1); // 向右滑動 -> 上一頁
        }
      }
    }, { passive: true });

    /* ==========================================================
       8. 初始化啟動
       ========================================================== */
    window.addEventListener('DOMContentLoaded', () => {
      populateJumpSelect();
      fitPresentationStage();
      render();
      
      // 預加載語音列表避免第一次朗讀延遲
      if ('speechSynthesis' in window) {
        window.speechSynthesis.getVoices();
      }
    });
  </script>
</body>
</html>
